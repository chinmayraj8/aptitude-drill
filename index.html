<meta charset="utf-8">
<title>Aptitude Drill &#8212; Campus Placement Practice</title>
<style>
:root{
  --paper:#EEF2F7; --surface:#FFFFFF; --surface-2:#F6F8FB;
  --ink:#151E2D; --body:#3B4757; --muted:#6B7A8D; --line:#D9E1EA;
  --accent:#B77414; --accent-bg:#FBF1DF;
  --ok:#1F7A52; --ok-bg:#E4F3EC; --no:#B03B37; --no-bg:#FBEAE9;
  --shadow:0 1px 2px rgba(16,23,37,.06),0 8px 24px -12px rgba(16,23,37,.16);
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --sans:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{
    --paper:#0D131E; --surface:#161F2E; --surface-2:#1C2637;
    --ink:#E9EEF6; --body:#B9C4D2; --muted:#7E8DA1; --line:#2A3648;
    --accent:#E5A63C; --accent-bg:#2A2113;
    --ok:#4FBF8B; --ok-bg:#12291F; --no:#E8756E; --no-bg:#2B1614;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --paper:#0D131E; --surface:#161F2E; --surface-2:#1C2637;
  --ink:#E9EEF6; --body:#B9C4D2; --muted:#7E8DA1; --line:#2A3648;
  --accent:#E5A63C; --accent-bg:#2A2113;
  --ok:#4FBF8B; --ok-bg:#12291F; --no:#E8756E; --no-bg:#2B1614;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6);
}
:root[data-theme="light"]{
  --paper:#EEF2F7; --surface:#FFFFFF; --surface-2:#F6F8FB;
  --ink:#151E2D; --body:#3B4757; --muted:#6B7A8D; --line:#D9E1EA;
  --accent:#B77414; --accent-bg:#FBF1DF;
  --ok:#1F7A52; --ok-bg:#E4F3EC; --no:#B03B37; --no-bg:#FBEAE9;
  --shadow:0 1px 2px rgba(16,23,37,.06),0 8px 24px -12px rgba(16,23,37,.16);
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--body);
  font-family:var(--sans);font-size:16px;line-height:1.55;
  -webkit-font-smoothing:antialiased}
h1,h2,h3{color:var(--ink);text-wrap:balance;margin:0}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* &#9472;&#9472; status rail &#9472;&#9472; */
.rail{position:sticky;top:0;z-index:50;background:var(--surface);
  border-bottom:1px solid var(--line);display:flex;align-items:center;
  gap:14px;padding:10px 18px;flex-wrap:wrap}
.brand{font-weight:700;color:var(--ink);letter-spacing:-.02em;font-size:15px;
  display:flex;align-items:center;gap:8px}
.brand span{width:9px;height:9px;border-radius:2px;background:var(--accent);
  display:inline-block}
.rail .spacer{flex:1}
.stat{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:13px;
  color:var(--muted);white-space:nowrap}
.stat b{color:var(--ink);font-weight:600}
.timer{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:15px;
  font-weight:600;color:var(--accent);background:var(--accent-bg);
  padding:3px 10px;border-radius:5px;letter-spacing:.02em}
.timer.low{color:var(--no);background:var(--no-bg)}
.iconbtn{background:none;border:1px solid var(--line);color:var(--muted);
  width:32px;height:32px;border-radius:7px;cursor:pointer;font-size:14px;
  display:grid;place-items:center}
.iconbtn:hover{color:var(--ink);border-color:var(--muted)}

/* &#9472;&#9472; shell &#9472;&#9472; */
.wrap{max-width:760px;margin:0 auto;padding:26px 18px 80px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;
  padding:22px;box-shadow:var(--shadow)}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted)}

/* &#9472;&#9472; setup &#9472;&#9472; */
.hero h1{font-size:clamp(26px,5vw,36px);letter-spacing:-.025em;margin:6px 0 8px}
.hero p{margin:0;max-width:60ch}
.sub{margin-top:26px}
.sub h3{font-size:13px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--muted);font-weight:600;margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--body);
  border-radius:999px;padding:6px 13px;font-size:13.5px;cursor:pointer;
  display:inline-flex;align-items:center;gap:7px;transition:.13s}
.chip:hover{border-color:var(--accent);color:var(--ink)}
.chip.on{background:var(--accent-bg);border-color:var(--accent);color:var(--ink);
  font-weight:600}
.chip .n{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.chip.on .n{color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;
  overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:8px 16px;font-size:14px;
  cursor:pointer;color:var(--muted);font-family:inherit}
.seg button.on{background:var(--accent-bg);color:var(--ink);font-weight:600}
.seg button+button{border-left:1px solid var(--line)}
.go{margin-top:28px;width:100%;padding:14px;border:0;border-radius:10px;
  background:var(--ink);color:var(--paper);font-size:15.5px;font-weight:650;
  cursor:pointer;font-family:inherit;letter-spacing:.01em}
.go:hover{opacity:.9}
.go:disabled{opacity:.4;cursor:not-allowed}
.hint{font-size:13px;color:var(--muted);margin-top:10px;text-align:center}

/* &#9472;&#9472; question &#9472;&#9472; */
.qmeta{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.tag{font-family:var(--mono);font-size:11px;padding:2px 8px;border-radius:4px;
  background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.tag.d-Easy{color:var(--ok)} .tag.d-Hard{color:var(--no)}
.qtext{font-size:17.5px;color:var(--ink);line-height:1.5;margin-bottom:18px;
  white-space:pre-line}
.qtext table{border-collapse:collapse;margin:12px 0;font-size:13px;width:100%}
.qtext th{background:var(--surface-2);color:var(--ink);text-align:left;
  padding:5px 9px;border:1px solid var(--line);font-weight:600}
.qtext td{padding:5px 9px;border:1px solid var(--line);
  font-family:var(--mono);font-variant-numeric:tabular-nums}
.tblwrap{overflow-x:auto}
pre.pc{background:var(--surface-2);border:1px solid var(--line);
  border-left:3px solid var(--accent);border-radius:7px;padding:11px 13px;
  font-family:var(--mono);font-size:13px;line-height:1.55;overflow-x:auto;
  margin:11px 0;color:var(--ink);white-space:pre}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;align-items:center;gap:12px;padding:12px 14px;
  border:1px solid var(--line);border-radius:9px;background:var(--surface);
  cursor:pointer;text-align:left;font-size:15.5px;color:var(--body);
  font-family:inherit;transition:.12s;width:100%}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--surface-2)}
.opt:disabled{cursor:default}
.opt .k{font-family:var(--mono);font-size:12px;width:22px;height:22px;
  border-radius:5px;background:var(--surface-2);color:var(--muted);
  display:grid;place-items:center;flex:none;border:1px solid var(--line)}
.opt.sel{border-color:var(--accent);background:var(--accent-bg)}
.opt.right{border-color:var(--ok);background:var(--ok-bg);color:var(--ink)}
.opt.right .k{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.wrong{border-color:var(--no);background:var(--no-bg);color:var(--ink)}
.opt.wrong .k{background:var(--no);color:#fff;border-color:var(--no)}
.expl{margin-top:16px;padding:14px 16px;border-radius:9px;
  background:var(--surface-2);border-left:3px solid var(--accent);font-size:14.5px}
.expl .lab{font-family:var(--mono);font-size:11px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--accent);display:block;margin-bottom:5px}
.nav{display:flex;gap:10px;margin-top:18px}
.btn{flex:1;padding:12px;border-radius:9px;border:1px solid var(--line);
  background:var(--surface);color:var(--body);font-size:15px;cursor:pointer;
  font-family:inherit;font-weight:600}
.btn:hover{border-color:var(--muted);color:var(--ink)}
.btn.pri{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.pri:hover{opacity:.9}
.bar{height:3px;background:var(--line);border-radius:2px;overflow:hidden;
  margin-bottom:18px}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s}

/* &#9472;&#9472; results &#9472;&#9472; */
.score{text-align:center;padding:12px 0 20px}
.score .big{font-family:var(--mono);font-variant-numeric:tabular-nums;
  font-size:56px;font-weight:700;color:var(--ink);line-height:1;
  letter-spacing:-.03em}
.score .of{font-size:15px;color:var(--muted);font-family:var(--mono)}
.verdict{display:inline-block;margin-top:12px;padding:5px 14px;border-radius:999px;
  font-size:13.5px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
  gap:10px;margin:20px 0}
.tile{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;
  padding:12px 14px}
.tile .v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:22px;
  font-weight:700;color:var(--ink);letter-spacing:-.02em}
.tile .l{font-size:11.5px;color:var(--muted);text-transform:uppercase;
  letter-spacing:.06em;margin-top:2px;font-family:var(--mono)}
.brk{margin-top:8px}
.brow{display:flex;align-items:center;gap:12px;padding:9px 0;
  border-bottom:1px solid var(--line);font-size:14px}
.brow:last-child{border-bottom:0}
.brow .nm{flex:1;color:var(--ink)}
.meter{width:78px;height:5px;background:var(--line);border-radius:3px;
  overflow:hidden;flex:none}
.meter i{display:block;height:100%;background:var(--ok)}
.meter i.bad{background:var(--no)}
.brow .sc{font-family:var(--mono);font-variant-numeric:tabular-nums;
  font-size:13px;color:var(--muted);width:46px;text-align:right;flex:none}
.rev{margin-top:12px}
.rev details{border:1px solid var(--line);border-radius:9px;margin-bottom:8px;
  background:var(--surface);overflow:hidden}
.rev summary{padding:12px 14px;cursor:pointer;font-size:14.5px;color:var(--ink);
  display:flex;gap:10px;align-items:flex-start;list-style:none}
.rev summary::-webkit-details-marker{display:none}
.rev summary .mk{font-family:var(--mono);font-size:12px;width:20px;height:20px;
  border-radius:4px;display:grid;place-items:center;flex:none;color:#fff;margin-top:1px}
.rev summary .mk.y{background:var(--ok)} .rev summary .mk.n{background:var(--no)}
.rev .body{padding:0 14px 14px 44px;font-size:14px}
.rev .body .yours{color:var(--no)} .rev .body .corr{color:var(--ok);font-weight:600}

/* &#9472;&#9472; section chooser &#9472;&#9472; */
.pick{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:22px}
@media (max-width:600px){.pick{grid-template-columns:1fr}}
.pcard{display:flex;flex-direction:column;gap:7px;text-align:left;padding:16px;
  border:1px solid var(--line);border-radius:11px;background:var(--surface-2);
  cursor:pointer;font-family:inherit;transition:.14s}
.pcard:hover{border-color:var(--accent);background:var(--accent-bg)}
.pcard .pt{font-size:16px;font-weight:700;color:var(--ink);letter-spacing:-.01em}
.pcard .pd{font-size:13.2px;color:var(--body);line-height:1.5}
.pcard .pm{font-family:var(--mono);font-size:11px;color:var(--muted);
  text-transform:uppercase;letter-spacing:.06em;margin-top:2px}
/* &#9472;&#9472; mock cards &#9472;&#9472; */
.mock{display:flex;flex-direction:column;gap:8px;width:100%;text-align:left;
  padding:14px 16px;border:1px solid var(--line);border-radius:10px;
  background:var(--surface);cursor:pointer;font-family:inherit;margin-bottom:9px;
  transition:.14s}
.mock:hover{border-color:var(--accent)}
.mock.hi{background:var(--accent-bg);border-color:var(--accent)}
.mh{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.mn{font-size:15px;font-weight:700;color:var(--ink)}
.mtot{font-family:var(--mono);font-size:12px;color:var(--accent);white-space:nowrap}
.ms{display:flex;flex-wrap:wrap;gap:6px}
.srow{display:inline-flex;flex-direction:column;padding:5px 10px;border-radius:6px;
  background:var(--surface-2);border:1px solid var(--line);min-width:112px}
.srow b{font-size:12.2px;color:var(--ink);font-weight:600}
.srow span{font-family:var(--mono);font-size:11px;color:var(--muted)}
.mnote{font-size:12.6px;color:var(--muted);line-height:1.5}
.secpill{font-family:var(--mono);font-size:11px;padding:2px 8px;border-radius:4px;
  background:var(--accent-bg);color:var(--accent);border:1px solid var(--accent)}
/* &#9472;&#9472; provenance &#9472;&#9472; */
.prov{margin-top:20px;border:1px solid var(--line);border-radius:10px;
  background:var(--surface-2);overflow:hidden}
.prov>summary{padding:12px 15px;cursor:pointer;font-size:13.5px;color:var(--muted);
  list-style:none;font-family:inherit}
.prov>summary::-webkit-details-marker{display:none}
.prov>summary:hover{color:var(--ink)}
.prov[open]>summary{color:var(--ink);font-weight:600;border-bottom:1px solid var(--line)}
.prov .pb{padding:12px 15px;font-size:13.2px;line-height:1.6}
.prov .pb p{margin:0 0 9px}
.prov .pb ul{margin:0 0 9px 18px}
.prov .pb li{margin:3px 0}

/* &#9472;&#9472; formula sheet &#9472;&#9472; */
.fbtn{background:none;border:1px solid var(--line);color:var(--muted);
  height:32px;padding:0 11px;border-radius:7px;cursor:pointer;font-size:13px;
  font-family:var(--sans);display:inline-flex;align-items:center;gap:6px}
.fbtn:hover{color:var(--accent);border-color:var(--accent)}
.fbtn b{font-family:var(--mono);font-style:italic;font-size:14px}
.sheetcta{display:flex;align-items:center;gap:14px;margin-top:20px;padding:14px 16px;
  border:1px solid var(--line);border-radius:10px;background:var(--surface-2);
  cursor:pointer;width:100%;text-align:left;font-family:inherit}
.sheetcta:hover{border-color:var(--accent)}
.sheetcta .ic{font-family:var(--mono);font-style:italic;font-size:22px;
  color:var(--accent);width:38px;height:38px;border-radius:8px;flex:none;
  background:var(--accent-bg);display:grid;place-items:center}
.sheetcta .tt{font-weight:650;color:var(--ink);font-size:14.5px}
.sheetcta .ds{font-size:13px;color:var(--muted)}
.search{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:9px;
  background:var(--surface-2);color:var(--ink);font-size:14.5px;font-family:inherit;
  margin-bottom:16px}
.search::placeholder{color:var(--muted)}
.fgroup{margin-bottom:24px}
.fgroup>h3{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--accent);font-family:var(--mono);margin-bottom:9px}
.fcard{border:1px solid var(--line);border-radius:10px;margin-bottom:9px;
  background:var(--surface);overflow:hidden}
.fcard>h4{font-size:14px;color:var(--ink);padding:10px 14px;margin:0;
  background:var(--surface-2);border-bottom:1px solid var(--line);font-weight:650}
.frow{display:flex;gap:14px;padding:7px 14px;font-size:13.5px;
  border-bottom:1px solid var(--line);align-items:baseline}
.frow:last-child{border-bottom:0}
.frow .lb{flex:0 0 34%;color:var(--muted);font-size:12.5px}
.frow .fx{flex:1;font-family:var(--mono);color:var(--ink);font-size:12.8px;
  line-height:1.65;word-break:break-word}
.fnote{padding:9px 14px;font-size:12.8px;color:var(--body);background:var(--accent-bg);
  border-top:1px solid var(--line)}
.fnote+.fnote{border-top:0;padding-top:0}
/* in-question formula panel */
.peek{margin-top:14px;border:1px dashed var(--line);border-radius:9px;overflow:hidden}
.peek>summary{padding:9px 13px;cursor:pointer;font-size:13.5px;color:var(--muted);
  list-style:none;display:flex;align-items:center;gap:7px;font-family:var(--sans)}
.peek>summary::-webkit-details-marker{display:none}
.peek>summary:hover{color:var(--accent)}
.peek>summary b{font-family:var(--mono);font-style:italic}
.peek[open]>summary{border-bottom:1px solid var(--line);color:var(--accent)}
.peek .frow{font-size:13px}

.foot{text-align:center;margin-top:26px;font-size:12.5px;color:var(--muted)}
.kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line);
  border-bottom-width:2px;border-radius:4px;padding:1px 5px;color:var(--muted)}
@media (max-width:560px){
  .wrap{padding:18px 13px 60px} .card{padding:17px;border-radius:10px}
  .qtext{font-size:16.5px} .opt{font-size:15px;padding:11px 12px}
  .score .big{font-size:46px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>

<div class="rail">
  <div class="brand"><span></span>Aptitude Drill</div>
  <div class="spacer"></div>
  <div class="stat" id="railStat"></div>
  <div class="timer" id="railTimer" hidden>00:00</div>
  <button class="fbtn" id="sheetBtn" title="Formula sheet"><b>f</b> Formulas</button>
  <button class="iconbtn" id="themeBtn" title="Toggle theme" aria-label="Toggle theme">&#9680;</button>
</div>

<div class="wrap">
  <div id="view"></div>
  <div class="foot" id="foot"></div>
</div>

20b94000 at 8% per annum for 3 years.","o":["96","4960","960","320"],"a":2,"e":"SI = PRT/100 = 4000\u00d78\u00d73/100 = <b>\u20b9960</b>.","d":"Easy"},{"t":"Quantitative","s":"Simple & Compound Interest","q":"Find the simple interest on \u20b95000 at 12% per annum for 2 years.","o":["600","6200","120","1200"],"a":3,"e":"SI = PRT/100 = 5000\u00d712\u00d72/100 = <b>\u20b91200</b>.","d":"Easy"},{"t":"Quantitative","s":"Simple & Compound Interest","q":"Find the simple interest on \u20b98000 at 8% per annum for 3 years.","o":["640","9920","1920","192"],"a":2,"e":"SI = PRT/100 = 8000\u00d78\u00d73/100 = <b>\u20b91920</b>.","d":"Easy"},{"t":"Quantitative","s":"Simple & Compound Interest","q":"Find the simple interest on \u20b98000 at 5% per annum for 4 years.","o":["1600","9600","400","160"],"a":0,"e":"SI = PRT/100 = 8000\u00d75\u00d74/100 = <b>\u20b91600</b>.","d":"Easy"},{"t":"Quantitative","s":"Simple & Compound Interest","q":"Find the simple interest on \u20b912000 at 10% per annum for 4 years.","o":["480","1200","16800","4800"],"a":3,"e":"SI = PRT/100 = 12000\u00d710\u00d74/100 = <b>\u20b94800</b>.","d":"Easy"},{"t":"Quantitative","s":"Simple & Compound Interest","q":"Find the simple interest on \u20b912000 at 10% per annum for 2 years.","o":["1200","2400","14400","240"],"a":1,"e":"SI = PRT/100 = 12000\u00d710\u00d72/100 = <b>\u20b92400</b>.","d":"Easy"},{"t":"Quantitative","s":"Simple & Compound Interest","q":"Find the simple interest on \u20b95000 at 10% per annum for 4 years.","o":["7000","200","500","2000"],"a":3,"e":"SI = PRT/100 = 5000\u00d710\u00d74/100 = <b>\u20b92000</b>.","d":"Easy"},{"t":"Quantitative","s":"Simple & Compound Interest","q":"Find the compound interest on \u20b920000 at 5% per annum for 2 years.","o":["4100","22050","2050","2000"],"a":2,"e":"A = P(1+R/100)\u00b2 = 20000 \u00d7 1.1025 = 22050; CI = A \u2212 P = <b>\u20b92050</b>. (SI would be only \u20b92000.)","d":"Medium"},{"t":"Quantitative","s":"Simple & Compound Interest","q":"Find the compound interest on \u20b910000 at 20% per annum for 2 years.","o":["4000","8800","4400","14400"],"a":2,"e":"A = P(1+R/100)\u00b2 = 10000 \u00d7 1.44 = 14400; CI = A \u2212 P = <b>\u20b94400</b>. (SI would be only \u20b94000.)","d":"Medium"},{"t":"Quantitative","s":"Simple & Compound Interest","q":"Find the compound interest on \u20b910000 at 5% per annum for 2 years.","o":["1000","11025","2050","1025"],"a":3,"e":"A = P(1+R/100)\u00b2 = 10000 \u00d7 1.1025 = 11025; CI = A \u2212 P = <b>\u20b91025</b>. (SI would be only \u20b91000.)","d":"Medium"},{"t":"Quantitative","s":"Simple & Compound Interest","q":"Find the compound interest on \u20b95000 at 10% per annum for 2 years.","o":["1050","6050","1000","2100"],"a":0,"e":"A = P(1+R/100)\u00b2 = 5000 \u00d7 1.21 = 6050; CI = A \u2212 P = <b>\u20b91050</b>. (SI would be only \u20b91000.)","d":"Medium"},{"t":"Quantitative","s":"Simple & Compound Interest","q":"Find the compound interest on \u20b98000 at 5% per annum for 2 years.","o":["1640","8820","820","800"],"a":2,"e":"A = P(1+R/100)\u00b2 = 8000 \u00d7 1.1025 = 8820; CI = A \u2212 P = <b>\u20b9820</b>. (SI would be only \u20b9800.)","d":"Medium"},{"t":"Quantitative","s":"Simple & Compound Interest","q":"Find the compound interest on \u20b95000 at 5% per annum for 2 years.","o":["512.5","500","1025","5512.5"],"a":0,"e":"A = P(1+R/100)\u00b2 = 5000 \u00d7 1.1025 = 5512.5; CI = A \u2212 P = <b>\u20b9512.5</b>. (SI would be only \u20b9500.)","d":"Medium"},{"t":"Quantitative","s":"Simple & Compound Interest","q":"Find the compound interest on \u20b920000 at 10% per annum for 2 years.","o":["4200","8400","24200","4000"],"a":0,"e":"A = P(1+R/100)\u00b2 = 20000 \u00d7 1.21 = 24200; CI = A \u2212 P = <b>\u20b94200</b>. (SI would be only \u20b94000.)","d":"Medium"},{"t":"Quantitative","s":"Simple & Compound Interest","q":"Find the difference between compound and simple interest on \u20b916000 at 20% per annum for 2 years.","o":["640","6400","1280","3200"],"a":0,"e":"Difference for 2 years = P(R/100)\u00b2 = 16000 \u00d7 (20/100)\u00b2 = <b>\u20b9640</b>. Memorise this \u2014 it appears constantly.","d":"Medium"},{"t":"Quantitative","s":"Simple & Compound Interest","q":"Find the difference between compound and simple interest on \u20b98000 at 20% per annum for 2 years.","o":["320","3200","640","1600"],"a":0,"e":"Difference for 2 years = P(R/100)\u00b2 = 8000 \u00d7 (20/100)\u00b2 = <b>\u20b9320</b>. Memorise this \u2014 it appears constantly.","d":"Medium"},{"t":"Quantitative","s":"Simple & Compound Interest","q":"Find the difference between compound and simple interest on \u20b95000 at 10% per annum for 2 years.","o":["1000","500","50","100"],"a":2,"e":"Difference for 2 years = P(R/100)\u00b2 = 5000 \u00d7 (10/100)\u00b2 = <b>\u20b950</b>. Memorise this \u2014 it appears constantly.","d":"Medium"},{"t":"Quantitative","s":"Simple & Compound Interest","q":"Find the difference between compound and simple interest on \u20b910000 at 10% per annum for 2 years.","o":["100","200","1000","2000"],"a":0,"e":"Difference for 2 years = P(R/100)\u00b2 = 10000 \u00d7 (10/100)\u00b2 = <b>\u20b9100</b>. Memorise this \u2014 it appears constantly.","d":"Medium"},{"t":"Quantitative","s":"Simple & Compound Interest","q":"Find the difference between compound and simple interest on \u20b98000 at 5% per annum for 2 years.","o":["20","400","40","800"],"a":0,"e":"Difference for 2 years = P(R/100)\u00b2 = 8000 \u00d7 (5/100)\u00b2 = <b>\u20b920</b>. Memorise this \u2014 it appears constantly.","d":"Medium"},{"t":"Quantitative","s":"Simple & Compound Interest","q":"A sum of money doubles itself in 8 years at simple interest. Find the rate of interest.","o":["16%","6.25%","8%","12.5%"],"a":3,"e":"To double, SI must equal P, so 100 = R\u00d78 \u2192 R = 100/8 = <b>12.5%</b>.","d":"Medium"},{"t":"Quantitative","s":"Simple & Compound Interest","q":"A sum of money doubles itself in 5 years at simple interest. Find the rate of interest.","o":["10%","5%","20%","12%"],"a":2,"e":"To double, SI must equal P, so 100 = R\u00d75 \u2192 R = 100/5 = <b>20%</b>.","d":"Medium"},{"t":"Quantitative","s":"Simple & Compound Interest","q":"A sum of money doubles itself in 4 years at simple interest. Find the rate of interest.","o":["12.5%","25%","4%","8%"],"a":1,"e":"To double, SI must equal P, so 100 = R\u00d74 \u2192 R = 100/4 = <b>25%</b>.","d":"Medium"},{"t":"Quantitative","s":"Simple & Compound Interest","q":"A sum of money doubles itself in 10 years at simple interest. Find the rate of interest.","o":["5%","20%","10%","12%"],"a":2,"e":"To double, SI must equal P, so 100 = R\u00d710 \u2192 R = 100/10 = <b>10%</b>.","d":"Medium"},{"t":"Quantitative","s":"Simple & Compound Interest","q":"A sum doubles in 6 years at compound interest. In how many years will it become 16 times itself?","o":["96 years","22 years","48 years","24 years"],"a":3,"e":"16 = 2^4, so it needs 4 doubling periods \u2192 4 \u00d7 6 = <b>24 years</b>. At CI growth is multiplicative, not linear.","d":"Medium"},{"t":"Quantitative","s":"Simple & Compound Interest","q":"A sum doubles in 5 years at compound interest. In how many years will it become 16 times itself?","o":["40 years","21 years","20 years","80 years"],"a":2,"e":"16 = 2^4, so it needs 4 doubling periods \u2192 4 \u00d7 5 = <b>20 years</b>. At CI growth is multiplicative, not linear.","d":"Medium"},{"t":"Quantitative","s":"Simple & Compound Interest","q":"A sum doubles in 3 years at compound interest. In how many years will it become 4 times itself?","o":["8 years","7 years","12 years","6 years"],"a":3,"e":"4 = 2^2, so it needs 2 doubling periods \u2192 2 \u00d7 3 = <b>6 years</b>. At CI growth is multiplicative, not linear.","d":"Medium"},{"t":"Quantitative","s":"Simple & Compound Interest","q":"A sum doubles in 5 years at compound interest. In how many years will it become 8 times itself?","o":["13 years","15 years","20 years","40 years"],"a":1,"e":"8 = 2^3, so it needs 3 doubling periods \u2192 3 \u00d7 5 = <b>15 years</b>. At CI growth is multiplicative, not linear.","d":"Medium"},{"t":"Quantitative","s":"Ratio & Proportion","q":"\u20b93000 is divided among A, B and C in the ratio 4 : 5 : 6. Find C's share.","o":["800","600","1000","1200"],"a":3,"e":"Total parts = 15. C gets 6/15 \u00d7 3000 = <b>\u20b91200</b>.","d":"Easy"},{"t":"Quantitative","s":"Ratio & Proportion","q":"\u20b91500 is divided among A, B and C in the ratio 2 : 5 : 8. Find C's share.","o":["200","800","1600","500"],"a":1,"e":"Total parts = 15. C gets 8/15 \u00d7 1500 = <b>\u20b9800</b>.","d":"Easy"},{"t":"Quantitative","s":"Ratio & Proportion","q":"\u20b91200 is divided among A, B and C in the ratio 1 : 2 : 3. Find C's share.","o":["600","200","400","450"],"a":0,"e":"Total parts = 6. C gets 3/6 \u00d7 1200 = <b>\u20b9600</b>.","d":"Easy"},{"t":"Quantitative","s":"Ratio & Proportion","q":"\u20b92400 is divided among A, B and C in the ratio 2 : 3 : 7. Find C's share.","o":["400","1400","800","600"],"a":1,"e":"Total parts = 12. C gets 7/12 \u00d7 2400 = <b>\u20b91400</b>.","d":"Easy"},{"t":"Quantitative","s":"Ratio & Proportion","q":"\u20b91200 is divided among A, B and C in the ratio 2 : 3 : 7. Find C's share.","o":["300","400","700","200"],"a":2,"e":"Total parts = 12. C gets 7/12 \u00d7 1200 = <b>\u20b9700</b>.","d":"Easy"},{"t":"Quantitative","s":"Ratio & Proportion","q":"\u20b91800 is divided among A, B and C in the ratio 4 : 5 : 6. Find C's share.","o":["480","900","600","720"],"a":3,"e":"Total parts = 15. C gets 6/15 \u00d7 1800 = <b>\u20b9720</b>.","d":"Easy"},{"t":"Quantitative","s":"Ratio & Proportion","q":"The present ages of two people are in the ratio 4 : 5. After 4 years the ratio becomes 6 : 7. Find the present age of the younger one.","o":["10 years","14 years","12 years","8 years"],"a":3,"e":"Let the ages be 4x and 5x. Then (4x+4)/(5x+4) = 6/7 \u2192 x = 2 \u2192 younger = 4x = <b>8 years</b>.","d":"Medium"},{"t":"Quantitative","s":"Ratio & Proportion","q":"The present ages of two people are in the ratio 3 : 4. After 6 years the ratio becomes 7 : 9. Find the present age of the younger one.","o":["48 years","36 years","42 years","54 years"],"a":1,"e":"Let the ages be 3x and 4x. Then (3x+6)/(4x+6) = 7/9 \u2192 x = 12 \u2192 younger = 3x = <b>36 years</b>.","d":"Medium"},{"t":"Quantitative","s":"Ratio & Proportion","q":"The present ages of two people are in the ratio 2 : 3. After 4 years the ratio becomes 6 : 7. Find the present age of the younger one.","o":["2 years","3 years","6 years","7 years"],"a":0,"e":"Let the ages be 2x and 3x. Then (2x+4)/(3x+4) = 6/7 \u2192 x = 1 \u2192 younger = 2x = <b>2 years</b>.","d":"Medium"},{"t":"Quantitative","s":"Averages","q":"The average of 5 numbers is 40. If one number, 48, is removed, find the average of the remaining numbers.","o":["40","41.33","38","30.4"],"a":2,"e":"Sum = 5\u00d740 = 200. Remaining sum = 200\u221248 = 152, over 4 numbers \u2192 <b>38</b>.","d":"Medium"},{"t":"Quantitative","s":"Averages","q":"The average of 7 numbers is 30. If one number, 42, is removed, find the average of the remaining numbers.","o":["24","31.5","28","30"],"a":2,"e":"Sum = 7\u00d730 = 210. Remaining sum = 210\u221242 = 168, over 6 numbers \u2192 <b>28</b>.","d":"Medium"},{"t":"Quantitative","s":"Averages","q":"The average of 7 numbers is 40. If one number, 56, is removed, find the average of the remaining numbers.","o":["42","37.33","40","32"],"a":1,"e":"Sum = 7\u00d740 = 280. Remaining sum = 280\u221256 = 224, over 6 numbers \u2192 <b>37.33</b>.","d":"Medium"},{"t":"Quantitative","s":"Averages","q":"The average of 5 numbers is 25. If one number, 37, is removed, find the average of the remaining numbers.","o":["17.6","22","25","27"],"a":1,"e":"Sum = 5\u00d725 = 125. Remaining sum = 125\u221237 = 88, over 4 numbers \u2192 <b>22</b>.","d":"Medium"},{"t":"Quantitative","s":"Averages","q":"The average of 9 numbers is 20. If one number, 32, is removed, find the average of the remaining numbers.","o":["20","18.5","21.2","16.44"],"a":1,"e":"Sum = 9\u00d720 = 180. Remaining sum = 180\u221232 = 148, over 8 numbers \u2192 <b>18.5</b>.","d":"Medium"},{"t":"Quantitative","s":"Averages","q":"The average of 9 numbers is 25. If one number, 41, is removed, find the average of the remaining numbers.","o":["23","26.6","25","20.44"],"a":0,"e":"Sum = 9\u00d725 = 225. Remaining sum = 225\u221241 = 184, over 8 numbers \u2192 <b>23</b>.","d":"Medium"},{"t":"Quantitative","s":"Averages","q":"The average of 9 numbers is 25. If one number, 33, is removed, find the average of the remaining numbers.","o":["25.8","24","25","21.33"],"a":1,"e":"Sum = 9\u00d725 = 225. Remaining sum = 225\u221233 = 192, over 8 numbers \u2192 <b>24</b>.","d":"Medium"},{"t":"Quantitative","s":"Averages","q":"The average weight of 8 people increases by 3 kg when a new person replaces one weighing 60 kg. Find the weight of the new person.","o":["36 kg","63 kg","84 kg","24 kg"],"a":2,"e":"Total increase = 8 \u00d7 3 = 24 kg, so the new person is 24 kg heavier: 60 + 24 = <b>84 kg</b>.","d":"Medium"},{"t":"Quantitative","s":"Averages","q":"The average weight of 12 people increases by 2.5 kg when a new person replaces one weighing 60 kg. Find the weight of the new person.","o":["30 kg","55 kg","62.5 kg","90 kg"],"a":3,"e":"Total increase = 12 \u00d7 2.5 = 30 kg, so the new person is 30 kg heavier: 60 + 30 = <b>90 kg</b>.","d":"Medium"},{"t":"Quantitative","s":"Averages","q":"The average weight of 10 people increases by 2 kg when a new person replaces one weighing 45 kg. Find the weight of the new person.","o":["65 kg","47 kg","25 kg","20 kg"],"a":0,"e":"Total increase = 10 \u00d7 2 = 20 kg, so the new person is 20 kg heavier: 45 + 20 = <b>65 kg</b>.","d":"Medium"},{"t":"Quantitative","s":"Averages","q":"The average weight of 8 people increases by 2 kg when a new person replaces one weighing 45 kg. Find the weight of the new person.","o":["61 kg","16 kg","47 kg","29 kg"],"a":0,"e":"Total increase = 8 \u00d7 2 = 16 kg, so the new person is 16 kg heavier: 45 + 16 = <b>61 kg</b>.","d":"Medium"},{"t":"Quantitative","s":"Averages","q":"The average weight of 8 people increases by 2.5 kg when a new person replaces one weighing 45 kg. Find the weight of the new person.","o":["25 kg","65 kg","20 kg","47.5 kg"],"a":1,"e":"Total increase = 8 \u00d7 2.5 = 20 kg, so the new person is 20 kg heavier: 45 + 20 = <b>65 kg</b>.","d":"Medium"},{"t":"Quantitative","s":"Averages","q":"The average weight of 10 people increases by 3 kg when a new person replaces one weighing 45 kg. Find the weight of the new person.","o":["75 kg","30 kg","15 kg","48 kg"],"a":0,"e":"Total increase = 10 \u00d7 3 = 30 kg, so the new person is 30 kg heavier: 45 + 30 = <b>75 kg</b>.","d":"Medium"},{"t":"Quantitative","s":"Averages","q":"A man covers a distance at 20 km/h and returns over the same distance at 30 km/h. Find his average speed for the whole journey.","o":["24 km/h","25 km/h","50 km/h","10 km/h"],"a":0,"e":"Equal distances \u2192 harmonic mean = 2ab/(a+b) = 2\u00d720\u00d730/50 = <b>24 km/h</b>. The plain average 25 is the trap.","d":"Medium"},{"t":"Quantitative","s":"Averages","q":"A man covers a distance at 50 km/h and returns over the same distance at 75 km/h. Find his average speed for the whole journey.","o":["62.5 km/h","125 km/h","25 km/h","60 km/h"],"a":3,"e":"Equal distances \u2192 harmonic mean = 2ab/(a+b) = 2\u00d750\u00d775/125 = <b>60 km/h</b>. The plain average 62.5 is the trap.","d":"Medium"},{"t":"Quantitative","s":"Averages","q":"A man covers a distance at 60 km/h and returns over the same distance at 40 km/h. Find his average speed for the whole journey.","o":["48 km/h","50 km/h","20 km/h","100 km/h"],"a":0,"e":"Equal distances \u2192 harmonic mean = 2ab/(a+b) = 2\u00d760\u00d740/100 = <b>48 km/h</b>. The plain average 50 is the trap.","d":"Medium"},{"t":"Quantitative","s":"Averages","q":"A man covers a distance at 30 km/h and returns over the same distance at 60 km/h. Find his average speed for the whole journey.","o":["30 km/h","90 km/h","40 km/h","45 km/h"],"a":2,"e":"Equal distances \u2192 harmonic mean = 2ab/(a+b) = 2\u00d730\u00d760/90 = <b>40 km/h</b>. The plain average 45 is the trap.","d":"Medium"},{"t":"Quantitative","s":"Mixtures & Alligation","q":"In what ratio must an item costing \u20b930/kg be mixed with one costing \u20b940/kg to get a mixture worth \u20b936/kg?","o":["3 : 2","30 : 40","2 : 3","1 : 1"],"a":2,"e":"Alligation: cheaper : dearer = (d\u2212m) : (m\u2212c) = (40\u221236) : (36\u221230) = <b>2 : 3</b>.","d":"Medium"},{"t":"Quantitative","s":"Mixtures & Alligation","q":"In what ratio must an item costing \u20b920/kg be mixed with one costing \u20b930/kg to get a mixture worth \u20b926/kg?","o":["1 : 1","3 : 2","2 : 3","20 : 30"],"a":2,"e":"Alligation: cheaper : dearer = (d\u2212m) : (m\u2212c) = (30\u221226) : (26\u221220) = <b>2 : 3</b>.","d":"Medium"},{"t":"Quantitative","s":"Mixtures & Alligation","q":"In what ratio must an item costing \u20b915/kg be mixed with one costing \u20b925/kg to get a mixture worth \u20b923/kg?","o":["1 : 4","1 : 1","4 : 1","15 : 25"],"a":0,"e":"Alligation: cheaper : dearer = (d\u2212m) : (m\u2212c) = (25\u221223) : (23\u221215) = <b>1 : 4</b>.","d":"Medium"},{"t":"Quantitative","s":"Mixtures & Alligation","q":"In what ratio must an item costing \u20b930/kg be mixed with one costing \u20b940/kg to get a mixture worth \u20b938/kg?","o":["30 : 40","1 : 4","4 : 1","1 : 1"],"a":1,"e":"Alligation: cheaper : dearer = (d\u2212m) : (m\u2212c) = (40\u221238) : (38\u221230) = <b>1 : 4</b>.","d":"Medium"},{"t":"Quantitative","s":"Mixtures & Alligation","q":"In what ratio must an item costing \u20b920/kg be mixed with one costing \u20b930/kg to get a mixture worth \u20b922/kg?","o":["1 : 4","20 : 30","1 : 1","4 : 1"],"a":3,"e":"Alligation: cheaper : dearer = (d\u2212m) : (m\u2212c) = (30\u221222) : (22\u221220) = <b>4 : 1</b>.","d":"Medium"},{"t":"Quantitative","s":"Mixtures & Alligation","q":"From 100 litres of pure milk, 10 litres are removed and replaced with water. This is done twice. How much pure milk remains?","o":["40 L","81 L","80 L","90 L"],"a":1,"e":"Remaining = V(1\u2212r/V)\u207f = 100(1\u221210/100)\u00b2 = 100 \u00d7 0.81 = <b>81 L</b>. Simply subtracting 20 L is wrong \u2014 the second removal takes out diluted mixture.","d":"Medium"},{"t":"Quantitative","s":"Mixtures & Alligation","q":"From 50 litres of pure milk, 5 litres are removed and replaced with water. This is done twice. How much pure milk remains?","o":["25 L","40 L","40.5 L","45 L"],"a":2,"e":"Remaining = V(1\u2212r/V)\u207f = 50(1\u22125/50)\u00b2 = 50 \u00d7 0.81 = <b>40.5 L</b>. Simply subtracting 10 L is wrong \u2014 the second removal takes out diluted mixture.","d":"Medium"},{"t":"Quantitative","s":"Time & Work","q":"A can do a piece of work in 9 days and B in 18 days. How long will they take working together?","o":["9 days","27 days","13.5 days","6 days"],"a":3,"e":"Take total work = LCM(9,18) = 18 units. A does 2/day, B does 1/day \u2192 together 3/day \u2192 <b>6 days</b>.","d":"Easy"},{"t":"Quantitative","s":"Time & Work","q":"A can do a piece of work in 20 days and B in 30 days. How long will they take working together?","o":["50 days","10 days","25 days","12 days"],"a":3,"e":"Take total work = LCM(20,30) = 60 units. A does 3/day, B does 2/day \u2192 together 5/day \u2192 <b>12 days</b>.","d":"Easy"},{"t":"Quantitative","s":"Time & Work","q":"A can do a piece of work in 6 days and B in 12 days. How long will they take working together?","o":["6 days","9 days","4 days","18 days"],"a":2,"e":"Take total work = LCM(6,12) = 12 units. A does 2/day, B does 1/day \u2192 together 3/day \u2192 <b>4 days</b>.","d":"Easy"},{"t":"Quantitative","s":"Time & Work","q":"A can do a piece of work in 12 days and B in 18 days. How long will they take working together?","o":["7.2 days","15 days","30 days","6 days"],"a":0,"e":"Take total work = LCM(12,18) = 36 units. A does 3/day, B does 2/day \u2192 together 5/day \u2192 <b>7.2 days</b>.","d":"Easy"},{"t":"Quantitative","s":"Time & Work","q":"A can do a piece of work in 15 days and B in 10 days. How long will they take working together?","o":["12.5 days","6 days","25 days","5 days"],"a":1,"e":"Take total work = LCM(15,10) = 30 units. A does 2/day, B does 3/day \u2192 together 5/day \u2192 <b>6 days</b>.","d":"Easy"},{"t":"Quantitative","s":"Time & Work","q":"A can do a work in 10 days and B in 15 days. They work together for 3 days, after which B leaves. How many more days will A take to finish?","o":["7 days","3 days","5 days","7.5 days"],"a":2,"e":"LCM = 30 units. A = 3/day, B = 2/day. In 3 days together: 5\u00d73 = 15 units. Remaining 15 units \u00f7 3 = <b>5 days</b>.","d":"Medium"},{"t":"Quantitative","s":"Time & Work","q":"A can do a work in 10 days and B in 15 days. They work together for 5 days, after which B leaves. How many more days will A take to finish?","o":["1 days","1.67 days","2.5 days","5 days"],"a":1,"e":"LCM = 30 units. A = 3/day, B = 2/day. In 5 days together: 5\u00d75 = 25 units. Remaining 5 units \u00f7 3 = <b>1.67 days</b>.","d":"Medium"},{"t":"Quantitative","s":"Time & Work","q":"A can do a work in 12 days and B in 15 days. They work together for 5 days, after which B leaves. How many more days will A take to finish?","o":["7 days","3 days","1.67 days","3.75 days"],"a":1,"e":"LCM = 60 units. A = 5/day, B = 4/day. In 5 days together: 9\u00d75 = 45 units. Remaining 15 units \u00f7 5 = <b>3 days</b>.","d":"Medium"},{"t":"Quantitative","s":"Time & Work","q":"A can do a work in 20 days and B in 30 days. They work together for 4 days, after which B leaves. How many more days will A take to finish?","o":["13.33 days","8 days","16 days","20 days"],"a":0,"e":"LCM = 60 units. A = 3/day, B = 2/day. In 4 days together: 5\u00d74 = 20 units. Remaining 40 units \u00f7 3 = <b>13.33 days</b>.","d":"Medium"},{"t":"Quantitative","s":"Time & Work","q":"A can do a work in 16 days and B in 24 days. They work together for 4 days, after which B leaves nt: 15\u00d712 = M\u00d79 \u2192 M = <b>20 men</b>.","d":"Easy"},{"t":"Quantitative","s":"Time & Work","q":"A is 100% more efficient than B. B alone takes 45 days. How long do they take together?","o":["18 days","8 days","22.5 days","15 days"],"a":3,"e":"A is 100% more efficient \u2192 A takes 45/2 = 22.5 days. Together = ab/(a+b) = <b>15 days</b>.","d":"Medium"},{"t":"Quantitative","s":"Time & Work","q":"A is 50% more efficient than B. B alone takes 30 days. How long do they take together?","o":["10 days","12 days","20 days","15 days"],"a":1,"e":"A is 50% more efficient \u2192 A takes 30/1.5 = 20 days. Together = ab/(a+b) = <b>12 days</b>.","d":"Medium"},{"t":"Quantitative","s":"Time & Work","q":"A is 50% more efficient than B. B alone takes 36 days. How long do they take together?","o":["18 days","24 days","14.4 days","12 days"],"a":2,"e":"A is 50% more efficient \u2192 A takes 36/1.5 = 24 days. Together = ab/(a+b) = <b>14.4 days</b>.","d":"Medium"},{"t":"Quantitative","s":"Time & Work","q":"A is 100% more efficient than B. B alone takes 36 days. How long do they take together?","o":["15 days","10 days","18 days","12 days"],"a":3,"e":"A is 100% more efficient \u2192 A takes 36/2 = 18 days. Together = ab/(a+b) = <b>12 days</b>.","d":"Medium"},{"t":"Quantitative","s":"Pipes & Cisterns","q":"Three pipes can fill a tank in 20, 30 and 60 minutes respectively. If all three are opened together, how long will the tank take to fill?","o":["10 min","110 min","36.67 min","20 min"],"a":0,"e":"LCM = 60. Rates 3 + 2 + 1 = 6/min \u2192 60/6 = <b>10 minutes</b>.","d":"Medium"},{"t":"Quantitative","s":"Pipes & Cisterns","q":"Three pipes can fill a tank in 12, 15 and 20 minutes respectively. If all three are opened together, how long will the tank take to fill?","o":["47 min","5 min","12 min","15.67 min"],"a":1,"e":"LCM = 60. Rates 5 + 4 + 3 = 12/min \u2192 60/12 = <b>5 minutes</b>.","d":"Medium"},{"t":"Quantitative","s":"Pipes & Cisterns","q":"Three pipes can fill a tank in 10, 15 ystem","q":"Find the unit digit of 8^116.","o":["8","4.8","6","4.5"],"a":2,"e":"The unit digits of powers of 8 cycle as [8, 4, 2, 6] (length 4). 116 mod 4 = 0 \u2192 <b>6</b>. (Remainder 0 means take the last element.)","d":"Medium"},{"t":"Quantitative","s":"Number System","q":"Find the unit digit of 2^41.","o":["2.4","1.6","4","2"],"a":3,"e":"The unit digits of powers of 2 cycle as [2, 4, 8, 6] (length 4). 41 mod 4 = 1 \u2192 <b>2</b>. (Remainder 0 means take the last element.)","d":"Medium"},{"t":"Quantitative","s":"Number System","q":"Find the unit digit of 7^69.","o":["7","4.2","9","14"],"a":0,"e":"The unit digits of powers of 7 cycle as [7, 9, 3, 1] (length 4). 69 mod 4 = 1 \u2192 <b>7</b>. (Remainder 0 means take the last element.)","d":"Medium"},{"t":"Quantitative","s":"Number System","q":"Find the unit digit of 8^62.","o":["3.2","4","2","8"],"a":1,"e":"The unit digits of powers of 8 cycle as [8, 4, 2, 6] (length 4). 62 mod 4 = 2 \u2192 <b>4</b>. (Remainder 0 means take the last element.)","d":"Medium"},{"t":"Quantitative","s":"Number System","q":"Find the unit digit of 4^52.","o":["4.5","4","6","4.8"],"a":2,"e":"The unit digits of powers of 4 cycle as [4, 6] (length 2). 52 mod 2 = 0 \u2192 <b>6</b>. (Remainder 0 means take the last element.)","d":"Medium"},{"t":"Quantitative","s":"Number System","q":"Find the unit digit of 2^88.","o":["3","2","4.5","6"],"a":3,"e":"The unit digits of powers of 2 cycle as [2, 4, 8, 6] (length 4). 88 mod 4 = 0 \u2192 <b>6</b>. (Remainder 0 means take the last element.)","d":"Medium"},{"t":"Quantitative","s":"Number System","q":"How many factors does 240 have?","o":["120","20","10","22"],"a":1,"e":"240 = 2^4 \u00d7 3^1 \u00d7 5^1. Number of factors = product of (exponent + 1) = <b>20</b>.","d":"Medium"},{"t":"Quantitative","s":"Number System","q":"How many factors does 196 have?","o":["9","4","98","11"],"a":0,"e":"196 = 2^2 \u00d7 7^2. Number of factors = product of (exponent + 1) = <b>9</b>.","d":"Medium"},{"t":"Quantitative","s":"Number System","q":"How many factors does 360 have?","o":["26","24","180","12"],"a":1,"e":"360 = 2^3 \u00d7 3^2 \u00d7 5^1. Number of factors = product of (exponent + 1) = <b>24</b>.","d":"Medium"},{"t":"Quantitative","s":"Number System","q":"How many factors does 72 have?","o":["36","12","14","6"],"a":1,"e":"72 = 2^3 \u00d7 3^2. Number of factors = product of (exponent + 1) = <b>12</b>.","d":"Medium"},{"t":"Quantitative","s":"LCM & HCF","q":"Find the LCM of 36 and 48.","o":["36","12","144","48"],"a":2,"e":"HCF(36,48) = 12 and LCM = 144. Answer: <b>144</b>. Check: HCF \u00d7 LCM = 1728 = 36\u00d748 \u2713","d":"Easy"},{"t":"Quantitative","s":"LCM & HCF","q":"Find the LCM of 45 and 75.","o":["75","225","45","15"],"a":1,"e":"HCF(45,75) = 15 and LCM = 225. Answer: <b>225</b>. Check: HCF \u00d7 LCM = 3375 = 45\u00d775 \u2713","d":"Easy"},{"t":"Quantitative","s":"LCM & HCF","q":"Find the LCM of 18 and 27.","o":["54","9","18","27"],"a":0,"e":"HCF(18,27) = 9 and LCM = 54. Answer: <b>54</b>. Check: HCF \u00d7 LCM = 486 = 18\u00d727 \u2713","d":"Easy"},{"t":"Quantitative","s":"LCM & HCF","q":"Find the HCF of 45 and 75.","o":["225","75","15","45"],"a":2,"e":"HCF(45,75) = 15 and LCM = 225. Answer: <b>15</b>. Check: HCF \u00d7 LCM = 3375 = 45\u00d775 \u2713","d":"Easy"},{"t":"Quantitative","s":"LCM & HCF","q":"Find the LCM of 40 and 60.","o":["40","120","20","60"],"a":1,"e":"HCF(40,60) = 20 and LCM = 120. Answer: <b>120</b>. Check: HCF \u00d7 LCM = 2400 = 40\u00d760 \u2713","d":"Easy"},{"t":"Quantitative","s":"LCM & HCF","q":"Find the least number which, when divided by 6, 8 and 12, leaves a remainder of 1 in each case.","o":["27","25","23","24"],"a":1,"e":"The number is LCM + remainder = LCM(6,8,12) + 1 = 24 + 1 = <b>25</b>.","d":"Medium"},{"t":"Quantitative","s":"LCM & HCF","q":"Find the least number which, when divided by 9, 12 and 15, leaves a remainder of 3 in each case.","o":["177","39","180","183"],"a":3,"e":"The number is LCM + remainder = LCM(9,12,15) + 3 = 180 + 3 = <b>183</b>.","d":"Medium"},{"t":"Quantitative","s":"LCM & HCF","q":"Find the least number which, when divided by 8, 12 and 20, leaves a remainder of 3 in each case.","o":["43","123","117","120"],"a":1,"e":"The number is LCM + remainder = LCM(8,12,20) + 3 = 120 + 3 = <b>123</b>.","d":"Medium"},{"t":"Quantitative","s":"LCM & HCF","q":"Find the least number which, when divided by 4, 6 and 10, leaves a remainder of 1 in each case.","o":["59","60","21","61"],"a":3,"e":"The number is LCM + remainder = LCM(4,6,10) + 1 = 60 + 1 = <b>61</b>.","d":"Medium"},{"t":"Quantitative","s":"LCM & HCF","q":"Find the least number which, when divided by 6, 8 and 12, leaves a remainder of 3 in each case.","o":["29","27","24","21"],"a":1,"e":"The number is LCM + remainder = LCM(6,8,12) + 3 = 24 + 3 = <b>27</b>.","d":"Medium"},{"t":"Quantitative","s":"LCM & HCF","q":"Find the least number which, when divided by 9, 12 and 15, leaves a remainder of 2 in each case.","o":["180","38","182","178"],"a":2,"e":"The number is LCM + remainder = LCM(9,12,15) + 2 = 180 + 2 = <b>182</b>.","d":"Medium"},{"t":"Quantitative","s":"Number System","q":"Find the remainder when 2^72 is divided by 7.","o":["0.5","1","1.2","2"],"a":1,"e":"Find the smallest power of 2 that leaves remainder 1 mod 7, then reduce the exponent. Result: <b>1</b>.","d":"Hard"},{"t":"Quantitative","s":"Number System","q":"Find the remainder when 5^57 is divided by 7.","o":["1","6","5","0"],"a":1,"e":"Find the smallest power of 5 that leaves remainder 1 mod 7, then reduce the exponent. Result: <b>6</b>.","d":"Hard"},{"t":"Quantitative","s":"Number System","q":"Find the remainder when 5^53 is divided by 7.","o":["4","5","3","1"],"a":2,"e":"Find the smallest power of 5 that leaves remainder 1 mod 7, then reduce the exponent. Result: <b>3</b>.","d":"Hard"},{"t":"Quantitative","s":"Number System","q":"Find the remainder when 5^70 is divided by 7.","o":["3","5","1","2"],"a":3,"e":"Find the smallest power of 5 that leaves remainder 1 mod 7, then reduce the exponent. Result: <b>2</b>.","d":"Hard"},{"t":"Quantitative","s":"Number System","q":"Find the remainder when 2^63 is divided by 5.","o":["2","1","3","4"],"a":2,"e":"Find the smallest power of 2 that leaves remainder 1 mod 5, then reduce the exponent. Result: <b>3</b>.","d":"Hard"},{"t":"Quantitative","s":"Number System","q":"Find the remainder when 5^52 is divided by 7.","o":["3","1","5","2"],"a":3,"e":"Find the smallest power of 5 that leaves remainder 1 mod 7, then reduce the exponent. Result: <b>2</b>.","d":"Hard"},{"t":"Quantitative","s":"Progressions","q":"Find the sum of the squares of the first 15 natural numbers.","o":["225","1240","620","2480"],"a":1,"e":"Formula: n(n+1)(2n+1)/6 with n = 15 \u2192 <b>1240</b>.","d":"Medium"},{"t":"Quantitative","s":"Progressions","q":"Find the sum of the first 10 natural numbers.","o":["55","110","27","100"],"a":0,"e":"Formula: n(n+1)/2 with n = 10 \u2192 <b>55</b>.","d":"Medium"},{"t":"Quantitative","s":"Progressions","q":"Find the sum of the cubes of the first 10 natural numbers.","o":["3025","1512","6050","100"],"a":0,"e":"Formula: [n(n+1)/2]\u00b2 with n = 10 \u2192 <b>3025</b>.","d":"Medium"},{"t":"Quantitative","s":"Progressions","q":"Find the sum of the cubes of the first 30 natural numbers.","o":["900","216225","432450","108112"],"a":1,"e":"Formula: [n(n+1)/2]\u00b2 with n = 30 \u2192 <b>216225</b>.","d":"Medium"},{"t":"Quantitative","s":"Progressions","q":"Find the sum of the squares of the first 50 natural numbers.","o":["21462","42925","2500","85850"],"a":1,"e":"Formula: n(n+1)(2n+1)/6 with n = 50 \u2192 <b>42925</b>.","d":"Medium"},{"t":"Quantitative","s":"Progressions","q":"Find the sum of the first 15 terms of the AP 7, 10, 13, \u2026","o":["49","210","420","840"],"a":2,"e":"Last term = 7+(15\u22121)\u00d73 = 49. Sum = n/2 \u00d7 (first + last) = 15/2 \u00d7 (7+49) = <b>420</b>.","d":"Medium"},{"t":"Quantitative","s":"Progressions","q":"Find the sum of the first 12 terms of the AP 3, 6, 9, \u2026","o":["234","36","468","117"],"a":0,"e":"Last term = 3+(12\u22121)\u00d73 = 36. Sum = n/2 \u00d7 (first + last) = 12/2 \u00d7 (3+36) = <b>234</b>.","d":"Medium"},{"t":"Quantitative","s":"Progressions","q":"Find the sum of the first 10 terms of the AP 5, 9, 13, \u2026","o":["230","41","115","460"],"a":0,"e":"Last term = 5+(10\u22121)\u00d74 = 41. Sum = n/2 \u00d7 (first + last) = 10/2 \u00d7 (5+41) = <b>230</b>.","d":"Medium"},{"t":"Quantitative","s":"Progressions","q":"Find the sum of the first 12 terms of the AP 5, 8, 11, \u2026","o":["129","38","258","516"],"a":2,"e":"Last term = 5+(12\u22121)\u00d73 = 38. Sum = n/2 \u00d7 (first + last) = 12/2 \u00d7 (5+38) = <b>258</b>.","d":"Medium"},{"t":"Quantitative","s":"Progressions","q":"Find the sum of the first 12 terms of the AP 7, 10, 13, \u2026","o":["564","40","282","141"],"a":2,"e":"Last term = 7+(12\u22121)\u00d73 = 40. Sum = n/2 \u00d7 (first + last) = 12/2 \u00d7 (7+40) = <b>282</b>.","d":"Medium"},{"t":"Quantitative","s":"Progressions","q":"Find the sum of the first 12 terms of the AP 7, 9, 11, \u2026","o":["108","216","29","432"],"a":1,"e":"Last term = 7+(12\u22121)\u00d72 = 29. Sum = n/2 \u00d7 (first + last) = 12/2 \u00d7 (7+29) = <b>216</b>.","d":"Medium"},{"t":"Quantitative","s":"Permutations & Combinations","q":"In how many ways can 4 people be selected from a group of 6?","o":["360","15","20","24"],"a":1,"e":"Order does not matter \u2192 combination. C(6,4) = <b>15</b>. (If order mattered it would be P(6,4) = 360.)","d":"Easy"},{"t":"Quantitative","s":"Permutations & Combinations","q":"In how many ways can 4 people be selected from a group of 7?","o":["840","28","35","18"],"a":2,"e":"Order does not matter \u2192 combination. C(7,4) = <b>35</b>. (If order mattered it would be P(7,4) = 840.)","d":"Easy"},{"t":"Quantitative","s":"Permutations & Combinations","q":"In how many ways can 4 people be selected from a group of 10?","o":["5040","120","40","210"],"a":3,"e":"Order does not matter \u2192 combinatio angements = 7!/(2!\u00d72!) = <b>1260</b>.","d":"Medium"},{"t":"Quantitative","s":"Permutations & Combinations","q":"In how many ways can 7 people be seated around a circular table?","o":["120","720","360","5040"],"a":1,"e":"Circular arrangements = (n\u22121)! = 6! = <b>720</b>. One seat is fixed to remove rotational duplicates.","d":"Medium"},{"t":"Quantitative","s":"Permutations & Combinations","q":"In how many ways can 8 people be seated around a circular table?","o":["2520","5040","40320","720"],"a":1,"e":"Circular arrangements = (n\u22121)! = 7! = <b>5040</b>. One seat is fixed to remove rotational duplicates.","d":"Medium"},{"t":"Quantitative","s":"Permutations & Combinations","q":"From 7 men and 5 women, in how many ways can a committee of 2 men and 2 women be formed?","o":["210","31","420","495"],"a":0,"e":"Choose independently and multiply: C(7,2) \u00d7 C(5,2) = 21 \u00d7 10 = <b>210</b>.","d":"Medium"},{"t":"Quantitative","s":"Permutations & Combinations","q":"From 6 men and 4 women, in how many ways can a committee of 2 men and 3 women be formed?","o":["252","60","120","19"],"a":1,"e":"Choose independently and multiply: C(6,2) \u00d7 C(4,3) = 15 \u00d7 4 = <b>60</b>.","d":"Medium"},{"t":"Quantitative","s":"Permutations & Combinations","q":"From 6 men and 4 women, in how many ways can a committee of 2 men and 2 women be formed?","o":["21","210","90","180"],"a":2,"e":"Choose independently and multiply: C(6,2) \u00d7 C(4,2) = 15 \u00d7 6 = <b>90</b>.","d":"Medium"},{"t":"Quantitative","s":"Permutations & Combinations","q":"From 6 men and 5 women, in how many ways can a committee of 3 men and 2 women be formed?","o":["30","462","200","400"],"a":2,"e":"Choose independently and multiply: C(6,3) \u00d7 C(5,2) = 20 \u00d7 10 = <b>200</b>.","d":"Medium"},{"t":"Quantitative","s":"Probability","q":"Two dice are thrown together. What is the probability that the sum is 5?","o":["1/9","1/6","1/3","5/36"],"a":0,"e":"There are 36 equally likely outcomes; sum 5 occurs in 4 of them \u2192 4/36 = <b>1/9</b>.","d":"Medium"},{"t":"Quantitative","s":"Probability","q":"Two dice are thrown together. What is the probability that the sum is 6?","o":["5/36","1/6","5/12","0.08"],"a":0,"e":"There are 36 equally likely outcomes; sum 6 occurs in 5 of them \u2192 5/36 = <b>5/36</b>.","d":"Medium"},{"t":"Quantitative","s":"Probability","q":"Two dice are thrown together. What is the probability that the sum is 7?","o":["1/2","7/36","1/6","0.25"],"a":2,"e":"There are 36 equally likely outcomes; sum 7 occurs in 6 of them \u2192 6/36 = <b>1/6</b>.","d":"Medium"},{"t":"Quantitative","s":"Probability","q":"Two dice are thrown together. What is the probability that the sum is 8?","o":["1/6","5/36","0.17","5/12"],"a":1,"e":"There are 36 equally likely outcomes; sum 8 occurs in 5 of them \u2192 5/36 = <b>5/36</b>.","d":"Medium"},{"t":"Quantitative","s":"Probability","q":"Two dice are thrown together. What is the probability that the sum is 9?","o":["1/9","1/6","1/3","5/36"],"a":0,"e":"There are 36 equally likely outcomes; sum 9 occurs in 4 of them \u2192 4/36 = <b>1/9</b>.","d":"Medium"},{"t":"Quantitative","s":"Probability","q":"Two dice are thrown together. What is the probability that the sum is 10?","o":["1/4","1/9","1/12","1/6"],"a":2,"e":"There are 36 equally likely outcomes; sum 10 occurs in 3 of them \u2192 3/36 = <b>1/12</b>.","d":"Medium"},{"t":"Quantitative","s":"Probability","q":"A bag contains 5 red and 3 blue balls. Two balls are drawn at random. What is the probability that both are red?","o":["25/64","5/14","5/8","3/28"],"a":1,"e":"C(5,2)/C(8,2) = 10/28 = <b>5/14</b>.","d":"Medium"},{"t":"Quantitative","s":"Probability","q":"A bag contains 7 red and 3 blue balls. Two balls are drawn at random. What is the probability that both are red?","o":["49/100","7/15","1/15","7/10"],"a":1,"e":"C(7,2)/C(10,2) = 21/45 = <b>7/15</b>.","d":"Medium"},{"t":"Quantitative","s":"Probability","q":"A bag contains 6 red and 4 blue balls. Two balls are drawn at random. What is the probability that both are red?","o":["1/3","9/25","3/5","2/15"],"a":0,"e":"C(6,2)/C(10,2) = 15/45 = <b>1/3</b>.","d":"Medium"},{"t":"Quantitative","s":"Probability","q":"A bag contains 3 red and 5 blue balls. Two balls are drawn at random. What is the probability that both are red?","o":["9/64","5/14","3/8","3/28"],"a":3,"e":"C(3,2)/C(8,2) = 3/28 = <b>3/28</b>.","d":"Medium"},{"t":"Quantitative","s":"Probability","q":"A coin is tossed 2 times. What is the probability of getting at least one head?","o":["1/2","1/4","0.6","3/4"],"a":3,"e":"Use the complement: P(at least one) = 1 \u2212 P(no heads) = 1 \u2212 1/2^2 = <b>3/4</b>. Always attack 'at least one' via the complement.","d":"Medium"},{"t":"Quantitative","s":"Probability","q":"A coin is tossed 3 times. What is the probability of getting at least one head?","o":["1/2","3/8","1/8","7/8"],"a":3,"e":"Use the complement: P(at least one) = 1 \u2212 P(no heads) = 1 \u2212 1/2^3 = <b>7/8</b>. Always attack 'at least one' via the complement.","d":"Medium"},{"t":"Quantitative","s":"Probability","q":"A coin is tossed 4 times. What is the probability of getting at least one head?","o":["1/4","15/16","1/2","1/16"],"a":1,"e":"Use the complement: P(at least one) = 1 \u2212 P(no heads) = 1 \u2212 1/2^4 = <b>15/16</b>. Always attack 'at least one' via the complement.","d":"Medium"},{"t":"Quantitative","s":"Probability","q":"A coin is tossed 5 times. What is the probability of getting at least one head?","o":["1/2","1/32","5/32","31/32"],"a":3,"e":"Use the complement: P(at least one) = 1 \u2212 P(no heads) = 1 \u2212 1/2^5 = <b>31/32</b>. Always attack 'at least one' via the complement.","d":"Medium"},{"t":"Quantitative","s":"Probability","q":"One card is drawn at random from a standard pack of 52. What is the probability that it is a king?","o":["1/13","0.06","2/13","3/26"],"a":0,"e":"There are 4 such cards out of 52 \u2192 4/52 = <b>1/13</b>.","d":"Easy"},{"t":"Quantitative","s":"Probability","q":"One card is tly two face(s) painted?","o":["64","8","96","48"],"a":3,"e":"With n = 6 per edge: 12(n\u22122) = <b>48</b>. (Corners = 8 always, edges = 12(n\u22122), faces = 6(n\u22122)\u00b2, interior = (n\u22122)\u00b3.)","d":"Medium"},{"t":"Logical Reasoning","s":"Cubes","q":"A cube is painted on all faces and then cut into 27 equal smaller cubes. How many smaller cubes have exactly two face(s) painted?","o":["8","12","6","1"],"a":1,"e":"With n = 3 per edge: 12(n\u22122) = <b>12</b>. (Corners = 8 always, edges = 12(n\u22122), faces = 6(n\u22122)\u00b2, interior = (n\u22122)\u00b3.)","d":"Medium"},{"t":"Logical Reasoning","s":"Cubes","q":"A cube is painted on all faces and then cut into 343 equal smaller cubes. How many smaller cubes have no face(s) painted?","o":["60","8","125","150"],"a":2,"e":"With n = 7 per edge: (n\u22122)\u00b3 = <b>125</b>. (Corners = 8 always, edges = 12(n\u22122), faces = 6(n\u22122)\u00b2, interior = (n\u22122)\u00b3.)","d":"Medium"},{"t":"Logical Reasoning","s":"Cubes","q":"A cube is painted on all faces and then cut into 343 equal smaller cubes. How many smaller cubes have exactly two face(s) painted?","o":["60","8","125","150"],"a":0,"e":"With n = 7 per edge: 12(n\u22122) = <b>60</b>. (Corners = 8 always, edges = 12(n\u22122), faces = 6(n\u22122)\u00b2, interior = (n\u22122)\u00b3.)","d":"Medium"},{"t":"Logical Reasoning","s":"Cubes","q":"A cube is painted on all faces and then cut into 27 equal smaller cubes. How many smaller cubes have exactly one face(s) painted?","o":["1","6","12","8"],"a":1,"e":"With n = 3 per edge: 6(n\u22122)\u00b2 = <b>6</b>. (Corners = 8 always, edges = 12(n\u22122), faces = 6(n\u22122)\u00b2, interior = (n\u22122)\u00b3.)","d":"Medium"},{"t":"Logical Reasoning","s":"Calendars","q":"If 1 January 2027 was a Saturday, what day was 1 January 2028? (2027 is an ordinary year.)","o":["Tuesday","Saturday","Monday","Sunday"],"a":3,"e":"An ordinary year has 365 days = 1 odd day. Saturday + 1 = <b>Sunday</b>.","d":"Medium"},{"t":"Logical Reasoning","s":"Calendars","q":"If 1 January 2027 was a Thursday, what day was 1 January 2028? (2027 is an ordinary year.)","o":["Sunday","Friday","Thursday","Saturday"],"a":1,"e":"An ordinary year has 365 days = 1 odd day. Thursday + 1 = <b>Friday</b>.","d":"Medium"},{"t":"Logical Reasoning","s":"Calendars","q":"If 1 January 2024 was a Sunday, what day was 1 January 2025? (2024 is a leap year.)","o":["Tuesday","Sunday","Monday","Wednesday"],"a":0,"e":"A leap year has 366 days = 2 odd days. Sunday + 2 = <b>Tuesday</b>.","d":"Medium"},{"t":"Logical Reasoning","s":"Calendars","q":"If 1 January 2023 was a Saturday, what day was 1 January 2024? (2023 is an ordinary year.)","o":["Saturday","Monday","Tuesday","Sunday"],"a":3,"e":"An ordinary year has 365 days = 1 odd day. Saturday + 1 = <b>Sunday</b>.","d":"Medium"},{"t":"Logical Reasoning","s":"Calendars","q":"If 1 January 2028 was a Sunday, what day was 1 January 2029? (2028 is a leap year.)","o":["Sunday","Wednesday","Tuesday","Monday"],"a":2,"e":"A leap year has 366 days = 2 odd days. Sunday + 2 = <b>Tuesday</b>.","d":"Medium"},{"t":"Logical Reasoning","s":"Calendars","q":"If 1 January 2025 was a Friday, what day was 1 January 2026? (2025 is an ordinary year.)","o":["Saturday","Friday","Monday","Sunday"],"a":0,"e":"An ordinary year has 365 days = 1 odd day. Friday + 1 = <b>Saturday</b>.","d":"Medium"},{"t":"Logical Reasoning","s":"Calendars","q":"If 1 January 2025 was a Wednesday, what day was 1 January 2026? (2025 is an ordinary year.)","o":["Thursday","Wednesday","Saturday","Friday"],"a":0,"e":"An ordinary year has 365 days = 1 odd day. Wednesday + 1 = <b>Thursday</b>.","d":"Medium"},{"t":"Logical Reasoning","s":"Calendars","q":"If 1 January 2027 was a Friday, what day was 1 January 2028? (2027 is an ordinary year.)","o":["Saturday","Monday","Sunday","Friday"],"a":0,"e":"An ordinary year has 365 days = 1 odd day. Friday + 1 = <b>Saturday</b>.","d":"Medium"},{"t":"Quantitative","s":"Percentages","q":"Find 25% o "4%","-4%"],"a":3,"e":"Net = \u2212x\u00b2/100 = \u221220\u00b2/100 = <b>4% decrease</b>. It is never zero \u2014 the decrease applies to a larger base.","d":"Medium"},{"t":"Quantitative","s":"Percentages","q":"In a two-candidate election the winner got 60% of the votes and won by 1200 votes. Find the total number of votes.","o":["3000","6000","2000","2400"],"a":1,"e":"Margin = 60% \u2212 40% = 20% of total = 1200 \u2192 total = 1200 \u00d7 100/20 = <b>6000</b>.","d":"Medium"},{"t":"Quantitative","s":"Percentages","q":"In a two-candidate election the winner got 55% of the votes and won by 400 votes. Find the total number of votes.","o":["800","4000","888.89","727.27"],"a":1,"e":"Margin = 55% \u2212 45% = 10% of total = 400 \u2192 total = 400 \u00d7 100/10 = <b>4000</b>.","d":"Medium"},{"t":"Quantitative","s":"Percentages","q":"In a two-candidate election the winner got 60% of the votes and won by 400 votes. Find the total number of votes.","o":["2000","666.67","800","1000"],"a":0,"e":"Margin = 60% \u2212 40% = 20% of total = 400 \u2192 total = 400 \u00d7 100/20 = <b>2000</b>.","d":"Medium"},{"t":"Quantitative","s":"Percentages","q":"In an exam 35% failed in Maths, 45% failed in English and 15% failed in both. What percent passed in both subjects?","o":["35%","20%","85%","65%"],"a":0,"e":"Failed in at least one = 35 + 45 \u2212 15 = 65%. Passed in both = 100 \u2212 65 = <b>35%</b>. Subtract the overlap or you double-count.","d":"Medium"},{"t":"Quantitative","s":"Percentages","q":"In an exam 40% failed in Maths, 50% failed in English and 25% failed in both. What percent passed in both subjects?","o":["10%","75%","35%","65%"],"a":2,"e":"Failed in at least one = 40 + 50 \u2212 25 = 65%. Passed in both = 100 \u2212 65 = <b>35%</b>. Subtract the overlap or you double-count.","d":"Medium"},{"t":"Quantitative","s":"Percentages","q":"In an exam 35% failed in Maths, 55% failed in English and 15% failed in both. What percent passed in both subjects?","o":["10%","25%","75%","85%"],"a":1,"e":"Failed in at least one = 35 + 55 \u2212 15 = 75%. Passed in both = 100 \u2212 75 = <b>25%</b>. Subtract the overlap or you double-count.","d":"Medium"},{"t":"Quantitative","s":"Percentages","q":"In an exam 30% failed in Maths, 45% failed in English and 25% failed in both. What percent passed in both subjects?","o":["75%","25%","50%","40%"],"a":2,"e":"Failed in at least one = 30 + 45 \u2212 25 = 50%. Passed in both = 100 \u2212 50 = <b>50%</b>. Subtract the overlap or you double-count.","d":"Medium"},{"t":"Quantitative","s":"Percentages","q":"In an exam 30% failed in Maths, 55% failed in English and 20% failed in both. What percent passed in both subjects?","o":["35%","80%","15%","65%"],"a":0,"e":"Failed in at least one = 30 + 55 \u2212 20 = 65%. Passed in both = 100 \u2212 65 = <b>35%</b>. Subtract the overlap or you double-count.","d":"Medium"},{"t":"Quantitative","s":"Profit & Loss","q":"An article costing \u20b9200 is sold at a profit of 10%. Find the selling price.","o":["180","220","210","20"],"a":1,"e":"SP = CP(100+P)/100 = 200 \u00d7 110/100 = <b>\u20b9220</b>.","d":"Easy"},{"t":"Quantitative","s":"Profit & Loss","q":"An article costing \u20b9400 is sold at a profit of 10%. Find the selling price.","o":["40","440","360","410"],"a":1,"e":"SP = CP(100+P)/100 = 400 \u00d7 110/100 = <b>\u20b9440</b>.","d":"Easy"},{"t":"Quantitative","s":"Profit & Loss","q":"An article costing \u20b91200 is sold at a profit of 15%. Find the selling price.","o":["1380","1020","180","1215"],"a":0,"e":"SP = CP(100+P)/100 = 1200 \u00d7 115/100 = <b>\u20b91380</b>.","d":"Easy"},{"t":"Quantitative","s":"Profit & Loss","q":"An article costing \u20b9200 is sold at a profit of 15%. Find the selling price.","o":["215","230","170","30"],"a":1,"e":"SP = CP(100+P)/100 = 200 \u00d7 115/100 = <b>\u20b9230</b>.","d":"Easy"},{"t":"Quantitative","s":"Profit & Loss","q":"An article costing \u20b9800 is sold at a profit of 10%. Find the selling price.","o":["880","810","80","720"],"a":0,"e":"SP = CP(100+P)/100 = 800 \u00d7 110/100 = <b>\u20b9880</b>.","d":"Easy"},{"t":"Quantitative","s":"Profit & Loss","q":"An article bought for \u20b9600 is sold for \u20b9675. Find the profit percentage.","o":["11.11%","5.88%","12.5%","75%"],"a":2,"e":"Profit% = (SP\u2212CP)/CP \u00d7 100 = 75/600 \u00d7 100 = <b>12.5%</b>. Profit is always on COST price, never on SP.","d":"Easy"},{"t":"Quantitative","s":"Profit & Loss","q":"An article bought for \u20b9400 is sold for \u20b9460. Find the profit percentage.","o":["13.04%","60%","6.98%","15%"],"a":3,"e":"Profit% = (SP\u2212CP)/CP \u00d7 100 = 60/400 \u00d7 100 = <b>15%</b>. Profit is always on COST price, never on SP.","d":"Easy"},{"t":"Quantitative","s":"Profit & Loss","q":"An article bought for \u20b9300 is sold for \u20b9375. Find the profit percentage.","o":["20%","11.11%","75%","25%"],"a":3,"e":"Profit% = (SP\u2212CP)/CP \u00d7 100 = 75/300 \u00d7 100 = <b>25%</b>. Profit is always on COST price, never on SP.","d":"Easy"},{"t":"Quantitative","s":"Profit & Loss","q":"An article bought for \u20b9600 is sold for \u20b9700. Find the profit percentage.","o":["14.29%","100%","7.69%","16.67%"],"a":3,"e":"Profit% = (SP\u2212CP)/CP \u00d7 100 = 100/600 \u00d7 100 = <b>16.67%</b>. Profit is always on COST price, never on SP.","d":"Easy"},{"t":"Quantitative","s":"Profit & Loss","q":"A shopkeeper marks his goods 40% above cost and then allows a discount of 10%. Find his net profit percentage.","o":["26%","30%","-30%","50%"],"a":0,"e":"Take CP = 100 \u2192 MP = 140 \u2192 SP = 140 \u00d7 0.9 = 126 \u2192 profit = <b>26%</b>. Markup is on CP but discount is on MP, so you cannot just subtract.","d":"Medium"},{"t":"Quantitative","s":"Profit & Loss","q":"A shopkeeper marks his goods 50% above cost and then allows a discount of 25%. Find his net profit percentage.","o":["12.5%","75%","25%","-25%"],"a":0,"e":"Take CP = 100 \u2192 MP = 150 \u2192 SP = 150 \u00d7 0.75 = 112.5 \u2192 profit = <b>12.5%</b>. Markup is on CP but discount is on MP, so you cannot just subtract.","d":"Medium"},{"t":"Quantitative","s":"Profit & Loss","q":"Two articles are each sold for \u20b9480. One is sold at a profit of 10% and the other at a loss of 10%. What is the net result?","o":["1%","-1%","0%","10%"],"a":1,"e":"Whenever two items sell at the SAME price with equal \u00b110%, the result is always a LOSS of x\u00b2/100 = <b>1%</b>. Never break-even.","d":"Medium"},{"t":"Quantitative","s":"Profit & Loss","q":"Two articles are each sold for \u20b999. One is sold at a profit of 20% and the other at a loss of 20%. What is the net result?","o":["-4%","4%","20%","0%"],"a":0,"e":"Whenever two items sell at the SAME price with equal \u00b120%, the result is always a LOSS of x\u00b2/100 = <b>4%</b>. Never break-even.","d":"Medium"},{"t":"Quantitative","s":"Profit & Loss","q":"Two articles are each sold for \u20b9240. One is sold at a profit of 20% and the other at a loss of 20%. What is the net result?","o":["-4%","0%","4%","20%"],"a":0,"e":"Whenever two items sell at the SAME price with equal \u00b120%, the result is always a LOSS of x\u00b2/100 = <b>4%</b>. Never break-even.","d":"Medium"},{"t":"Quantitative","s":"Profit & Loss","q":"Two articles are each sold for \u20b9240. One is sold at a profit of 25% and the other at a loss of 25%. What is the net result?","o":["-6.25%","6.25%","25%","0%"],"a":0,"e":"Whenever two items sell at the SAME price with equal \u00b125%, the result is always a LOSS of x\u00b2/100 = <b>6.25%</b>. Never break-even.","d":"Medium"},{"t":"Quantitative","s":"Profit & Loss","q":"A dealer sells goods at cost price but uses a weight of 960 g instead of 1 kg. Find his gain percentage.","o":["4.17%","40%","4%","8%"],"a":0,"e":"Gain% = error/(true \u2212 error) \u00d7 100 = 40/960 \u00d7 100 = <b>4.17%</b>.","d":"Medium"},{"t":"Quantitative","s":"Profit & Loss","q":"A dealer sells goods at cost price but uses a weight of 750 g instead of 1 kg. Find his gain percentage.","o":["17%","33.33%","250%","25%"],"a":1,"e":"Gain% = error/(true \u2212 error) \u00d7 100 = 250/750 \u00d7 100 = <b>33.33%</b>.","d":"Medium"},{"t":"Quantitative","s":"Simple & Compound Interest","q":"Find the simple interest on \u20b98000 at 12% per annum for 2 years.","o":["192","9920","960","1920"],"a":3,"e":"SI = PRT/100 = 8000\u00d712\u00d72/100 = <b>\u20b91920</b>.","d":"Easy"},{"t":"Quantitative","s":"Simple & Compound Interest","q":"Find the simple interest on \u20b98000 at 10% per annum for 4 years.","o":["800","11200","3200","320"],"a":2,"e":"SI = PRT/100 = 8000\u00d710\u00d74/100 = <b>\u20b93200</b>.","d":"Easy"},{"t":"Quantitative","s":"Simple & Compound Interest","q":"Find the simple interest on \u20b98000 at 10% per annum for 3 years.","o":["2400","240","800","10400"],"a":0,"e":"SI = PRT/100 = 8000\u00d710\u00d73/100 = <b>\u20b92400</b>.","d":"Easy"},{"t":"Quantitative","s":"Simple & Compound Interest","q":"Find the simple interest on \u20b98000 at 12% per annum for 4 years.","o":["384","11840","960","3840"],"a":3,"e":"SI = PRT/100 = 8000\u00d712\u00d74/100 = <b>\u20b93840</b>.","d":"Easy"},{"t":"Quantitative","s":"Simple & Compound Interest","q":"Find the simple interest on \u20b95000 at 10% per annum for 3 years.","o":["1500","500","150","6500"],"a":0,"e":"SI = PRT/100 = 5000\u00d710\u00d73/100 = <b>\u20b91500</b>.","d":"Easy"},{"t":"Quantitative","s":"Simple & Compound Interest","q":"Find the simple interest on \u20b912000 at 12% per annum for 3 years.","o":["1440","16320","432","4320"],"a":3,"e":"SI = PRT/100 = 12000\u00d712\u00d73/100 = <b>\u20b94320</b>.","d":"Easy"},{"t":"Quantitative","s":"Simple & Compound Interest","q":"Find the simple interest on \u20b912000 at 8% per annum for 2 years.","o":["13920","960","1920","192"],"a":2,"e":"SI = PRT/100 = 12000\u00d78\u00d72/100 = <b>\u20b91920</b>.","d":"Easy"},{"t":"Quantitative","s":"Simple & Compound Interest","q":"Find the compound interest on \u20b98000 at 20% per annum for 2 years.","o":["3520","11520","3200","7040"],"a":0,"e":"A = P(1+R/100)\u00b2 = 8000 \u00d7 1.44 = 11520; CI = A \u2212 P = <b>\u20b93520</b>. (SI would be only \u20b93200.)","d":"Medium"},{"t":"Quantitative","s":"Simple & Compound Interest","q":"Find the difference between compound and simple interest on \u20b98000 at 10% per annum for 2 years.","o":["800","160","80","1600"],"a":2,"e":"Difference for 2 years = P(R/100)\u00b2 = 8000 \u00d7 (10/100)\u00b2 = <b>\u20b980</b>. Memorise this \u2014 it appears constantly.","d":"Medium"},{"t":"Quantitative","s":"Simple & Compound Interest","q":"Find the difference between compound and simple interest on \u20b910000 at 5% per annum for 2 years.","o":["500","25","50","1000"],"a":1,"e":"Difference for 2 years = P(R/100)\u00b2 = 10000 \u00d7 (5/100)\u00b2 = <b>\u20b925</b>. Memorise this \u2014 it appears constantly.","d":"Medium"},{"t":"Quantitative","s":"Simple & Compound Interest","q":"A sum doubles in 3 years at compound interest. In how many years will it become 8 times itself?","o":["9 years","12 years","11 years","24 years"],"a":0,"e":"8 = 2^3, so it needs 3 doubling periods \u2192 3 \u00d7 3 = <b>9 years</b>. At CI growth is multiplicative, not linear.","d":"Medium"},{"t":"Quantitative","s":"Simple & Compound Interest","q":"A sum doubles in 5 years at compound interest. In how many years will it become 4 times itself?","o":["20 years","10 years","8 years","9 years"],"a":1,"e":"4 = 2^2, so it needs 2 doubling periods \u2192 2 \u00d7 5 = <b>10 years</b>. At CI growth is multiplicative, not linear.","d":"Medium"},{"t":"Quantitative","s":"Ratio & Proportion","q":"\u20b91800 is divided among A, B and C in the ratio 2 : 5 : 8. Find C's share.","o":["600","475","960","240"],"a":2,"e":"Total parts = 15. C gets 8/15 \u00d7 1800 = <b>\u20b9960</b>.","d":"Easy"},{"t":"Quantitative","s":"Ratio & Proportion","q":"\u20b9750 is divided among A, B and C in the ratio 2 : 5 : 8. Find C's share.","o":["400","200","100","250"],"a":0,"e":"Total parts = 15. C gets 8/15 \u00d7 750 = <b>\u20b9400</b>.","d":"Easy"},{"t":"Quantitative","s":"Ratio & Proportion","q":"\u20b9750 is divided among A, B and C in the ratio 4 : 5 : 6. Find C's share.","o":["175","200","300","250"],"a":2,"e":"Total parts = 15. C gets 6/15 \u00d7 750 = <b>\u20b9300</b>.","d":"Easy"},{"t":"Quantitative","s":"Ratio & Proportion","q":"\u20b91500 is divided among A, B and C in the ratio 4 : 5 : 6. Find C's share.","o":["475","600","500","400"],"a":1,"e":"Total parts = 15. C gets 6/15 \u00d7 1500 = <b>\u20b9600</b>.","d":"Easy"},{"t":"Quantitative","s":"Averages","q":"The average of 9 numbers is 20. If one number, 28, is removed, find the average of the remaining numbers.","o":["20","16.89","20.8","19"],"a":3,"e":"Sum = 9\u00d720 = 180. Remaining sum = 180\u221228 = 152, over 8 numbers \u2192 <b>19</b>.","d":"Medium"},{"t":"Quantitative","s":"Averages","q":"The average of 5 numbers is 40. If one number, 52, is removed, find the average of the remaining numbers.","o":["37","42","40","29.6"],"a":0,"e":"Sum = 5\u00d740 = 200. Remaining sum = 200\u221252 = 148, over 4 numbers \u2192 <b>37</b>.","d":"Medium"},{"t":"Quantitative","s":"Averages","q":"The average of 5 numbers is 20. If one number, 36, is removed, find the average of the remaining numbers.","o":["16","20","22.67","12.8"],"a":0,"e":"Sum = 5\u00d720 = 100. Remaining sum = 100\u221236 = 64, over 4 numbers \u2192 <b>16</b>.","d":"Medium"},{"t":"Quantitative","s":"Averages","q":"The average of 11 numbers is 40. If one number, 52, is removed, find the average of the remaining numbers.","o":["38.8","41","40","35.27"],"a":0,"e":"Sum = 11\u00d740 = 440. Remaining sum = 440\u221252 = 388, over 10 numbers \u2192 <b>38.8</b>.","d":"Medium"},{"t":"Quantitative","s":"Averages","q":"The average of 7 numbers is 30. If one number, 46, is removed, find the average of the remaining numbers.","o":["32","27.33","30","23.43"],"a":1,"e":"Sum = 7\u00d730 = 210. Remaining sum = 210\u221246 = 164, over 6 numbers \u2192 <b>27.33</b>.","d":"Medium"},{"t":"Quantitative","s":"Averages","q":"The average of 7 numbers is 20. If one number, 36, is removed, find the average of the remaining numbers.","o":["20","22","17.33","14.86"],"a":2,"e":"Sum = 7\u00d720 = 140. Remaining sum = 140\u221236 = 104, over 6 numbers \u2192 <b>17.33</b>.","d":"Medium"},{"t":"Quantitative","s":"Averages","q":"The average of 11 numbers is 30. If one number, 40, is removed, find the average of the remaining numbers.","o":["26.36","30.83","30","29"],"a":3,"e":"Sum = 11\u00d730 = 330. Remaining sum = 330\u221240 = 290, over 10 numbers \u2192 <b>29</b>.","d":"Medium"},{"t":"Quantitative","s":"Averages","q":"The average weight of 8 people increases by 1.5 kg when a new person replaces one weighing 45 kg. Find the weight of the new person.","o":["57 kg","33 kg","46.5 kg","12 kg"],"a":0,"e":"Total increase = 8 \u00d7 1.5 = 12 kg, so the new person is 12 kg heavier: 45 + 12 = <b>57 kg</b>.","d":"Medium"},{"t":"Quantitative","s":"Averages","q":"The average weight of 10 people increases by 2.5 kg when a new person replaces one weighing 65 kg. Find the weight of the new person.","o":["25 kg","40 kg","67.5 kg","90 kg"],"a":3,"e":"Total increase = 10 \u00d7 2.5 = 25 kg, so the new person is 25 kg heavier: 65 + 25 = <b>90 kg</b>.","d":"Medium"},{"t":"Quantitative","s":"Averages","q":"The average weight of 10 people increases by 1.5 kg when a new person replaces one weighing 55 kg. Find the weight of the new person.","o":["40 kg","56.5 kg","15 kg","70 kg"],"a":3,"e":"Total increase = 10 \u00d7 1.5 = 15 kg, so the new person is 15 kg heavier: 55 + 15 = <b>70 kg</b>.","d":"Medium"},{"t":"Quantitative","s":"Averages","q":"The average weight of 10 people increases by 1.5 kg when a new person replaces one weighing 45 kg. Find the weight of the new person.","o":["15 kg","60 kg","30 kg","46.5 kg"],"a":1,"e":"Total increase = 10 \u00d7 1.5 = 15 kg, so the new person is 15 kg heavier: 45 + 15 = <b>60 kg</b>.","d":"Medium"},{"t":"Quantitative","s":"Averages","q":"A man covers a distance at 40 km/h and returns over the same distance at 60 km/h. Find his average speed for the whole journey.","o":["100 km/h","20 km/h","48 km/h","50 km/h"],"a":2,"e":"Equal distances \u2192 harmonic mean = 2ab/(a+b) = 2\u00d740\u00d760/100 = <b>48 km/h</b>. The plain average 50 is the trap.","d":"Medium"},{"t":"Quantitative","s":"Mixtures & Alligation","q":"In what ratio must an item costing \u20b930/kg be mixed with one costing \u20b940/kg to get a mixture worth \u20b932/kg?","o":["1 : 1","4 : 1","1 : 4","30 : 40"],"a":1,"e":"Alligation: cheaper : dearer = (d\u2212m) : (m\u2212c) = (40\u221232) : (32\u221230) = <b>4 : 1</b>.","d":"Medium"},{"t":"Quantitative","s":"Mixtures & Alligation","q":"In what ratio must an item costing \u20b915/kg be mixed with one costing \u20b925/kg to get a mixture worth \u20b921/kg?","o":["3 : 2","1 : 1","15 : 25","2 : 3"],"a":3,"e":"Alligation: cheaper : dearer = (d\u2212m) : (m\u2212c) = (25\u221221) : (21\u221215) = <b>2 : 3</b>.","d":"Medium"},{"t":"Quantitative","s":"Mixtures & Alligation","q":"In what ratio must an item costing \u20b924/kg be mixed with one costing \u20b936/kg to get a mixture worth \u20b934/kg?","o":["1 : 1","5 : 1","1 : 5","24 : 36"],"a":2,"e":"Alligation: cheaper : dearer = (d\u2212m) : (m\u2212c) = (36\u221234) : (34\u221224) = <b>1 : 5</b>.","d":"Medium"},{"t":"Quantitative","s":"Mixtures & Alligation","q":"In what ratio must an item costing \u20b930/kg be mixed with one costing \u20b940/kg to get a mixture worth \u20b934/kg?","o":["30 : 40","2 : 3","1 : 1","3 : 2"],"a":3,"e":"Alligation: cheaper : dearer = (d\u2212m) : (m\u2212c) = (40\u221234) : (34\u221230) = <b>3 : 2</b>.","d":"Medium"},{"t":"Quantitative","s":"Mixtures & Alligation","q":"From 40 litres of pure milk, 4 litres are removed and replaced with water. This is done twice. How much pure milk remains?","o":["32.4 L","16 L","32 L","36 L"],"a":0,"e":"Remaining = V(1\u2212r/V)\u207f = 40(1\u22124/40)\u00b2 = 40 \u00d7 0.81 = <b>32.4 L<
