.","d":"Easy"},{"t":"Logical Reasoning","s":"Number Series","q":"Find the next term: 4, 9, 19, 39, ?","o":["78","59","80","79"],"a":3,"e":"\u00d7 2 + 1: 39 \u00d7 2 + 1 = <b>79</b>.","d":"Medium"},{"t":"Logical Reasoning","s":"Number Series","q":"Find the next term: 6, 11, 21, 36, 56, ?","o":["71","81","86","76"],"a":1,"e":"Differences 5, 10, 15, 20 \u2192 next 25. 56 + 25 = <b>81</b>.","d":"Medium"},{"t":"Logical Reasoning","s":"Number Series","q":"Find the next term: 120, 99, 80, 63, ?","o":["46","50","48","54"],"a":2,"e":"These are n\u00b2\u22121 for n = 11, 10, 9, 8 \u2192 next 7\u00b2\u22121 = <b>48</b>.","d":"Medium"},{"t":"Logical Reasoning","s":"Number Series","q":"Find the next term: 1, 2, 6, 24, 120, ?","o":["600","840","640","720"],"a":3,"e":"Multiply by 2, 3, 4, 5 \u2192 next \u00d7 6: 120 \u00d7 6 = <b>720</b>. (Factorials.)","d":"Medium"},{"t":"Logical Reasoning","s":"Number Series","q":"Find the next term: 8, 27, 64, 125, ?","o":["343","216","196","215"],"a":1,"e":"Cubes: 2\u00b3, 3\u00b3, 4\u00b3, 5\u00b3 \u2192 6\u00b3 = <b>216</b>.","d":"Easy"},{"t":"Logical Reasoning","s":"Number Series","q":"Find the next term: 2, 3, 5, 7, 11, 13, ?","o":["16","15","19","17"],"a":3,"e":"Prime numbers in order \u2192 next prime after 13 is <b>17</b>.","d":"Easy"},{"t":"Logical Reasoning","s":"Number Series","q":"Find the next term: 1, 3, 6, 10, 15, ?","o":["18","22","21","20"],"a":2,"e":"Triangular numbers; differences 2, 3, 4, 5 \u2192 next 6. 15 + 6 = <b>21</b>.","d":"Easy"},{"t":"Logical Reasoning","s":"Number Series","q":"Find the next term: 100, 50, 25, 12.5, ?","o":["6.5","12","6.25","5"],"a":2,"e":"Each term is halved: 12.5 \u00f7 2 = <b>6.25</b>.","d":"Easy"},{"t":"Logical Reasoning","s":"Number Series","q":"Find the next term: 2, 4, 12, 48, ?","o":["192","144","96","240"],"a":3,"e":"Multiply by 2, 3, 4 \u2192 next \u00d7 5: 48 \u00d7 5 = <b>240</b>.","d":"Medium"},{"t":"Logical Reasoning","s":"Number Series","q":"Find the next term: 0, 3, 8, 15, 24, ?","o":["35","34","36","33"],"a":0,"e":"Pattern n\u00b2\u22121: 6\u00b2\u22121 = <b>35</b>.","d":"Easy"},{"t":"Logical Reasoning","s":"Number Series","q":"Find the next term: 144, 121, 100, 81, ?","o":["64","60","72","49"],"a":0,"e":"Descending perfect squares 12\u00b2, 11\u00b2, 10\u00b2, 9\u00b2 \u2192 8\u00b2 = <b>64</b>.","d":"Easy"},{"t":"Logical Reasoning","s":"Number Series","q":"Find the next term: 3, 9, 27, 81, ?","o":["324","243","162","216"],"a":1,"e":"Powers of 3, each \u00d7 3 \u2192 81 \u00d7 3 = <b>243</b>.","d":"Easy"},{"t":"Logical Reasoning","s":"Number Series","q":"Find the next term: 1, 4, 10, 22, 46, ?","o":["96","94","90","92"],"a":1,"e":"\u00d7 2 + 2 each time: 46 \u00d7 2 + 2 = <b>94</b>.","d":"Medium"},{"t":"Logical Reasoning","s":"Number Series","q":"Find the next term: 2, 12, 36, 80, ?","o":["100","120","144","150"],"a":3,"e":"Pattern n\u00b3 + n\u00b2: 5\u00b3 + 5\u00b2 = 125 + 25 = <b>150</b>.","d":"Hard"},{"t":"Logical Reasoning","s":"Number Series","q":"Find the next term: 7, 14, 28, 56, ?","o":["112","84","98","120"],"a":0,"e":"Each term doubles: 56 \u00d7 2 = <b>112</b>.","d":"Easy"},{"t":"Logical Reasoning","s":"Number Series","q":"Find the next term: 13, 26, 39, 52, ?","o":["64","65","60","78"],"a":1,"e":"Multiples of 13 \u2192 13 \u00d7 5 = <b>65</b>.","d":"Easy"},{"t":"Logical Reasoning","s":"Number Series","q":"Find the next term: 5, 10, 17, 26, 37, ?","o":["52","48","49","50"],"a":3,"e":"Differences 5, 7, 9, 11 \u2192 next 13. 37 + 13 = <b>50</b>. (Also n\u00b2+1 from n=2.)","d":"Medium"},{"t":"Logical Reasoning","s":"Number Series","q":"Find the next term: 6, 13, 27, 55, ?","o":["109","111","112","110"],"a":1,"e":"\u00d7 2 + 1: 55 \u00d7 2 + 1 = <b>111</b>.","d":"Medium"},{"t":"Logical Reasoning","s":"Number Series","q":"Find the next term: 1, 5, 14, 30, 55, ?","o":["85","91","90","96"],"a":1,"e":"Sums of squares: 1, 1+4, 1+4+9, \u2026 next adds 6\u00b2 = 36 \u2192 55 + 36 = <b>91</b>.","d":"Hard"},{"t":"Logical Reasoning","s":"Number Series","q":"Find the next term: 2, 6, 18, 54, ?","o":["216","108","144","162"],"a":3,"e":"Each term \u00d7 3 \u2192 54 \u00d7 3 = <b>162</b>.","d":"Easy"},{"t":"Logical Reasoning","s":"Number Series","q":"Find the next term: 4, 16, 36, 64, ?","o":["100","81","121","96"],"a":0,"e":"Squares of even numbers 2\u00b2, 4\u00b2, 6\u00b2, 8\u00b2 \u2192 10\u00b2 = <b>100</b>.","d":"Easy"},{"t":"Logical Reasoning","s":"Number Series","q":"Find the next term: 11, 13, 17, 19, 23, ?","o":["29","25","27","31"],"a":0,"e":"Consecutive primes \u2192 after 23 comes <b>29</b>.","d":"Easy"},{"t":"Logical Reasoning","s":"Number Series","q":"Find the next term: 1, 2, 4, 8, 16, ?","o":["30","24","64","32"],"a":3,"e":"Powers of 2 \u2192 16 \u00d7 2 = <b>32</b>.","d":"Easy"},{"t":"Logical Reasoning","s":"Number Series","q":"Find the next term: 9, 16, 25, 36, ?","o":["45","49","48","64"],"a":1,"e":"Squares of 3, 4, 5, 6 \u2192 7\u00b2 = <b>49</b>.","d":"Easy"},{"t":"Logical Reasoning","s":"Letter Series","q":"Find the next term: A, C, E, G, ?","o":["K","H","J","I"],"a":3,"e":"Skip one letter each time (+2): G + 2 = <b>I</b>.","d":"Medium"},{"t":"Logical Reasoning","s":"Letter Series","q":"Find the next term: B, D, F, H, ?","o":["J","K","I","L"],"a":0,"e":"+2 each time \u2192 <b>J</b>.","d":"Medium"},{"t":"Logical Reasoning","s":"Letter Series","q":"Find the next term: A, D, G, J, ?","o":["K","L","M","N"],"a":2,"e":"+3 each time: J + 3 = <b>M</b>.","d":"Medium"},{"t":"Logical Reasoning","s":"Letter Series","q":"Find the next term: Z, X, V, T, ?","o":["S","P","R","Q"],"a":2,"e":"\u22122 each time: T \u2212 2 = <b>R</b>.","d":"Medium"},{"t":"Logical Reasoning","s":"Letter Series","q":"Find the next term: AZ, BY, CX, ?","o":["DX","EW","DW","DV"],"a":2,"e":"First letter +1 (A,B,C,D); second letter \u22121 (Z,Y,X,W) \u2192 <b>DW</b>.","d":"Medium"},{"t":"Logical Reasoning","s":"Letter Series","q":"Find the next term: A, B, D, G, ?","o":["J","L","K","H"],"a":2,"e":"Gaps increase by 1: +1, +2, +3, +4 \u2192 G + 4 = <b>K</b>.","d":"Medium"},{"t":"Logical Reasoning","s":"Letter Series","q":"Find the next term: C, F, I, L, ?","o":["O","M","N","P"],"a":0,"e":"+3 each time: L + 3 = <b>O</b>.","d":"Medium"},{"t":"Logical Reasoning","s":"Letter Series","q":"Find the next term: B, E, J, Q, ?","o":["X","Y","W","Z"],"a":3,"e":"Gaps +3, +5, +7, +9 \u2192 Q + 9 = <b>Z</b>.","d":"Medium"},{"t":"Logical Reasoning","s":"Coding-Decoding","q":"If CAT is coded as DBU, how is DOG coded?","o":["EPH","EPG","DPH","FQI"],"a":0,"e":"Each letter moves forward by 1: D\u2192E, O\u2192P, G\u2192H = <b>EPH</b>.","d":"Easy"},{"t":"Logical Reasoning","s":"Coding-Decoding","q":"If PEN is coded as QFO, how is BOOK coded?","o":["CPPL","BPPL","DQQM","CPPK"],"a":0,"e":"Each letter +1: B\u2192C, O\u2192P, O\u2192P, K\u2192L = <b>CPPL</b>.","d":"Easy"},{"t":"Logical Reasoning","s":"Coding-Decoding","q":"If FRIEND is coded as GSJFOE, how is CANDLE coded?","o":["DBOEMF","DBNEMF","DBOEML","EBOEMF"],"a":0,"e":"Each letter +1: C\u2192D, A\u2192B, N\u2192O, D\u2192E, L\u2192M, E\u2192F = <b>DBOEMF</b>.","d":"Easy"},{"t":"Logical Reasoning","s":"Coding-Decoding","q":"If CAT is coded as XZG, how is DOG coded?","o":["WKT","VLT","WLT","WLS"],"a":2,"e":"Reverse alphabet (A\u2194Z, position + reverse = 27): D(4)\u2192W(23), O(15)\u2192L(12), G(7)\u2192T(20) = <b>WLT</b>.","d":"Medium"},{"t":"Logical Reasoning","s":"Coding-Decoding","q":"If RED = 27 and BLUE = 40, what is GREEN?","o":["44","52","49","46"],"a":2,"e":"Sum of letter positions. R+E+D = 18+5+4 = 27 \u2713. GREEN = 7+18+5+5+14 = <b>49</b>.","d":"Medium"},{"t":"Logical Reasoning","s":"Coding-Decoding","q":"If MOON is coded as NPPO, how is STAR coded?","o":["SUBS","TVBS","TUBS","TUBR"],"a":2,"e":"Each letter +1: S\u2192T, T\u2192U, A\u2192B, R\u2192S = <b>TUBS</b>.","d":"Easy"},{"t":"Logical Reasoning","s":"Coding-Decoding","q":"If TEACHER is coded as VGCEJGT, how is STUDENT coded?","o":["UVWFGPV","TVWFGPV","UVXFGPV","UVWFGPT"],"a":0,"e":"Each letter +2: S\u2192U, T\u2192V, U\u2192W, D\u2192F, E\u2192G, N\u2192P, T\u2192V = <b>UVWFGPV</b>.","d":"Medium"},{"t":"Logical Reasoning","s":"Coding-Decoding","q":"If LONDON is coded as MPOEPO, how is PARIS coded?","o":["PBSJT","QBSJS","QCSJT","QBSJT"],"a":3,"e":"Each letter +1: P\u2192Q, A\u2192B, R\u2192S, I\u2192J, S\u2192T = <b>QBSJT</b>.","d":"Easy"},{"t":"Logical Reasoning","s":"Coding-Decoding","q":"In a code, ROSE is written as 6821 and CHAIR as 73456. How is SEARCH written?","o":["214673","214763","241673","216473"],"a":0,"e":"Map: R=6, O=8, S=2, E=1, C=7, H=3, A=4, I=5. S,E,A,R,C,H = 2,1,4,6,7,3 = <b>214673</b>.","d":"Medium"},{"t":"Logical Reasoning","s":"Coding-Decoding","q":"If BOX is coded as 2-15-24, how is CAT coded?","o":["4-1-20","3-1-20","2-1-20","3-1-19"],"a":1,"e":"Letters replaced by alphabet positions: C=3, A=1, T=20 = <b>3-1-20</b>.","d":"Easy"},{"t":"Logical Reasoning","s":"Coding-Decoding","q":"If GARDEN is coded as HBSEFO, how is FLOWER coded?","o":["GMPXFS","GMPXFR","FMPXFS","HMPXFS"],"a":0,"e":"Each letter +1: F\u2192G, L\u2192M, O\u2192P, W\u2192X, E\u2192F, R\u2192S = <b>GMPXFS</b>.","d":"Easy"},{"t":"Logical Reasoning","s":"Coding-Decoding","q":"If in a code MONKEY is written as XDJMNL (reversed then shifted), which principle is being used?","o":["The word is reversed and then each letter is shifted","Only a forward shift","Only reversal","Vowels are removed"],"a":0,"e":"MONKEY reversed is YEKNOM; the coded form then differs from it by a fixed shift \u2014 so <b>both reversal and a shift</b> are applied.","d":"Medium"},{"t":"Logical Reasoning","s":"Blood Relations","q":"A is B's brother. C is A's mother. D is C's father. How is B related to D?","o":["Nephew","Daughter","Son","Grandchild"],"a":3,"e":"C is mother to both A and B. D is C's father, so D is B's grandfather \u2192 B is D's <b>grandchild</b>. (B's gender is never stated, so 'grandson' would be an assumption.)","d":"Medium"},{"t":"Logical Reasoning","s":"Blood Relations","q":"Pointing to a lady, a man said, 'She is the daughter of my grandfather's only son.' How is the lady related to him?","o":["Daughter","Niece","Cousin","Sister"],"a":3,"e":"His grandfather's only son must be his own father. The father's daughter is his <b>sister</b>.","d":"Medium"},{"t":"Logical Reasoning","s":"Blood Relations","q":"Pointing to a man, a woman said, 'His mother is the only daughter of my mother.' How is the woman related to the man?","o":["Aunt","Mother","Grandmother","Sister"],"a":1,"e":"'The only daughter of my mother' is the woman herself. So the man's mother is the woman \u2192 she is his <b>mother</b>.","d":"Medium"},{"t":"Logical Reasoning","s":"Blood Relations","q":"A is the father of B, but B is not his son. How is B related to A?","o":["Nephew","Brother","Son","Daughter"],"a":3,"e":"If B is A's child but not his son, B must be his <b>daughter</b>.","d":"Easy"},{"t":"Logical Reasoning","s":"Blood Relations","q":"X is the husband of Y. Z is the daughter of X. W is the husband of Z. How is Y related to W?","o":["Sister-in-law","Aunt","Grandmother","Mother-in-law"],"a":3,"e":"Z is Y's daughter, and W is married to Z \u2192 Y is W's <b>mother-in-law</b>.","d":"Medium"},{"t":"Logical Reasoning","s":"Blood Relations","q":"P is Q's brother. R is Q's mother. S is R's father. How is P related to S?","o":["Great-grandson","Nephew","Son","Grandson"],"a":3,"e":"R is mother to P and Q. S is R's father \u2192 S is P's grandfather, so P is S's <b>grandson</b> (P is male, being Q's brother).","d":"Medium"},{"t":"Logical Reasoning","s":"Blood Relations","q":"If A + B means A is the brother of B, and A \u2212 B means A is the sister of B, what does 'P + Q \u2212 R' mean?","o":["R is the brother of P","P is the sister of R","P is the father of R","P is the brother of Q, and Q is the sister of R"],"a":3,"e":"Read left to right: P + Q \u2192 P is Q's brother; Q \u2212 R \u2192 Q is R's sister. So <b>P is the brother of Q and Q is the sister of R</b>.","d":"Medium"},{"t":"Logical Reasoning","s":"Blood Relations","q":"A woman introduces a man as the son of the brother of her mother. How is the man related to the woman?","o":["Cousin","Uncle","Nephew","Brother"],"a":0,"e":"Her mother's brother is her maternal uncle; his son is her <b>cousin</b>.","d":"Medium"},{"t":"Logical Reasoning","s":"Blood Relations","q":"Q is the son of P. R is the sister of Q. S is the mother of R. P is the husband of S. How is Q related to S?","o":["Son","Nephew","Grandson","Brother"],"a":0,"e":"S is R's mother and P's wife; Q is P's son, so Q is also S's <b>son</b>.","d":"Easy"},{"t":"Logical Reasoning","s":"Blood Relations","q":"Pointing to a photograph, a man says, 'I have no brother or sister, but that man's father is my father's son.' Whose photograph is it?","o":["His father","His nephew","His son","Himself"],"a":2,"e":"With no siblings, 'my father's son' is the speaker himself. So that man's father is the speaker \u2192 the photograph is of his <b>son</b>.","d":"Hard"},{"t":"Logical Reasoning","s":"Direction Sense","q":"A man walks 3 km east, then 4 km north. How far is he from his starting point?","o":["5 km","1 km","7 km","12 km"],"a":0,"e":"Perpendicular legs \u2192 \u221a(3\u00b2+4\u00b2) = <b>5 km</b> (the 3-4-5 triple).","d":"Easy"},{"t":"Logical Reasoning","s":"Direction Sense","q":"A man walks 5 km north, then 5 km east, then 5 km south. How far is he from the start and in which direction?","o":["10 km east","5 km east","5 km north","15 km"],"a":1,"e":"North 5 and south 5 cancel; only the 5 km east remains \u2192 <b>5 km east</b>.","d":"Easy"},{"t":"Logical Reasoning","s":"Direction Sense","q":"A man walks 8 km north, then turns west and walks 6 km. How far is he from the start?","o":["2 km","12 km","10 km","14 km"],"a":2,"e":"\u221a(8\u00b2+6\u00b2) = \u221a100 = <b>10 km</b> (6-8-10 triple).","d":"Easy"},{"t":"Logical Reasoning","s":"Direction Sense","q":"A man walks 12 m north, then 5 m east. Find his distance from the starting point.","o":["15 m","13 m","17 m","7 m"],"a":1,"e":"\u221a(12\u00b2+5\u00b2) = \u221a169 = <b>13 m</b> (5-12-13 triple).","d":"Easy"},{"t":"Logical Reasoning","s":"Direction Sense","q":"A man walks 10 m south, turns left and walks 15 m, then turns left again and walks 10 m. Which direction is he now facing?","o":["East","South","West","North"],"a":3,"e":"Facing south, a left turn faces east; a second left turn faces <b>north</b>.","d":"Medium"},{"t":"Logical Reasoning","s":"Direction Sense","q":"A man walks 20 m north, turns right and walks 30 m, turns right and walks 20 m. How far is he from the start?","o":["50 m","30 m","10 m","70 m"],"a":1,"e":"North 20 and south 20 cancel; 30 m east remains \u2192 <b>30 m</b>.","d":"Medium"},{"t":"Logical Reasoning","s":"Direction Sense","q":"Facing north, a man turns 90\u00b0 clockwise, then 180\u00b0 anticlockwise. Which direction is he facing?","o":["East","West","North","South"],"a":1,"e":"North \u2192 90\u00b0 clockwise = east \u2192 180\u00b0 anticlockwise = <b>west</b>.","d":"Medium"},{"t":"Logical Reasoning","s":"Direction Sense","q":"A man walks 4 km towards the south, turns left and walks 3 km. How far is he from the start?","o":["5 km","7 km","6 km","1 km"],"a":0,"e":"South 4 then east 3 \u2192 \u221a(4\u00b2+3\u00b2) = <b>5 km</b>.","d":"Easy"},{"t":"Logical Reasoning","s":"Direction Sense","q":"If south-east becomes north, and north-east becomes west, what does west become?","o":["South","South-east","East","North-west"],"a":1,"e":"Every direction rotates 135\u00b0 anticlockwise. Applying the same rotation to west gives <b>south-east</b>.","d":"Hard"},{"t":"Logical Reasoning","s":"Direction Sense","q":"A man starts facing east, turns right, then right again, then left. Which direction is he facing?","o":["East","South","North","West"],"a":1,"e":"Track one turn at a time. Facing east, a right turn faces south. A second right turn faces west. From west, a left turn faces <b>south</b>.","d":"Hard"},{"t":"Logical Reasoning","s":"Syllogisms","q":"Statements: All cats are animals. All animals have tails.\nConclusion: All cats have tails.","o":["Cannot be determined","Partially follows","Follows","Does not follow"],"a":2,"e":"A valid chain: cats \u2282 animals \u2282 tailed things, so all cats have tails. <b>Follows</b>.","d":"Easy"},{"t":"Logical Reasoning","s":"Syllogisms","q":"Statements: All roses are flowers. Some flowers fade quickly.\nConclusion: Some roses fade quickly.","o":["Both follow","Cannot say","Does not follow","Follows"],"a":2,"e":"'Some flowers' need not include any rose \u2014 the fading flowers could all lie outside the roses. <b>Does not follow</b>.","d":"Medium"},{"t":"Logical Reasoning","s":"Syllogisms","q":"Statements: Some pens are books. All books are red.\nConclusion: Some pens are red.","o":["Does not follow","Follows","Only sometimes","Cannot be determined"],"a":1,"e":"The pens that are books must be red, so at least some pens are red. <b>Follows</b>.","d":"Medium"},{"t":"Logical Reasoning","s":"Syllogisms","q":"Statements: No cat is a dog. All dogs are animals.\nConclusion: Some animals are not cats.","o":["Invalid","Cannot be determined","Does not follow","Follows"],"a":3,"e":"Dogs are animals and no dog is a cat, so those dogs are animals that are not cats. <b>Follows</b>.","d":"Medium"},{"t":"Logical Reasoning","s":"Syllogisms","q":"Statement: All A are B.\nConclusion: All B are A.","o":["Sometimes true","Follows","Does not follow","Always true"],"a":2,"e":"'All A are B' does not reverse. B may contain much more than A. <b>Does not follow</b>.","d":"Easy"},{"t":"Logical Reasoning","s":"Syllogisms","q":"Statement: Some A are B.\nConclusion: Some B are A.","o":["Follows","Does not follow","Cannot be determined","Invalid"],"a":0,"e":"'Some' converts validly: if part of A overlaps B, that same overlap means part of B is A. <b>Follows</b>.","d":"Easy"},{"t":"Logical Reasoning","s":"Syllogisms","q":"Statement: No A is B.\nConclusion: No B is A.","o":["Does not follow","Only if A \u2282 B","Follows","Cannot be determined"],"a":2,"e":"A universal negative converts validly \u2014 the two sets are disjoint either way. <b>Follows</b>.","d":"Easy"},{"t":"Logical Reasoning","s":"Syllogisms","q":"Statements: All students are hardworking. Some hardworking people are rich.\nConclusion: Some students are rich.","o":["Definitely true","Follows","Cannot say","Does not follow"],"a":3,"e":"The rich hardworking people need not be students. <b>Does not follow</b>.","d":"Medium"},{"t":"Logical Reasoning","s":"Syllogisms","q":"Statements: All squares are rectangles. All rectangles are quadrilaterals.\nConclusion: All squares are quadrilaterals.","o":["Cannot be determined","Follows","Only some","Does not follow"],"a":1,"e":"A valid transitive chain. <b>Follows</b>.","d":"Easy"},{"t":"Logical Reasoning","s":"Syllogisms","q":"Statements: Some books are pens. No pen is a pencil.\nConclusion: Some books are not pencils.","o":["Does not follow","Follows","Cannot be determined","Invalid"],"a":1,"e":"The books that are pens cannot be pencils, so some books are definitely not pencils. <b>Follows</b>.","d":"Hard"},{"t":"Logical Reasoning","s":"Odd One Out","q":"Find the odd one out: 3, 5, 7, 9, 11","o":["9","3","7","11"],"a":0,"e":"All are prime except <b>9</b> (= 3 \u00d7 3).","d":"Easy"},{"t":"Logical Reasoning","s":"Odd One Out","q":"Find the odd one out: 8, 27, 64, 100, 125","o":["8","125","64","100"],"a":3,"e":"All are perfect cubes except <b>100</b>, which is a perfect square.","d":"Easy"},{"t":"Logical Reasoning","s":"Odd One Out","q":"Find the odd one out: 16, 25, 36, 48, 64","o":["16","48","36","64"],"a":1,"e":"All are perfect squares except <b>48</b>.","d":"Easy"},{"t":"Logical Reasoning","s":"Odd One Out","q":"Find the odd one out: 2, 3, 5, 7, 9, 11","o":["5","3","9","7"],"a":2,"e":"All are prime except <b>9</b>.","d":"Easy"},{"t":"Logical Reasoning","s":"Odd One Out","q":"Find the odd one out: 12, 24, 36, 50, 60","o":["60","12","50","36"],"a":2,"e":"All are divisible by 12 except <b>50</b>.","d":"Easy"},{"t":"Logical Reasoning","s":"Odd One Out","q":"Find the odd one out: January, March, May, June, July","o":["March","June","January","May"],"a":1,"e":"All have 31 days except <b>June</b>, which has 30.","d":"Medium"},{"t":"Logical Reasoning","s":"Odd One Out","q":"Find the odd one out: Square, Rectangle, Triangle, Rhombus","o":["Rhombus","Rectangle","Triangle","Square"],"a":2,"e":"All are quadrilaterals (4 sides) except <b>Triangle</b>.","d":"Easy"},{"t":"Logical Reasoning","s":"Odd One Out","q":"Find the odd one out: 121, 144, 169, 180, 196","o":["144","121","196","180"],"a":3,"e":"All are perfect squares (11\u00b2, 12\u00b2, 13\u00b2, 14\u00b2) except <b>180</b>.","d":"Easy"},{"t":"Verbal Ability","s":"Error Spotting","q":"Find the error: 'Each of the students have submitted their assignment.'","o":["'have' should be 'has'","No error","'students' should be 'student'","'Each' should be 'Every'"],"a":0,"e":"<b>'Each' is singular</b>, so it takes 'has', not 'have'.","d":"Easy"},{"t":"Verbal Ability","s":"Error Spotting","q":"Find the error: 'The list of items are on the desk.'","o":["'list' should be 'lists'","No error","'are' should be 'is'","'items' should be 'item'"],"a":2,"e":"The subject is <b>'list'</b> (singular), not 'items'. A prepositional phrase never changes the subject.","d":"Easy"},{"t":"Verbal Ability","s":"Error Spotting","q":"Find the error: 'He is one of the best player in the team.'","o":["'best' should be 'better'","'is' should be 'was'","No error","'player' should be 'players'"],"a":3,"e":"After 'one of the', the noun must be <b>plural</b>: 'one of the best players'.","d":"Medium"},{"t":"Verbal Ability","s":"Error Spotting","q":"Find the error: 'I have been working here since five years.'","o":["'working' should be 'worked'","'since' should be 'for'","No error","'have' should be 'has'"],"a":1,"e":"<b>'Since'</b> takes a point in time (since 2019); <b>'for'</b> takes a duration (for five years).","d":"Easy"},{"t":"Verbal Ability","s":"Error Spotting","q":"Find the error: 'Neither of the two boys were present.'","o":["'boys' should be 'boy'","No error","'were' should be 'was'","'Neither' should be 'None'"],"a":2,"e":"<b>'Neither' is singular</b> \u2192 'was'.","d":"Medium"},{"t":"Verbal Ability","s":"Error Spotting","q":"Find the error: 'He don't know the answer.'","o":["'He' should be 'Him'","'don't' should be 'doesn't'","No error","'know' should be 'knows'"],"a":1,"e":"Third person singular takes <b>'doesn't'</b>.","d":"Easy"},{"t":"Verbal Ability","s":"Error Spotting","q":"Find the error: 'The committee have decided to postpone the meeting.'","o":["'have' should be 'has'","No error","'committee' should be 'committees'","'decided' should be 'decide'"],"a":0,"e":"A committee acting as a single body takes a <b>singular</b> verb.","d":"Medium"},{"t":"Verbal Ability","s":"Error Spotting","q":"Find the error: 'Walking down the road, the trees looked beautiful.'","o":["'looked' should be 'look'","No error","The modifier is misplaced \u2014 the trees were not walking","'Walking' should be 'Walked'"],"a":2,"e":"A <b>dangling modifier</b>: the opening phrase must describe the subject. Correct: 'Walking down the road, I thought the trees looked beautiful.'","d":"Medium"},{"t":"Verbal Ability","s":"Error Spotting","q":"Find the error: 'She likes reading, to swim, and cycling.'","o":["'to swim' should be 'swimming'","'reading' should be 'to read'","'cycling' should be 'to cycle'","No error"],"a":0,"e":"<b>Parallelism</b>: all items in a list must share the same grammatical form.","d":"Medium"},{"t":"Verbal Ability","s":"Error Spotting","q":"Find the error: 'The teacher gave the book to John and I.'","o":["No error","'I' should be 'me'","'the book' should be 'a book'","'gave' should be 'has given'"],"a":1,"e":"After a preposition you need the <b>object</b> pronoun: 'to John and me'.","d":"Medium"},{"t":"Verbal Ability","s":"Prepositions","q":"Fill in the blank: He is capable ___ doing it.","o":["in","to","for","of"],"a":3,"e":"The fixed pairing is <b>capable of</b>.","d":"Easy"},{"t":"Verbal Ability","s":"Prepositions","q":"Fill in the blank: She is senior ___ me in the organisation.","o":["than","from","of","to"],"a":3,"e":"Latin comparatives (senior, junior, superior, inferior, prior) take <b>to</b>, never 'than'.","d":"Medium"},{"t":"Verbal Ability","s":"Prepositions","q":"Fill in the blank: I prefer tea ___ coffee.","o":["over","to","from","than"],"a":1,"e":"The correct construction is <b>prefer X to Y</b>.","d":"Medium"},{"t":"Verbal Ability","s":"Prepositions","q":"Fill in the blank: She has been ill ___ Monday.","o":["on","from","for","since"],"a":3,"e":"A point in time takes <b>since</b>; a duration takes 'for'.","d":"Easy"},{"t":"Verbal Ability","s":"Prepositions","q":"Fill in the blank: This book is different ___ that one.","o":["than","with","to","from"],"a":3,"e":"Standard usage is <b>different from</b>.","d":"Easy"},{"t":"Verbal Ability","s":"Prepositions","q":"Fill in the blank: The committee consists ___ ten members.","o":["from","with","of","in"],"a":2,"e":"<b>Consists of</b> is the fixed form.","d":"Easy"},{"t":"Verbal Ability","s":"Prepositions","q":"Fill in the blank: He was accompanied ___ his brother.","o":["from","with","along","by"],"a":3,"e":"A person accompanying takes <b>by</b>.","d":"Medium"},{"t":"Verbal Ability","s":"Prepositions","q":"Fill in the blank: She is married ___ a doctor.","o":["by","with","for","to"],"a":3,"e":"The correct form is <b>married to</b>.","d":"Easy"},{"t":"Verbal Ability","s":"Prepositions","q":"Fill in the blank: He has been absent ___ the meeting.","o":["in","from","of","at"],"a":1,"e":"<b>Absent from</b> is the fixed pairing.","d":"Easy"},{"t":"Verbal Ability","s":"Prepositions","q":"Fill in the blank: They congratulated him ___ his success.","o":["on","with","for","about"],"a":0,"e":"<b>Congratulate someone on</b> something.","d":"Medium"},{"t":"Verbal Ability","s":"Synonyms","q":"Choose the word closest in meaning to <b>ABUNDANT</b>:","o":["Plentiful","Narrow","Hidden","Scarce"],"a":0,"e":"Abundant means existing in large quantity \u2192 <b>plentiful</b>.","d":"Medium"},{"t":"Verbal Ability","s":"Synonyms","q":"Choose the word closest in meaning to <b>METICULOUS</b>:","o":["Rapid","Precise","Hostile","Careless"],"a":1,"e":"Meticulous means showing great attention to detail \u2192 <b>precise</b>.","d":"Medium"},{"t":"Verbal Ability","s":"Synonyms","q":"Choose the word closest in meaning to <b>ALLEVIATE</b>:","o":["Ignore","Worsen","Relieve","Delay"],"a":2,"e":"To alleviate is to make less severe \u2192 <b>relieve</b>.","d":"Medium"},{"t":"Verbal Ability","s":"Synonyms","q":"Choose the word closest in meaning to <b>CANDID</b>:","o":["Shy","Frank","Deceptive","Rude"],"a":1,"e":"Candid means truthful and straightforward \u2192 <b>frank</b>.","d":"Medium"},{"t":"Verbal Ability","s":"Synonyms","q":"Choose the word closest in meaning to <b>PRUDENT</b>:","o":["Wealthy","Wise","Timid","Reckless"],"a":1,"e":"Prudent means showing care for the future \u2192 <b>wise</b>.","d":"Medium"},{"t":"Verbal Ability","s":"Synonyms","q":"Choose the word closest in meaning to <b>OBSOLETE</b>:","o":["Outdated","Rare","Essential","Modern"],"a":0,"e":"Obsolete means no longer in use \u2192 <b>outdated</b>.","d":"Medium"},{"t":"Verbal Ability","s":"Synonyms","q":"Choose the word closest in meaning to <b>TENACIOUS</b>:","o":["Flexible","Weak","Generous","Persistent"],"a":3,"e":"Tenacious means holding firmly \u2192 <b>persistent</b>.","d":"Medium"},{"t":"Verbal Ability","s":"Synonyms","q":"Choose the word closest in meaning to <b>LUCID</b>:","o":["Dark","Clear","Loud","Confusing"],"a":1,"e":"Lucid means easily understood \u2192 <b>clear</b>.","d":"Medium"},{"t":"Verbal Ability","s":"Synonyms","q":"Choose the word closest in meaning to <b>AMBIGUOUS</b>:","o":["Definite","Loud","Unclear","Simple"],"a":2,"e":"Ambiguous means open to more than one interpretation \u2192 <b>unclear</b>.","d":"Medium"},{"t":"Verbal Ability","s":"Synonyms","q":"Choose the word closest in meaning to <b>DILIGENT</b>:","o":["Clever","Hardworking","Lazy","Honest"],"a":1,"e":"Diligent means showing steady effort \u2192 <b>hardworking</b>.","d":"Medium"},{"t":"Verbal Ability","s":"Antonyms","q":"Choose the word most nearly OPPOSITE in meaning to <b>TRANSPARENT</b>:","o":["Visible","Fragile","Opaque","Clear"],"a":2,"e":"Transparent means see-through; its opposite is <b>opaque</b>.","d":"Medium"},{"t":"Verbal Ability","s":"Antonyms","q":"Choose the word most nearly OPPOSITE in meaning to <b>BENEVOLENT</b>:","o":["Malevolent","Generous","Kind","Gentle"],"a":0,"e":"Benevolent means well-meaning; its opposite is <b>malevolent</b>.","d":"Medium"},{"t":"Verbal Ability","s":"Antonyms","q":"Choose the word most nearly OPPOSITE in meaning to <b>SCARCE</b>:","o":["Abundant","Limited","Small","Rare"],"a":0,"e":"Scarce means in short supply; the opposite is <b>abundant</b>.","d":"Medium"},{"t":"Verbal Ability","s":"Antonyms","q":"Choose the word most nearly OPPOSITE in meaning to <b>FRUGAL</b>:","o":["Simple","Thrifty","Careful","Extravagant"],"a":3,"e":"Frugal means economical; the opposite is <b>extravagant</b>.","d":"Medium"},{"t":"Verbal Ability","s":"Antonyms","q":"Choose the word most nearly OPPOSITE in meaning to <b>HUMBLE</b>:","o":["Poor","Quiet","Modest","Arrogant"],"a":3,"e":"Humble means modest; the opposite is <b>arrogant</b>.","d":"Medium"},{"t":"Verbal Ability","s":"Antonyms","q":"Choose the word most nearly OPPOSITE in meaning to <b>VOLATILE</b>:","o":["Explosive","Stable","Changeable","Rapid"],"a":1,"e":"Volatile means liable to change rapidly; the opposite is <b>stable</b>.","d":"Medium"},{"t":"Verbal Ability","s":"Antonyms","q":"Choose the word most nearly OPPOSITE in meaning to <b>CONDEMN</b>:","o":["Praise","Punish","Blame","Accuse"],"a":0,"e":"To condemn is to express disapproval; the opposite is <b>praise</b>.","d":"Medium"},{"t":"Verbal Ability","s":"Antonyms","q":"Choose the word most nearly OPPOSITE in meaning to <b>OPTIMISTIC</b>:","o":["Hopeful","Cheerful","Confident","Pessimistic"],"a":3,"e":"The direct opposite of optimistic is <b>pessimistic</b>.","d":"Medium"},{"t":"Verbal Ability","s":"Para Jumbles","q":"Arrange into a coherent paragraph:<br>P. This led to a sharp rise in demand.<br>Q. The company launched a new product last year.<br>R. As a result, production was doubled.<br>S. It was priced significantly below competitors.","o":["S, Q, P, R","Q, P, S, R","Q, R, S, P","Q, S, P, R"],"a":3,"e":"Q opens (full noun, no pronoun). S's 'It' refers to the product. P's 'This' refers to the low pricing. R concludes with 'As a result'. \u2192 <b>Q, S, P, R</b>.","d":"Medium"},{"t":"Verbal Ability","s":"Para Jumbles","q":"Arrange into a coherent paragraph:<br>P. However, it was rejected by the committee.<br>Q. He submitted a detailed proposal.<br>R. He then revised it thoroughly.<br>S. The revised version was finally approved.","o":["Q, R, P, S","Q, R, S, P","Q, P, R, S","P, Q, R, S"],"a":2,"e":"Q introduces the proposal; P's 'However' marks the setback; R follows with the revision; S concludes with approval. \u2192 <b>Q, P, R, S</b>.","d":"Medium"},{"t":"Data Interpretation","s":"Table DI","q":"Study the table (sales in \u20b9 lakh) and answer:<table><tr><th>Year</th><th>Product A</th><th>Product B</th><th>Product C</th><th>Total</th></tr><tr><td>2019</td><td>120</td><td>80</td><td>100</td><td>300</td></tr><tr><td>2020</td><td>150</td><td>90</td><td>110</td><td>350</td></tr><tr><td>2021</td><td>180</td><td>120</td><td>100</td><td>400</td></tr><tr><td>2022</td><td>200</td><td>150</td><td>130</td><td>480</td></tr><tr><td>2023</td><td>240</td><td>160</td><td>150</td><td>550</td></tr></table><br><b>What are the total sales of Product A over all five years?</b>","o":["790","850","890","900"],"a":2,"e":"120 + 150 + 180 + 200 + 240 = <b>890</b> lakh.","d":"Medium"},{"t":"Data Interpretation","s":"Table DI","q":"Study the table (sales in \u20b9 lakh) and answer:<table><tr><th>Year</th><th>Product A</th><th>Product B</th><th>Product C</th><th>Total</th></tr><tr><td>2019</td><td>120</td><td>80</td><td>100</td><td>300</td></tr><tr><td>2020</td><td>150</td><td>90</td><td>110</td><td>350</td></tr><tr><td>2021</td><td>180</td><td>120</td><td>100</td><td>400</td></tr><tr><td>2022</td><td>200</td><td>150</td><td>130</td><td>480</td></tr><tr><td>2023</td><td>240</td><td>160</td><td>150</td><td>550</td></tr></table><br><b>What is the percentage increase in Product B sales from 2019 to 2023?</b>","o":["120%","100%","80%","50%"],"a":1,"e":"(160 \u2212 80)/80 \u00d7 100 = <b>100%</b>. Always divide by the OLD value.","d":"Medium"},{"t":"Data Interpretation","s":"Table DI","q":"Study the table (sales in \u20b9 lakh) and answer:<table><tr><th>Year</th><th>Product A</th><th>Product B</th><th>Product C</th><th>Total</th></tr><tr><td>2019</td><td>120</td><td>80</td><td>100</td><td>300</td></tr><tr><td>2020</td><td>150</td><td>90</td><td>110</td><td>350</td></tr><tr><td>2021</td><td>180</td><td>120</td><td>100</td><td>400</td></tr><tr><td>2022</td><td>200</td><td>150</td><td>130</td><td>480</td></tr><tr><td>2023</td><td>240</td><td>160</td><td>150</td><td>550</td></tr></table><br><b>In which year was Product C's share of total sales the highest?</b>","o":["2019","2020","2022","2023"],"a":0,"e":"2019: 100/300 = 33.3%; 2020: 31.4%; 2021: 25%; 2022: 27.1%; 2023: 27.3% \u2192 <b>2019</b>.","d":"Medium"},{"t":"Data Interpretation","s":"Table DI","q":"Study the table (sales in \u20b9 lakh) and answer:<table><tr><th>Year</th><th>Product A</th><th>Product B</th><th>Product C</th><th>Total</th></tr><tr><td>2019</td><td>120</td><td>80</td><td>100</td><td>300</td></tr><tr><td>2020</td><td>150</td><td>90</td><td>110</td><td>350</td></tr><tr><td>2021</td><td>180</td><td>120</td><td>100</td><td>400</td></tr><tr><td>2022</td><td>200</td><td>150</td><td>130</td><td>480</td></tr><tr><td>2023< rd most nearly OPPOSITE in meaning to <b>RIGID</b>:","o":["Firm","Flexible","Stiff","Hard"],"a":1,"e":"Rigid means inflexible; the opposite is flexible.","d":"Medium"},{"t":"Verbal Ability","s":"Antonyms","q":"Choose the word most nearly OPPOSITE in meaning to <b>ACCELERATE</b>:","o":["Speed","Rush","Decelerate","Hasten"],"a":2,"e":"To accelerate is to speed up; the opposite is to slow down.","d":"Medium"},{"t":"Verbal Ability","s":"Antonyms","q":"Choose the word most nearly OPPOSITE in meaning to <b>GENUINE</b>:","o":["Fake","True","Real","Authentic"],"a":0,"e":"Genuine means real; the opposite is fake.","d":"Medium"},{"t":"Verbal Ability","s":"Antonyms","q":"Choose the word most nearly OPPOSITE in meaning to <b>SUPERIOR</b>:","o":["Better","Higher","Greater","Inferior"],"a":3,"e":"Superior means higher in quality; the opposite is inferior.","d":"Medium"},{"t":"Verbal Ability","s":"Sentence Completion","q":"Fill in the blank: Despite his ___ efforts, the project failed to meet the deadline.","o":["strenuous","strenuose","strenuousness","strenuously"],"a":0,"e":"An adjective is needed before the noun 'efforts' &rarr; <b>strenuous</b>.","d":"Medium"},{"t":"Verbal Ability","s":"Sentence Completion","q":"Fill in the blank: The manager was praised ___ his prompt handling of the crisis.","o":["for","with","of","on"],"a":0,"e":"Praise someone <b>for</b> something.","d":"Medium"},{"t":"Verbal Ability","s":"Sentence Completion","q":"Fill in the blank: Hardly had he entered the room ___ the lights went out.","o":["then","when","that","than"],"a":1,"e":"The fixed pairing is 'Hardly &hellip; <b>when</b>' (and 'No sooner &hellip; than').","d":"Medium"},{"t":"Verbal Ability","s":"Sentence Completion","q":"Fill in the blank: If I ___ the answer, I would have told you.","o":["have known","would know","knew","had known"],"a":3,"e":"A third conditional needs the past perfect: 'If I <b>had known</b>&hellip; I would have told you.'","d":"Medium"},{"t":"Verbal Ability","s":"Sentence Completion","q":"Fill in the blank: The number of applicants ___ increasing every year.","o":["have been","is","are","were"],"a":1,"e":"'The number of' takes a <b>singular</b> verb. ('A number of' takes a plural.)","d":"Medium"},{"t":"Verbal Ability","s":"Sentence Completion","q":"Fill in the blank: She is not only intelligent ___ hardworking.","o":["as well","and also","but","but also"],"a":3,"e":"The correlative pair is 'not only &hellip; <b>but also</b>'.","d":"Medium"},{"t":"Verbal Ability","s":"Sentence Completion","q":"Fill in the blank: He has been living here ___ 2015.","o":["since","by","for","from"],"a":0,"e":"A point in time takes <b>since</b>.","d":"Medium"},{"t":"Verbal Ability","s":"Sentence Completion","q":"Fill in the blank: Neither the students nor the teacher ___ present.","o":["was","have been","are","were"],"a":0,"e":"With neither/nor the verb agrees with the <b>nearer</b> subject, 'teacher' (singular).","d":"Medium"},{"t":"Verbal Ability","s":"Sentence Completion","q":"Fill in the blank: The committee ___ divided in its opinion.","o":["are","were","is","have"],"a":2,"e":"Acting as a single body, 'committee' takes a <b>singular</b> verb.","d":"Medium"},{"t":"Verbal Ability","s":"Sentence Completion","q":"Fill in the blank: He objected ___ being treated like a child.","o":["to","on","against","for"],"a":0,"e":"The fixed pairing is object <b>to</b>.","d":"Medium"},{"t":"Verbal Ability","s":"Reading Comprehension","q":"Read the passage and answer:<br><br><i>Remote work has reshaped corporate culture in ways few predicted. Companies that once measured productivity by hours spent at a desk now assess output instead. This shift has benefited employees who work best outside rigid schedules, but it has also blurred the boundary between professional and personal life. Some firms report higher output alongside rising reports of burnout &mdash; a paradox that suggests flexibility alone does not guarantee wellbeing.</i><br><br><b>What is the main idea of the passage?</b>","o":["Remote work has entirely failed as a model","Employees prefer working from an office","Companies should abandon flexible schedules","Remote work has changed how productivity is measured, with mixed effects"],"a":3,"e":"The passage describes a shift in measurement and then both a benefit and a cost. Options that pick only one side are too narrow or contradict the text.","d":"Medium"},{"t":"Verbal Ability","s":"Reading Comprehension","q":"Read the passage and answer:<br><br><i>Remote work has reshaped corporate culture in ways few predicted. Companies that once measured productivity by hours spent at a desk now assess output instead. This shift has benefited employees who work best outside rigid schedules, but it has also blurred the boundary between professional and personal life. Some firms report higher output alongside rising reports of burnout &mdash; a paradox that suggests flexibility alone does not guarantee wellbeing.</i><br><br><b>According to the passage, what paradox do some firms report?</b>","o":["More hours and less output","Higher pay and lower morale","Lower output and less burnout","Higher output together with more burnout"],"a":3,"e":"Stated directly: 'higher output alongside rising reports of burnout'.","d":"Medium"},{"t":"Verbal Ability","s":"Reading Comprehension","q":"Read the passage and answer:<br><br><i>Remote work has reshaped corporate culture in ways few predicted. Companies that once measured productivity by hours spent at a desk now assess output instead. This shift has benefited employees who work best outside rigid schedules, but it has also blurred the boundary between professional and personal life. Some firms report higher output alongside rising reports of burnout &mdash; a paradox that suggests flexibility alone does not guarantee wellbeing.</i><br><br><b>What can be inferred about flexibility from the passage?</b>","o":["It is not sufficient on its own to ensure wellbeing","It always improves wellbeing","It is disliked by most employees","It has no effect on output"],"a":0,"e":"The last line says flexibility alone does not guarantee wellbeing &mdash; one small step beyond the text, which is what an inference question wants.","d":"Medium"},{"t":"Verbal Ability","s":"Reading Comprehension","q":"Read the passage and answer:<br><br><i>Remote work has reshaped corporate culture in ways few predicted. Companies that once measured productivity by hours spent at a desk now assess output instead. This shift has benefited employees who work best outside rigid schedules, but it has also blurred the boundary between professional and personal life. Some firms report higher output alongside rising reports of burnout &mdash; a paradox that suggests flexibility alone does not guarantee wellbeing.</i><br><br><b>How did companies previously measure productivity?</b>","o":["By hours spent at a desk","By project count","By output","By employee surveys"],"a":0,"e":"Stated directly in the second sentence.","d":"Medium"},{"t":"Pseudocode","s":"Output Prediction","q":"What does the following pseudocode print?<pre class='pc'>Integer a, b\nSet a = 5, b = 3\na = a + b\nb = a - b\na = a - b\nPrint a, b</pre>","o":["3 5","8 5","3 8","5 3"],"a":0,"e":"Classic swap without a temp variable. a=8, then b=8&minus;3=5, then a=8&minus;5=3. Output <b>3 5</b> &mdash; the values are exchanged.","d":"Medium"},{"t":"Pseudocode","s":"Output Prediction","q":"What does the following pseudocode print?<pre class='pc'>Integer i, sum\nSet sum = 0\nfor(i = 1; i &lt;= 5; i++)\n    sum = sum + i\nPrint sum</pre>","o":["10","14","20","15"],"a":3,"e":"Adds 1+2+3+4+5 = <b>15</b>.","d":"Easy"},{"t":"Pseudocode","s":"Output Prediction","q":"What does the following pseudocode print?<pre class='pc'>Integer i, p\nSet p = 1\nfor(i = 1; i &lt;= 4; i++)\n    p = p * i\nPrint p</pre>","o":["12","10","64","24"],"a":3,"e":"Computes 4! = 1&times;2&times;3&times;4 = <b>24</b>.","d":"Easy"},{"t":"Pseudocode","s":"Output Prediction","q":"What does the following pseudocode print?<pre class='pc'>Integer n = 10, count = 0\nwhile(n &gt; 0)\n    n = n / 2      // integer division\n    count = count + 1\nPrint count</pre>","o":["3","10","4","5"],"a":2,"e":"10&rarr;5 (1), 5&rarr;2 (2), 2&rarr;1 (3), 1&rarr;0 (4). Loop ends. count = <b>4</b>. This is why halving is log&#8322;n.","d":"Medium"},{"t":"Pseudocode","s":"Output Prediction","q":"What does the following pseudocode print?<pre class='pc'>Integer arr[] = {2, 4, 6, 8, 10}\nInteger i, s = 0\nfor(i = 0; i &lt; 5; i = i + 2)\n    s = s + arr[i]\nPrint s</pre>","o":["12","18","30","20"],"a":1,"e":"i takes 0, 2, 4 &rarr; arr[0]=2, arr[2]=6, arr[4]=10 &rarr; <b>18</b>. The step of 2 skips alternate elements.","d":"Medium"},{"t":"Pseudocode","s":"Output Prediction","q":"What does the following pseudocode print?<pre class='pc'>Integer i, j, c = 0\nfor(i = 1; i &lt;= 3; i++)\n    for(j = 1; j &lt;= 3; j++)\n        if(i != j)\n            c = c + 1\nPrint c</pre>","o":["4","9","6","3"],"a":2,"e":"9 total pairs, minus the 3 where i equals j &rarr; <b>6</b>.","d":"Medium"},{"t":"Pseudocode","s":"Output Prediction","q":"What does the following pseudocode print?<pre class='pc'>Function f(n)\n    if(n &lt;= 1) return 1\n    return n * f(n - 1)\nPrint f(5)</pre>","o":["120","25","5","24"],"a":0,"e":"Recursive factorial: 5&times;4&times;3&times;2&times;1 = <b>120</b>.","d":"Medium"},{"t":"Pseudocode","s":"Output Prediction","q":"What does the following pseudocode print?<pre class='pc'>Function f(n)\n    if(n &lt;= 1) return n\n    return f(n-1) + f(n-2)\nPrint f(6)</pre>","o":["6","5","8","13"],"a":2,"e":"Fibonacci with f(0)=0, f(1)=1: 0,1,1,2,3,5,<b>8</b>. So f(6) = <b>8</b>.","d":"Hard"},{"t":"Pseudocode","s":"Output Prediction","q":"What does the following pseudocode print?<pre class='pc'>Integer x = 7\nif(x &gt; 5 AND x &lt; 10)\n    Print \"A\"\nelse if(x &gt; 3)\n    Print \"B\"\nelse\n    Print \"C\" </pre>","o":["AB","A","C","B"],"a":1,"e":"7 &gt; 5 and 7 &lt; 10, so the first branch runs and nothing else is checked &rarr; <b>A</b>.","d":"Easy"},{"t":"Pseudocode","s":"Output Prediction","q":"What does the following pseudocode print?<pre class='pc'>Integer i, c = 0\nfor(i = 1; i &lt;= 20; i++)\n    if(i % 3 == 0)\n        c = c + 1\nPrint c</pre>","o":["7","3","5","6"],"a":3,"e":"Multiples of 3 up to 20: 3, 6, 9, 12, 15, 18 &rarr; <b>6</b>.","d":"Easy"},{"t":"Pseudocode","s":"Output Prediction","q":"What does the following pseudocode print?<pre class='pc'>Integer n = 1234, s = 0\nwhile(n &gt; 0)\n    s = s + n % 10\n    n = n / 10\nPrint s</pre>","o":["4","1234","24","10"],"a":3,"e":"Extracts digits with %10 and strips them with /10: 4+3+2+1 = <b>10</b> (digit sum).","d":"Medium"},{"t":"Pseudocode","s":"Output Prediction","q":"What does the following pseudocode print?<pre class='pc'>Integer n = 123, r = 0\nwhile(n &gt; 0)\n    r = r * 10 + n % 10\n    n = n / 10\nPrint r</pre>","o":["123","132","6","321"],"a":3,"e":"Builds the number backwards: r = 3, then 32, then <b>321</b>. This is digit reversal.","d":"Medium"},{"t":"Pseudocode","s":"Output Prediction","q":"What does the following pseudocode print?<pre class='pc'>Integer i = 0\nwhile(i &lt; 10)\n    i = i + 3\nPrint i</pre>","o":["9","10","12","15"],"a":2,"e":"i takes 0, 3, 6, 9, then 12. At 12 the condition fails, but i was already updated &rarr; <b>12</b>.","d":"Medium"},{"t":"Pseudocode","s":"Output Prediction","q":"What does the following pseudocode print?<pre class='pc'>Integer arr[] = {3, 7, 2, 9, 4}\nInteger max = arr[0], i\nfor(i = 1; i &lt; 5; i++)\n    if(arr[i] &gt; max)\n        max = arr[i]\nPrint max</pre>","o":["3","4","9","7"],"a":2,"e":"Standard maximum scan &rarr; <b>9</b>.","d":"Easy"},{"t":"Pseudocode","s":"Output Prediction","q":"What does the following pseudocode print?<pre class='pc'>Integer a = 10, b = 3\nPrint a / b      // integer division\nPrint a % b</pre>","o":["1 and 3","3 and 1","3 and 3","3.33 and 1"],"a":1,"e":"Integer division truncates: 10/3 = <b>3</b>. The remainder 10 % 3 = <b>1</b>.","d":"Easy"},{"t":"Pseudocode","s":"Output Prediction","q":"What does the following pseudocode print?<pre class='pc'>Integer i = 5, s = 0\nwhile(i &gt; 0)\n    s = s + i\n    i = i - 2\nPrint s</pre>","o":["8","6","9","15"],"a":2,"e":"i takes 5, 3, 1 (then &minus;1 stops it). 5+3+1 = <b>9</b>.","d":"Medium"},{"t":"Pseudocode","s":"Output Prediction","q":"What does the following pseudocode print?<pre class='pc'>Function gcd(a, b)\n    if(b == 0) return a\n    return gcd(b, a % b)\nPrint gcd(48, 18)</pre>","o":["12","18","3","6"],"a":3,"e":"Euclid: gcd(48,18) &rarr; gcd(18,12) &rarr; gcd(12,6) &rarr; gcd(6,0) = <b>6</b>.","d":"Medium"},{"t":"Pseudocode","s":"Output Prediction","q":"What does the following pseudocode print?<pre class='pc'>Integer i, j, c = 0\nfor(i = 1; i &lt;= 4; i++)\n    for(j = i; j &lt;= 4; j++)\n        c = c + 1\nPrint c</pre>","o":["12","16","8","10"],"a":3,"e":"Inner loop runs 4, 3, 2, 1 times &rarr; <b>10</b>. Note j starts at i, not 1.","d":"Hard"},{"t":"Pseudocode","s":"Output Prediction","q":"What does the following pseudocode print?<pre class='pc'>Integer arr[] = {5, 2, 8}\nInteger temp\ntemp = arr[0]\narr[0] = arr[2]\narr[2] = temp\nPrint arr[0], arr[1], arr[2]</pre>","o":["5 2 8","2 5 8","8 5 2","8 2 5"],"a":3,"e":"Swaps the first and last elements &rarr; <b>8 2 5</b>.","d":"Easy"},{"t":"Pseudocode","s":"Output Prediction","q":"What does the following pseudocode print?<pre class='pc'>Integer i, s = 0\nfor(i = 1; i &lt;= 10; i++)\n    if(i == 5) break\n    s = s + i\nPrint s</pre>","o":["10","15","10 and stops","5"],"a":0,"e":"Adds 1+2+3+4 = <b>10</b>, then break exits before adding 5.","d":"Medium"},{"t":"Pseudocode","s":"Output Prediction","q":"What does the following pseudocode print?<pre class='pc'>Integer i, c = 0\nfor(i = 1; i &lt;= 10; i++)\n    if(i % 2 == 0) continue\n    c = c + 1\nPrint c</pre>","o":["10","4","6","5"],"a":3,"e":"continue skips the even values, so only the 5 odd numbers (1,3,5,7,9) increment c &rarr; <b>5</b>.","d":"Medium"},{"t":"Pseudocode","s":"Output Prediction","q":"What does the following pseudocode print?<pre class='pc'>Integer a[2][2] = {{1, 2}, {3, 4}}\nPrint a[1][0]</pre>","o":["2","4","1","3"],"a":3,"e":"Row 1 (the second row) is {3, 4}; column 0 of it is <b>3</b>. Indices start at 0.","d":"Easy"},{"t":"Pseudocode","s":"Output Prediction","q":"What does the following pseudocode print?<pre class='pc'>Integer n = 5, s = 0, i\nfor(i = 1; i &lt;= n; i++)\n    s = s + i * i\nPrint s</pre>","o":["55","15","25","30"],"a":0,"e":"1+4+9+16+25 = <b>55</b> &mdash; the sum of squares, n(n+1)(2n+1)/6.","d":"Medium"},{"t":"Pseudocode","s":"Output Prediction","q":"What does the following pseudocode print?<pre class='pc'>Integer a = 1\nwhile(a &lt;= 100)\n    a = a * 2\nPrint a</pre>","o":["100","128","256","64"],"a":1,"e":"1,2,4,8,16,32,64 all pass the test; 64&times;2 = 128 fails it but a is already <b>128</b>.","d":"Medium"},{"t":"Pseudocode","s":"Output Prediction","q":"What does the following pseudocode print?<pre class='pc'>Integer i, s = 0\nfor(i = 1; i &lt;= 100; i++)\n    s = s + i\nPrint s</pre>","o":["5050","5000","4950","10100"],"a":0,"e":"n(n+1)/2 = 100&times;101/2 = <b>5050</b>.","d":"Easy"},{"t":"Pseudocode","s":"Output Prediction","q":"What does the following pseudocode print?<pre class='pc'>Integer x = 5\nFunction change(Integer y)\n    y = y * 2\nchange(x)\nPrint x</pre>","o":["10","25","5","0"],"a":2,"e":"Pass by value: change() modifies its own copy, so x is unchanged &rarr; <b>5</b>. A very common trap.","d":"Hard"},{"t":"Pseudocode","s":"Output Prediction","q":"What does the following pseudocode print?<pre class='pc'>Integer i, j\nfor(i = 1; i &lt;= 3; i++)\n    for(j = 1; j &lt;= 2; j++)\n        Print i * j\nHow many values are printed?</pre>","o":["3","2","6","5"],"a":2,"e":"The inner loop runs twice for each of 3 outer iterations &rarr; <b>6</b> values.","d":"Easy"},{"t":"Pseudocode","s":"Output Prediction","q":"What does the following pseudocode print?<pre class='pc'>Integer arr[] = {1, 2, 3, 4, 5}\nInteger i, s = 0\nfor(i = 0; i &lt; 5; i++)\n    if(arr[i] % 2 == 1)\n        s = s + arr[i]\nPrint s</pre>","o":["15","5","9","6"],"a":2,"e":"Odd elements are 1, 3, 5 &rarr; <b>9</b>.","d":"Easy"},{"t":"Pseudocode","s":"Time Complexity","q":"What is the time complexity of <b>a single loop from 1 to n</b>?","o":["O(n&sup2;)","O(n)","O(log n)","O(1)"],"a":1,"e":"One pass over n items is linear &rarr; <b>O(n)</b>.","d":"Medium"},{"t":"Pseudocode","s":"Time Complexity","q":"What is the time complexity of <b>two nested loops, each from 1 to n</b>?","o":["O(n log n)","O(n)","O(2n)","O(n&sup2;)"],"a":3,"e":"n iterations inside n iterations &rarr; <b>O(n&sup2;)</b>.","d":"Medium"},{"t":"Pseudocode","s":"Time Complexity","q":"What is the time complexity of <b>binary search on a sorted array of n elements</b>?","o":["O(1)","O(n&sup2;)","O(n)","O(log n)"],"a":3,"e":"The search space halves each step &rarr; <b>O(log n)</b>.","d":"Medium"},{"t":"Pseudocode","s":"Time Complexity","q":"What is the time complexity of <b>a loop that halves n each iteration</b>?","o":["O(n log n)","O(n)","O(1)","O(log n)"],"a":3,"e":"Halving reaches 1 in log&#8322;n steps &rarr; <b>O(log n)</b>.","d":"Medium"},{"t":"Pseudocode","s":"Time Complexity","q":"What is the time complexity of <b>accessing an element of an array by its index</b>?","o":["O(log n)","O(n)","O(n&sup2;)","O(1)"],"a":3,"e":"Direct indexing is constant time &rarr; <b>O(1)</b>.","d":"Medium"},{"t":"Pseudocode","s":"Time Complexity","q":"What is the time complexity of <b>merge sort on n elements</b>?","o":["O(n)","O(n&sup2;)","O(n log n)","O(log n)"],"a":2,"e":"log n levels of merging, each costing O(n) &rarr; <b>O(n log n)</b>.","d":"Medium"},{"t":"Pseudocode","s":"Time Complexity","q":"What is the time complexity of <b>bubble sort in the worst case</b>?","o":["O(n log n)","O(1)","O(n)","O(n&sup2;)"],"a":3,"e":"Nested comparison passes &rarr; <b>O(n&sup2;)</b>.","d":"Medium"},{"t":"Pseudocode","s":"Time Complexity","q":"What is the time complexity of <b>linear search in an unsorted array</b>?","o":["O(log n)","O(n)","O(1)","O(n&sup2;)"],"a":1,"e":"You may have to check every element &rarr; <b>O(n)</b>.","d":"Medium"},{"t":"Logical Reasoning","s":"Seating Arrangement","q":"Five people P, Q, R, S and T live on five floors of a building (floor 1 is the bottom, floor 5 the top). P lives above Q. R lives on floor 3. S lives below Q. T lives on the top floor. Who lives on floor 2?","o":["S","Q","R","P"],"a":1,"e":"T = 5 and R = 3, leaving floors 1, 2 and 4 for P, Q and S with S &lt; Q &lt; P. So S = 1, Q = 2, P = 4. Floor 2 is <b>Q</b>.","d":"Hard"},{"t":"Logical Reasoning","s":"Seating Arrangement","q":"In a class, A ranks 7th from the top and 18th from the bottom. How many students are in the class?","o":["25","23","24","26"],"a":2,"e":"Total = (rank from top) + (rank from bottom) &minus; 1 = 7 + 18 &minus; 1 = <b>24</b>. The &minus;1 avoids counting A twice.","d":"Medium"},{"t":"Logical Reasoning","s":"Seating Arrangement","q":"B is 12th from the left and 20th from the right in a row. How many people are in the row?","o":["30","33","31","32"],"a":2,"e":"Total = 12 + 20 &minus; 1 = <b>31</b>.","d":"Medium"},{"t":"Logical Reasoning","s":"Seating Arrangement","q":"Five friends compared heights. A is taller than B but shorter than C. D is taller than C. E is the shortest. Who is the tallest?","o":["A","B","D","C"],"a":2,"e":"Order: E &lt; B &lt; A &lt; C &lt; D. The tallest is <b>D</b>.","d":"Medium"},{"t":"Logical Reasoning","s":"Seating Arrangement","q":"Six people A, B, C, D, E, F sit in a row facing north. C is at the extreme left. D is at the extreme right. A is immediately to the right of C. B is immediately to the left of D. Who are seated in the middle two positions?","o":["A and B","E and F","A and E","C and D"],"a":1,"e":"C(1), A(2), B(5), D(6) are fixed, leaving positions 3 and 4 for <b>E and F</b>.","d":"Hard"},{"t":"Logical Reasoning","s":"Seating Arrangement","q":"Four people W, X, Y, Z have different salaries. W earns more than X. Y earns less than Z but more than W. Who earns the most?","o":["X","W","Z","Y"],"a":2,"e":"X &lt; W &lt; Y &lt; Z. The highest earner is <b>Z</b>.","d":"Medium"},{"t":"Logical Reasoning","s":"Seating Arrangement","q":"In a row of 30 children, M is 8th from the left and N is 12th from the right. How many children sit between M and N?","o":["9","10","11","12"],"a":2,"e":"N from the left = 30 &minus; 12 + 1 = 19. Between 8 and 19: 19 &minus; 8 &minus; 1 = <b>11</b>.","d":"Hard"},{"t":"Logical Reasoning","s":"Seating Arrangement","q":"Seven people sit in a circle facing the centre. A is third to the left of B. C sits immediately to the right of A. Where does C sit relative to B?","o":["Immediately left of B","Fourth to the left of B","Second to the right of B","Second to the left of B"],"a":3,"e":"Facing the centre, a person's LEFT is clockwise. Number the seats clockwise from B: B(0), _(1), _(2), A(3). C is immediately to A's right, which is one step anticlockwise &rarr; seat 2. That is <b>second to the left of B</b>.","d":"Hard"},{"t":"Logical Reasoning","s":"Seating Arrangement","q":"Five boxes are stacked. Box P is immediately above Q. R is at the bottom. S is immediately below T, and T is at the top. Which box is in the middle?","o":["Q","T","P","S"],"a":2,"e":"Top to bottom: T, S, P, Q, R. The middle (3rd) box is <b>P</b>.","d":"Hard"},{"t":"Logical Reasoning","s":"Seating Arrangement","q":"A is 3 places ahead of B in a queue. C is 2 places behind B. If A is 5th from the front, what is C's position from the front?","o":["11th","8th","9th","10th"],"a":3,"e":"A = 5, so B = 5 + 3 = 8, and C = 8 + 2 = <b>10th</b>.","d":"Medium"},{"t":"Logical Reasoning","s":"Seating Arrangement","q":"Of five people, T is heavier than U but lighter than V. W is heavier than V. X is the lightest. Who is the third heaviest?","o":["W","V","T","U"],"a":2,"e":"Order heaviest to lightest: W, V, T, U, X. Third is <b>T</b>.","d":"Medium"},{"t":"Logical Reasoning","s":"Seating Arrangement","q":"In a queue of 40 people, if P is 15th from the front, how many people are behind P?","o":["26","25","15","24"],"a":1,"e":"People behind = 40 &minus; 15 = <b>25</b>. (Here there is no +1 &mdash; P is not behind themselves.)","d":"Medium"}];
const FORMULAS = {"Base layer":{"f":[["Fraction to %","1/2=50 &middot; 1/3=33.33 &middot; 1/4=25 &middot; 1/5=20 &middot; 1/6=16.67 &middot; 1/7=14.28 &middot; 1/8=12.5"],["","1/9=11.11 &middot; 1/10=10 &middot; 1/11=9.09 &middot; 1/12=8.33 &middot; 1/16=6.25 &middot; 1/20=5"],["","2/3=66.67 &middot; 3/4=75 &middot; 3/5=60 &middot; 5/8=62.5 &middot; 7/8=87.5 &middot; 3/8=37.5"],["Squares 1-30","1 4 9 16 25 36 49 64 81 100 121 144 169 196 225 256 289 324 361 400 441 484 529 576 625 676 729 784 841 900"],["Cubes 1-15","1 8 27 64 125 216 343 512 729 1000 1331 1728 2197 2744 3375"],["Divisibility","3 &rarr; digit sum &middot; 4 &rarr; last two digits &middot; 8 &rarr; last three &middot; 9 &rarr; digit sum &middot; 11 &rarr; alternating sum"],["Near 100","97 &times; 96 &rarr; (97&minus;4)=93, (3&times;4)=12 &rarr; 9312"],["Ends in 5","75&sup2; &rarr; 7&times;8=56, append 25 &rarr; 5625"]],"note":["This is the highest-return two hours in the whole subject. 37.5% of 96 is not a calculation &mdash; it is 96 &times; 3/8 = 36."]},"Percentages":{"f":[["Commutativity","x% of y = y% of x"],["Successive change","net = a + b + ab/100 &nbsp;(use negatives for decreases)"],["Same &plusmn;x%","net = &minus;x&sup2;/100 &nbsp;(always a DECREASE, never zero)"],["A is x% more than B","B is 100x/(100+x) % less than A"],["A is x% less than B","B is 100x/(100&minus;x) % more than A"],["Price up x%, spend fixed","cut consumption by 100x/(100+x) %"],["Restore after x% fall","must rise by 100x/(100&minus;x) %"],["At-least-one / overlap","A or B = A + B &minus; both"]],"note":["When no actual numbers are given, assume the base is 100.","Trap: +20% then &minus;20% is a 4% LOSS, not zero."]},"Profit & Loss":{"f":[["Profit %","(SP &minus; CP)/CP &times; 100 &nbsp;(always on COST)"],["Selling price","SP = CP(100 + P)/100"],["Cost price","CP = SP &times; 100/(100 + P)"],["Markup a%, discount b%","net = a &minus; b &minus; ab/100"],["Same SP, one +x% one &minus;x%","always a LOSS of x&sup2;/100 %"],["CP of m = SP of n","profit % = (m &minus; n)/n &times; 100"],["False weight","gain % = error/(true &minus; error) &times; 100"]],"note":["Discount is on MARKED price; profit is on COST price. Never just subtract them."]},"Simple & Compound Interest":{"f":[["Simple interest","SI = P&times;R&times;T/100"],["Compound amount","A = P(1 + R/100)&#8319;"],["Compound interest","CI = A &minus; P"],["CI &minus; SI (2 years)","P(R/100)&sup2;"],["CI &minus; SI (3 years)","P&middot;R&sup2;(300 + R)/100&sup3;"],["Half-yearly","rate R/2, periods 2n"],["Quarterly","rate R/4, periods 4n"],["SI doubling","doubles in T years &rarr; R = 100/T (linear)"],["CI doubling","doubles in T &rarr; 4&times; in 2T, 8&times; in 3T (powers of 2)"]],"note":["The 2-year CI&minus;SI difference appears almost every year. Memorise it."]},"Ratio & Proportion":{"f":[["Introduce k","a : b = 2 : 3 &rarr; a = 2k, b = 3k"],["Share from a total","share = (own part / total parts) &times; total"],["Chaining","A:B = 2:3, B:C = 4:5 &rarr; scale B &rarr; A:B:C = 8:12:15"],["Ages after t years","(a&middot;x + t)/(b&middot;x + t) = new ratio"]],"note":["Almost every ratio problem collapses the moment you write parts as multiples of k."]},"Averages":{"f":[["Definition","Average = Sum / Count &nbsp;&rarr;&nbsp; Sum = Average &times; Count"],["Replacement","(new &minus; old) = n &times; (change in average)"],["Equal distances","average speed = 2ab/(a + b) &nbsp;(harmonic mean)"],["Equal times","average speed = (a + b)/2"],["Evenly spaced list","average = middle term"]],"note":["Convert averages to sums immediately &mdash; that is the whole technique."]},"Mixtures & Alligation":{"f":[["Alligation rule","cheaper : dearer = (d &minus; m) : (m &minus; c)"],["Repeated replacement","remaining = V(1 &minus; r/V)&#8319;"],["Adding pure water","water is treated as cost 0"]],"note":["After removing r litres twice, you do NOT simply subtract 2r &mdash; the second removal takes out diluted mixture."]},"Time & Work":{"f":[["LCM method","total work = LCM of the times &rarr; every rate is a whole number"],["Two together","ab/(a + b) days"],["Efficiency","efficiency &prop; 1/time"],["Work equivalence","M&#8321;D&#8321;H&#8321;/W&#8321; = M&#8322;D&#8322;H&#8322;/W&#8322;"],["One alone from a pair","rate of A = rate of (A+B) &minus; rate of B"]],"note":["Never add fractions like 1/12 + 1/18. Use the LCM method &mdash; it is faster and far less error-prone."]},"Pipes & Cisterns":{"f":[["Same as Time &amp; Work","total = LCM of the times"],["Outlet pipe","counts as a NEGATIVE rate"],["Leak","leak rate = fill rate &minus; net rate"]],"note":["Check the sign of the net rate before dividing &mdash; a negative net rate means the tank never fills."]},"Time, Speed & Distance":{"f":[["Core","Distance = Speed &times; Time"],["km/h to m/s","&times; 5/18 &nbsp;&nbsp; m/s to km/h: &times; 18/5"],["Common values","36 km/h = 10 m/s &middot; 54 = 15 &middot; 72 = 20 &middot; 90 = 25"],["Equal distances","average = 2ab/(a + b)"],["Same distance","speed &prop; 1/time &rarr; speeds 3:4 means times 4:3"],["Approaching","closing speed = sum of speeds"],["Late / early","d/s&#8321; &minus; d/s&#8322; = total time difference (in hours)"]],"note":["Equal distance means harmonic mean. For 60 and 40 km/h the answer is 48, not 50."]},"Trains":{"f":[["Crossing a pole","distance = length of train"],["Crossing a platform","distance = train + platform"],["Crossing another train","distance = sum of both lengths"],["Opposite directions","relative speed = sum"],["Same direction","relative speed = difference"]],"note":["The train's own length is always part of the distance. Forgetting it is the standard error."]},"Boats & Streams":{"f":[["Downstream","D = b + s"],["Upstream","U = b &minus; s"],["Boat speed","b = (D + U)/2"],["Stream speed","s = (D &minus; U)/2"]],"note":["Most questions give D and U and ask for b or s &mdash; learn the last two lines."]},"Number System":{"f":[["Cyclicity","2&rarr;2,4,8,6 &middot; 3&rarr;3,9,7,1 &m tion."]},"Probability":{"f":[["Definition","P = favourable / total, &nbsp;0 &le; P &le; 1"],["Complement","P(not E) = 1 &minus; P(E)"],["Union","P(A&cup;B) = P(A) + P(B) &minus; P(A&cap;B)"],["Independent","P(A&cap;B) = P(A) &times; P(B)"],["At least one","1 &minus; P(none) &nbsp;&larr; almost always faster"],["Two dice sums","7&rarr;6 &middot; 6,8&rarr;5 &middot; 5,9&rarr;4 &middot; 4,10&rarr;3 &middot; 3,11&rarr;2 &middot; 2,12&rarr;1 (of 36)"],["A deck","52 cards &middot; 26 red &middot; 13 per suit &middot; 4 aces &middot; 12 face cards"]],"note":[]},"Clocks":{"f":[["Angle between hands","|30H &minus; 5.5M| &nbsp;(if &gt; 180, use 360 &minus; x)"],["Hand speeds","hour 0.5&deg;/min &middot; minute 6&deg;/min"],["Coincide","11 times in 12 hours"],["Opposite (180&deg;)","11 times in 12 hours"],["Right angles","22 times in 12 hours"],["Minute gains on hour","55 minutes per hour"]],"note":[]},"Calendars":{"f":[["Odd days","remainder after dividing total days by 7"],["Ordinary year","1 odd day"],["Leap year","2 odd days"],["Centuries","100y &rarr; 5 &middot; 200y &rarr; 3 &middot; 300y &rarr; 1 &middot; 400y &rarr; 0"],["Leap rule","divisible by 4, but a century must be divisible by 400"],["Day codes","0 = Sunday, 1 = Monday, &hellip; 6 = Saturday"]],"note":["1900 was NOT a leap year; 2000 was."]},"Cubes":{"f":[["3 faces painted","8 (corners, always)"],["2 faces painted","12(n &minus; 2) (edges)"],["1 face painted","6(n &minus; 2)&sup2; (face centres)"],["0 faces painted","(n &minus; 2)&sup3; (interior)"],["Check","the four counts must total n&sup3;"]],"note":[]},"Problems on Ages":{"f":[["Set up with one variable","let the younger be x, write everything else in terms of x"],["After t years","add t to BOTH ages &mdash; the difference never changes"],["t years ago","subtract t from both"],["Father k&times; son now, m&times; after t","x = t(m &minus; 1)/(k &minus; m)"],["A is d older, twice in t years","younger = d &minus; t"],["Sum with ratio a:b","younger = a/(a+b) &t function weightedPick(list, n){
  const pool = [];
  list.forEach(q => { const w = FREQ[q.s] || 2; for(let i=0;i<w;i++) pool.push(q); });
  shuffle(pool);
  const out = [], seen = new Set();
  for(const q of pool){ if(!seen.has(q.q)){ seen.add(q.q); out.push(q); if(out.length>=n) break; } }
  return out;
}

function startMock(id){
  S.mode = "test"; S.peek = false;
  if(id === "freq"){
    S.qs = weightedPick(BANK, 30);
    S.limit = 30*60; S.plan = null;
  } else {
    const m = MOCKS.find(x => x.id === id);
    S.qs = []; S.plan = [];
    m.sections.forEach(([name, filt, count, mins]) => {
      const picked = weightedPick(BANK.filter(filt), count);
      S.plan.push({name, from:S.qs.length, to:S.qs.length+picked.length, mins});
      S.qs = S.qs.concat(picked);
    });
    S.limit = m.mins*60;
  }
  S.i = 0; S.answers = new Array(S.qs.length).fill(null);
  S.t0 = Date.now(); S.elapsed = 0;
  clearInterval(S.tick); railTimer.hidden = false;
  S.tick = setInterval(clock, 250); clock(); render();
}

     <div class="sub"><h3>Difficulty</h3>
       <div class="seg" id="diffSeg">
         ${["all","Easy","Medium","Hard"].map(d=>`<button data-d="${d}" class="${S.diff===d?"on":""}">${d==="all"?"All":d}</button>`).join("")}
       </div>
     </div>

     ${chips}

     <div class="sub"><div class="chips">
       <button class="chip" id="selAll">Select all</button>
       <button class="chip" id="selNone">Clear</button>
       <button class="chip" id="selWeak">My weak areas</button>
     </div></div>

     <button class="go" id="start">Start drilling</button>
     <div class="hint" id="poolHint"></div>
     <button class="btn" id="backHome2" style="margin-top:12px;width:100%">Back</button>
   </div>`;

  view.querySelectorAll(".chip[data-s]").forEach(c => c.onclick = () => {
    const s = c.dataset.s;
    S.picked.has(s) ? S.picked.delete(s) : S.picked.add(s);
    c.classList.toggle("on"); poolHint();
  });
  view.querySelector("#modeSeg").onclick = e => {
    if(e.target.dataset.m){ S.mode = e.target.dataset.m; setup(); } };
  view.querySelector("#cntSeg").onclick = e => {
    if(e.target.dataset.c){ S.count = +e.target.dataset.c; setup(); } };
  view.querySelector("#diffSeg").onclick = e => {
    if(e.target.dataset.d){ S.diff = e.target.dataset.d; setup(); } };
  view.querySelector("#selAll").onclick = () => {
    BANK.forEach(q => S.picked.add(q.s)); setup(); };
  view.querySelector("#selNone").onclick = () => { S.picked.clear(); setup(); };
  view.querySelector("#selWeak").onclick = () => {
    S.picked.clear();
    const agg = {};
    BANK.forEach(q => {
      const k = q.s, v = store.seen[q.q];
      if(v === undefined) return;
      agg[k] = agg[k] || [0,0]; agg[k][1]++; if(v>0) agg[k][0]++;
    });
    const weak = Object.entries(agg).filter(([,[c,n]]) => n>=3 && c/n < .7).map(([k])=>k);
    (weak.length ? weak : Object.keys(SUBS).flatMap(t=>Object.keys(SUBS[t]))).forEach(s=>S.picked.add(s));
    setup();
  };
  view.querySelector("#start").onclick = begin;
  view.querySelector("#ctaSheet").onclick = openSheet;
  view.querySelector("#backHome2").onclick = home;
  poolHint();
  foot.innerHTML = `Progress is saved on this device. <span class="kbd">1</span>&#8211;<span class="kbd">4</span> to answer &#183; <span class="kbd">Enter</span> to continue &middot; <span class="kbd">F</span> for formulas`;
}

function pool(){
  return BANK.filter(q => (S.picked.size===0 || S.picked.has(q.s))
                       && (S.diff==="all" || q.d===S.diff));
}
function poolHint(){
  const n = pool().length, el = view.querySelector("#poolHint");
  const btn = view.querySelector("#start");
  if(!el) return;
  el.textContent = S.picked.size===0
    ? `No topic selected &#8212; drawing from all ${n} questions.`
    : `${S.picked.size} topic${S.picked.size>1?"s":""} selected &#183; ${n} questions available.`;
  btn.disabled = n === 0;
}

/* ---------- run ---------- */
function shuffle(a){
  for(let i=a.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function begin(){
  const p = shuffle(pool().slice());
  // Round-robin across question templates so one archetype can't dominate a short
  // set (otherwise a 10-question draw can be three near-identical profit sums).
  const groups = new Map();
  p.forEach(q => {
    const sig = q.s + "|" + q.q.replace(/[\d.,]/g,"").slice(0,45);
    if(!groups.has(sig)) groups.set(sig, []);
    groups.get(sig).push(q);
  });
  const buckets = shuffle([...groups.values()]);
  const picked = [];
  let added = true;
  while(picked.length < S.count && added){
    added = false;
    for(const b of buckets){
      if(!b.length) continue;
      picked.push(b.pop()); added = true;
      if(picked.length >= S.count) break;
    }
  }
  S.qs = picked;
  S.i = 0; S.answers = new Array(S.qs.length).fill(null);
  S.t0 = Date.now();
  S.limit = S.mode==="test" ? S.qs.length*60 : 0;
  clearInterval(S.tick);
  railTimer.hidden = false;
  S.tick = setInterval(clock, 250); clock();
  render();
}
function clock(){
  const el = Math.floor((Date.now()-S.t0)/1000);
  S.elapsed = el;                    // kept so the sheet can pause and resume
  let show = el, low = false;
  if(S.limit){ show = S.limit - el; low = show <= 60;
    if(show <= 0){ show = 0; finish(); } }
  railTimer.textContent =
    String(Math.floor(show/60)).padStart(2,"0")+":"+String(show%60).padStart(2,"0");
  railTimer.classList.toggle("low", low);
}

function render(){
  const q = S.qs[S.i], given = S.answers[S.i];
  const sec = S.plan ? S.plan.find(p => S.i >= p.from && S.i < p.to) : null;
  const showFb = S.mode==="practice" && given !== null;
  railStat.innerHTML = `<b>${S.i+1}</b> / ${S.qs.length}` +
    (S.mode==="practice" ? ` &#183; <b>${S.answers.filter((a,i)=>a!==null&&a===S.qs[i].a).length}</b> right` : "");

  const opts = q.o.map((o,k) => {
    let cls = "opt";
    if(showFb){ if(k===q.a) cls+=" right"; else if(k===given) cls+=" wrong"; }
    else if(given===k) cls+=" sel";
    return `<button class="${cls}" data-k="${k}"${showFb?" disabled":""}>
      <span class="k">${"ABCD"[k]}</span><span>${o}</span></button>`;
  }).join("");

  view.innerHTML = `
    <div class="card">
      <div class="bar"><i style="width:${(S.i)/S.qs.length*100}%"></i></div>
      <div class="qmeta">
        ${sec ? `<span class="secpill">${esc(sec.name)} &middot; ${S.i-sec.from+1}/${sec.to-sec.from}</span>` : ""}
        <span class="tag">${esc(q.s)}</span>
        <span class="tag d-${q.d}">${q.d}</span>
      </div>
      <div class="qtext">${q.q}</div>
      <div class="opts">${opts}</div>
      ${FORMULAS[q.s] ? `<details class="peek"${S.peek?" open":""}>
         <summary><b>f</b> Formulas for ${esc(q.s)}</summary>
         ${FORMULAS[q.s].f.map(([lb,fx]) =>
            `<div class="frow"><span class="lb">${lb}</span><span class="fx">${fx}</span></div>`).join("")}
         ${(FORMULAS[q.s].note||[]).map(n=>`<div class="fnote">${n}</div>`).join("")}
       </details>` : ""}
      ${showFb ? `<div class="expl"><span class="lab">${given===q.a?"Correct":"Explanation"}</span>${q.e}</div>` : ""}
      <div class="nav">
        ${S.i>0?`<button class="btn" id="prev">Back</button>`:""}
        <button class="btn pri" id="next">${
          S.i===S.qs.length-1 ? "Finish" : (S.mode==="practice"&&given===null ? "Skip" : "Next")}</button>
      </div>
    </div>`;

  view.querySelectorAll(".tblwrap").forEach(()=>{});
  view.querySelectorAll(".qtext table").forEach(t => {
    if(!t.parentElement.classList.contains("tblwrap")){
      const w = document.createElement("div"); w.className = "tblwrap";
      t.parentNode.insertBefore(w, t); w.appendChild(t);
    }
  });
  view.querySelectorAll(".opt").forEach(b => b.onclick = () => choose(+b.dataset.k));
  const pk = view.querySelector(".peek");
  if(pk) pk.ontoggle = () => { S.peek = pk.open; };   // remember across questions
  const nx = view.querySelector("#next"); if(nx) nx.onclick = next;
  const pv = view.querySelector("#prev"); if(pv) pv.onclick = () => { S.i--; render(); };
  foot.innerHTML = `<span class="kbd">1</span>&#8211;<span class="kbd">4</span> answer &#183; <span class="kbd">Enter</span> ${S.i===S.qs.length-1?"finish":"next"} &#183; <span class="kbd">Esc</span> quit`;
}

function choose(k){
  if(S.mode==="practice" && S.answers[S.i]!==null) return;
  S.answers[S.i] = k;
  const q = S.qs[S.i];
  store.seen[q.q] = (k===q.a) ? 1 : 0; save();
  if(S.mode==="practice") render();
  else { if(S.i < S.qs.length-1){ S.i++; render(); } else render(); }
}
function next(){ if(S.i < S.qs.length-1){ S.i++; render(); } else finish(); }

/* ---------- results ---------- */
function finish(){
  clearInterval(S.tick); railTimer.hidden = true;
  const total = S.qs.length;
  const right = S.answers.filter((a,i) => a!==null && a===S.qs[i].a).length;
  const blank = S.answers.filter(a => a===null).length;
  const secs = Math.floor((Date.now()-S.t0)/1000);
  const pct = Math.round(right/total*100);

  const agg = {};
  S.qs.forEach((q,i) => {
    agg[q.s] = agg[q.s] || [0,0];
    agg[q.s][1]++; if(S.answers[i]===q.a) agg[q.s][0]++;
  });
  const rows = Object.entries(agg).sort((a,b) => a[1][0]/a[1][1] - b[1][0]/b[1][1])
    .map(([s,[c,n]]) => {
      const p = c/n*100;
      return `<div class="brow"><span class="nm">${esc(s)}</span>
        <span class="meter"><i class="${p<60?"bad":""}" style="width:${p}%"></i></span>
        <span class="sc">${c}/${n}</span></div>`;
    }).join("");

  const verdict = pct>=80 ? ["Strong &#8212; you'd clear any first round","var(--ok-bg)","var(--ok)"]
    : pct>=65 ? ["Clearing most cutoffs. Tighten speed","var(--accent-bg)","var(--accent)"]
    : pct>=50 ? ["Borderline &#8212; usually a speed problem","var(--accent-bg)","var(--accent)"]
    : ["Go back to the base layer and arithmetic","var(--no-bg)","var(--no)"];

  const review = S.qs.map((q,i) => {
    const a = S.answers[i], ok = a===q.a;
    return `<details><summary>
        <span class="mk ${ok?"y":"n"}">${ok?"&#10003;":"&#10005;"}</span>
        <span>${q.q.replace(/<table[\s\S]*?<\/table>/g,"[table]")}</span></summary>
      <div class="body">
        ${a===null ? `<div class="yours">You left this blank.</div>`
          : ok ? "" : `<div class="yours">Your answer: ${q.o[a]}</div>`}
        <div class="corr">Correct: ${q.o[q.a]}</div>
        <div style="margin-top:8px">${q.e}</div>
      </div></details>`;
  }).join("");

  view.innerHTML = `
    <div class="card">
      <div class="score">
        <div class="eyebrow">${S.mode==="test"?"Timed test":"Practice set"} complete</div>
        <div class="big">${right}<span class="of"> / ${total}</span></div>
        <div class="verdict" style="background:${verdict[1]};color:${verdict[2]}">${verdict[0]}</div>
      </div>
      <div class="grid">
        <div class="tile"><div class="v">${pct}%</div><div class="l">Accuracy</div></div>
        <div class="tile"><div class="v">${Math.floor(secs/60)}:${String(secs%60).padStart(2,"0")}</div><div class="l">Time</div></div>
        <div class="tile"><div class="v">${(secs/total).toFixed(0)}s</div><div class="l">Per question</div></div>
        <div class="tile"><div class="v">${blank}</div><div class="l">Blank</div></div>
      </div>
      <h3 style="font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:22px">By topic &#8212; weakest first</h3>
      <div class="brk">${rows}</div>
      <div class="nav" style="margin-top:22px">
        <button class="btn" id="again">New set</button>
        <button class="btn pri" id="retry">Same topics again</button>
      </div>
      <h3 style="font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:26px">Review every question</h3>
      <div class="rev">${review}</div>
    </div>`;
  view.querySelector("#again").onclick = home;
  view.querySelector("#retry").onclick = () => S.plan ? home() : begin();
  railStat.innerHTML = `<b>${right}/${total}</b> &#183; ${pct}%`;
  foot.textContent = "Log what you got wrong, and why. That log is worth more than another set.";
  window.scrollTo({top:0, behavior:"smooth"});
}

/* ---------- keyboard ---------- */
addEventListener("keydown", e => {
  if(/^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;   // don't hijack the search box
  if(e.key === "f" || e.key === "F"){
    e.preventDefault(); sheetBack ? closeSheet() : openSheet(); return;
  }
  if(sheetBack) { if(e.key === "Escape") closeSheet(); return; }
  if(!S.qs.length || !view.querySelector(".opts")) return;
  if(e.key >= "1" && e.key <= "4"){ const k = +e.key-1;
    if(k < S.qs[S.i].o.length) choose(k); }
  else if(e.key === "Enter"){ e.preventDefault(); next(); }
  else if(e.key === "Escape"){ clearInterval(S.tick); S.qs=[]; home(); }
});

home();
</script>
