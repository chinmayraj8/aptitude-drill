 km</b>.","d":"Medium"},{"t":"Quantitative","s":"Time, Speed & Distance","q":"Walking at 6 km/h a man reaches his office 20 minutes late; at 7 km/h he arrives 10 minutes early. Find the distance to his office.","o":["13 km","21 km","3 km","42 km"],"a":1,"e":"Time difference = 20+10 = 30 min = 0.5 h. d/6 \u2212 d/7 = 0.5 \u2192 d = <b>21 km</b>.","d":"Medium"},{"t":"Quantitative","s":"Time, Speed & Distance","q":"Walking at 4 km/h a man reaches his office 15 minutes late; at 5 km/h he arrives 5 minutes early. Find the distance to his office.","o":["1.33 km","9 km","13.33 km","6.67 km"],"a":3,"e":"Time difference = 15+5 = 20 min = 0.33 h. d/4 \u2212 d/5 = 0.33 \u2192 d = <b>6.67 km</b>.","d":"Medium"},{"t":"Quantitative","s":"Time, Speed & Distance","q":"Walking at 6 km/h a man reaches his office 15 minutes late; at 8 km/h he arrives 10 minutes early. Find the distance to his office.","o":["2.5 km","10 km","20 km","14 km"],"a":1,"e":"Time difference = 15+10 = 25 min = 0.42 h. d/6 \u2212 d/8 = 0.42 \u2192 d = <b>10 km</b>.","d":"Medium"},{"t":"Quantitative","s":"Time, Speed & Distance","q":"Walking at 5 km/h a man reaches his office 20 minutes late; at 7 km/h he arrives 5 minutes early. Find the distance to his office.","o":["2.08 km","7.29 km","14.58 km","12 km"],"a":1,"e":"Time difference = 20+5 = 25 min = 0.42 h. d/5 \u2212 d/7 = 0.42 \u2192 d = <b>7.29 km</b>.","d":"Medium"},{"t":"Quantitative","s":"Time, Speed & Distance","q":"Two cities are 600 km apart. A car starts from one at 50 km/h and another from the other at 40 km/h, moving towards each other at the same time. After how long do they meet?","o":["60 hrs","12 hrs","15 hrs","6.67 hrs"],"a":3,"e":"Approaching \u2192 add speeds: 50+40 = 90 km/h. Time = 600/90 = <b>6.67 hours</b>.","d":"Easy"},{"t":"Quantitative","s":"Time, Speed & Distance","q":"Two cities are 400 km apart. A car starts from one at 50 km/h and another from the other at 40 km/h, moving towards each other at the same time. After how long do they meet?","o":["10 hrs","4.44 hrs","40 hrs","8 hrs"],"a":1,"e":"Approaching \u2192 add speeds: 50+40 = 90 km/h. Time = 400/90 = <b>4.44 hours</b>.","d":"Easy"},{"t":"Quantitative","s":"Time, Speed & Distance","q":"Two cities are 400 km apart. A car starts from one at 40 km/h and another from the other at 40 km/h, moving towards each other at the same time. After how long do they meet?","o":["6 hrs","2.5 hrs","5 hrs","10 hrs"],"a":2,"e":"Approaching \u2192 add speeds: 40+40 = 80 km/h. Time = 400/80 = <b>5 hours</b>.","d":"Easy"},{"t":"Quantitative","s":"Trains","q":"A train 180 m long crosses a pole in 12 seconds. Find its speed in km/h.","o":["54 km/h","4.17 km/h","216 km/h","15 km/h"],"a":0,"e":"Crossing a pole covers only the train's length: 180/12 = 15 m/s \u2192 \u00d7 18/5 = <b>54 km/h</b>.","d":"Easy"},{"t":"Quantitative","s":"Trains","q":"A train 150 m long crosses a pole in 10 seconds. Find its speed in km/h.","o":["54 km/h","15 km/h","4.17 km/h","150 km/h"],"a":0,"e":"Crossing a pole covers only the train's length: 150/10 = 15 m/s \u2192 \u00d7 18/5 = <b>54 km/h</b>.","d":"Easy"},{"t":"Quantitative","s":"Trains","q":"A train 240 m long travelling at 54 km/h crosses a platform in 25 seconds. Find the length of the platform.","o":["100 m","135 m","375 m","615 m"],"a":1,"e":"54 km/h = 15 m/s. Total distance = 15\u00d725 = 375 m. Platform = 375 \u2212 240 = <b>135 m</b>.","d":"Medium"},{"t":"Quantitative","s":"Trains","q":"Two trains 150 m and 250 m long move towards each other at 54 km/h and 36 km/h. How long do they take to cross each other completely?","o":["4.44 s","80 s","6 s","16 s"],"a":3,"e":"Opposite directions \u2192 relative speed = 54+36 = 90 km/h = 25 m/s. Distance = 150+250 = 400 m \u2192 <b>16 seconds</b>.","d":"Medium"},{"t":"Quantitative","s":"Boats & Streams","q":"A boat's speed in still water is 18 km/h and the stream flows at 3 km/h. How long will it take to travel 30 km downstream?","o":["2 hrs","1.67 hrs","10 hrs","1.43 hrs"],"a":3,"e":"Downstream speed = 18+3 = 21 km/h \u2192 30/21 = <b>1.43 hours</b>.","d":"Easy"},{"t":"Quantitative","s":"Boats & Streams","q":"A boat's speed in still water is 10 km/h and the stream flows at 2 km/h. How long will it take to travel 30 km downstream?","o":["2.5 hrs","3.75 hrs","15 hrs","3 hrs"],"a":0,"e":"Downstream speed = 10+2 = 12 km/h \u2192 30/12 = <b>2.5 hours</b>.","d":"Easy"},{"t":"Quantitative","s":"Boats & Streams","q":"A boat's speed in still water is 15 km/h and the stream flows at 4 km/h. How long will it take to travel 24 km downstream?","o":["1.26 hrs","6 hrs","2.18 hrs","1.6 hrs"],"a":0,"e":"Downstream speed = 15+4 = 19 km/h \u2192 24/19 = <b>1.26 hours</b>.","d":"Easy"},{"t":"Quantitative","s":"Boats & Streams","q":"A boat's speed in still water is 15 km/h and the stream flows at 2 km/h. How long will it take to travel 45 km downstream?","o":["2.65 hrs","3 hrs","22.5 hrs","3.46 hrs"],"a":0,"e":"Downstream speed = 15+2 = 17 km/h \u2192 45/17 = <b>2.65 hours</b>.","d":"Easy"},{"t":"Quantitative","s":"Boats & Streams","q":"A boat's speed in still water is 15 km/h and the stream flows at 4 km/h. How long will it take to travel 30 km downstream?","o":["2.73 hrs","7.5 hrs","1.58 hrs","2 hrs"],"a":2,"e":"Downstream speed = 15+4 = 19 km/h \u2192 30/19 = <b>1.58 hours</b>.","d":"Easy"},{"t":"Quantitative","s":"Boats & Streams","q":"A boat's speed in still water is 15 km/h and the stream flows at 4 km/h. How long will it take to travel 36 km downstream?","o":["9 hrs","1.89 hrs","3.27 hrs","2.4 hrs"],"a":1,"e":"Downstream speed = 15+4 = 19 km/h \u2192 36/19 = <b>1.89 hours</b>.","d":"Easy"},{"t":"Quantitative","s":"Number System","q":"Find the unit digit of 4^64.","o":["4","4.8","3.6","6"],"a":3,"e":"The unit digits of powers of 4 cycle as [4, 6] (length 2). 64 mod 2 = 0 \u2192 <b>6</b>. (Remainder 0 means take the last element.)","d":"Medium"},{"t":"Quantitative","s":"Number System","q":"Find the unit digit of 8^88.","o":["9","8","4.5","6"],"a":3,"e":"The unit digits of powers of 8 cycle as [8, 4, 2, 6] (length 4). 88 mod 4 = 0 \u2192 <b>6</b>. (Remainder 0 means take the last element.)","d":"Medium"},{"t":"Quantitative","s":"Number System","q":"Find the unit digit of 9^113.","o":["1","9","11","7"],"a":1,"e":"The unit digits of powers of 9 cycle as [9, 1] (length 2). 113 mod 2 = 1 \u2192 <b>9</b>. (Remainder 0 means take the last element.)","d":"Medium"},{"t":"Quantitative","s":"Number System","q":"Find the unit digit of 3^61.","o":["2.4","3.75","3","9"],"a":2,"e":"The unit digits of powers of 3 cycle as [3, 9, 7, 1] (length 4). 61 mod 4 = 1 \u2192 <b>3</b>. (Remainder 0 means take the last element.)","d":"Medium"},{"t":"Quantitative","s":"Number System","q":"Find the unit digit of 4^103.","o":["6","2.4","4","5"],"a":2,"e":"The unit digits of powers of 4 cycle as [4, 6] (length 2). 103 mod 2 = 1 \u2192 <b>4</b>. (Remainder 0 means take the last element.)","d":"Medium"},{"t":"Quantitative","s":"Number System","q":"Find the unit digit of 7^35.","o":["4.5","7","1","3"],"a":3,"e":"The unit digits of powers of 7 cycle as [7, 9, 3, 1] (length 4). 35 mod 4 = 3 \u2192 <b>3</b>. (Remainder 0 means take the last element.)","d":"Medium"},{"t":"Quantitative","s":"Number System","q":"Find the unit digit of 3^87.","o":["14","3","1","7"],"a":3,"e":"The unit digits of powers of 3 cycle as [3, 9, 7, 1] (length 4). 87 mod 4 = 3 \u2192 <b>7</b>. (Remainder 0 means take the last element.)","d":"Medium"},{"t":"Quantitative","s":"Number System","q":"Find the unit digit of 7^99.","o":["7","3","1","2.4"],"a":1,"e":"The unit digits of powers of 7 cycle as [7, 9, 3, 1] (length 4). 99 mod 4 = 3 \u2192 <b>3</b>. (Remainder 0 means take the last element.)","d":"Medium"},{"t":"Quantitative","s":"LCM & HCF","q":"Find the LCM of 24 and 36.","o":["36","72","24","12"],"a":1,"e":"HCF(24,36) = 12 and LCM = 72. Answer: <b>72</b>. Check: HCF \u00d7 LCM = 864 = 24\u00d736 \u2713","d":"Easy"},{"t":"Quantitative","s":"LCM & HCF","q":"Find the least number which, when divided by 4, 6 and 10, leaves a remainder of 2 in each case.","o":["60","22","58","62"],"a":3,"e":"The number is LCM + remainder = LCM(4,6,10) + 2 = 60 + 2 = <b>62</b>.","d":"Medium"},{"t":"Quantitative","s":"Number System","q":"Find the remainder when 2^38 is divided by 5.","o":["0","1","2","4"],"a":3,"e":"Find the smallest power of 2 that leaves remainder 1 mod 5, then reduce the exponent. Result: <b>4</b>.","d":"Hard"},{"t":"Quantitative","s":"Number System","q":"Find the remainder when 2^70 is divided by 7.","o":["4","3","1","2"],"a":3,"e":"Find the smallest power of 2 that leaves remainder 1 mod 7, then reduce the exponent. Result: <b>2</b>.","d":"Hard"},{"t":"Quantitative","s":"Number System","q":"Find the remainder when 3^86 is divided by 5.","o":["0","1","3","4"],"a":3,"e":"Find the smallest power of 3 that leaves remainder 1 mod 5, then reduce the exponent. Result: <b>4</b>.","d":"Hard"},{"t":"Quantitative","s":"Number System","q":"Find the remainder when 3^28 is divided by 5.","o":["0.8","2","3","1"],"a":3,"e":"Find the smallest power of 3 that leaves remainder 1 mod 5, then reduce the exponent. Result: <b>1</b>.","d":"Hard"},{"t":"Quantitative","s":"Number System","q":"Find the remainder when 2^69 is divided by 7.","o":["2","0.5","1.25","1"],"a":3,"e":"Find the smallest power of 2 that leaves remainder 1 mod 7, then reduce the exponent. Result: <b>1</b>.","d":"Hard"},{"t":"Quantitative","s":"Number System","q":"Find the remainder when 2^70 is divided by 5.","o":["0","2","4","1"],"a":2,"e":"Find the smallest power of 2 that leaves remainder 1 mod 5, then reduce the exponent. Result: <b>4</b>.","d":"Hard"},{"t":"Quantitative","s":"Progressions","q":"Find the sum of the cubes of the first 20 natural numbers.","o":["400","88200","44100","22050"],"a":2,"e":"Formula: [n(n+1)/2]\u00b2 with n = 20 \u2192 <b>44100</b>.","d":"Medium"},{"t":"Quantitative","s":"Progressions","q":"Find the sum of the squares of the first 30 natural numbers.","o":["9455","900","18910","4727"],"a":0,"e":"Formula: n(n+1)(2n+1)/6 with n = 30 \u2192 <b>9455</b>.","d":"Medium"},{"t":"Quantitative","s":"Progressions","q":"Find the sum of the cubes of the first 15 natural numbers.","o":["225","14400","28800","7200"],"a":1,"e":"Formula: [n(n+1)/2]\u00b2 with n = 15 \u2192 <b>14400</b>.","d":"Medium"},{"t":"Quantitative","s":"Progressions","q":"Find the sum of the first 12 terms of the AP 5, 10, 15, \u2026","o":["390","780","60","195"],"a":0,"e":"Last term = 5+(12\u22121)\u00d75 = 60. Sum = n/2 \u00d7 (first + last) = 12/2 \u00d7 (5+60) = <b>390</b>.","d":"Medium"},{"t":"Quantitative","s":"Progressions","q":"Find the sum of the first 20 terms of the AP 3, 5, 7, \u2026","o":["41","440","220","880"],"a":1,"e":"Last term = 3+(20\u22121)\u00d72 = 41. Sum = n/2 \u00d7 (first + last) = 20/2 \u00d7 (3+41) = <b>440</b>.","d":"Medium"},{"t":"Quantitative","s":"Progressions","q":"Find the sum of the first 20 terms of the AP 3, 8, 13, \u2026","o":["1010","2020","98","505"],"a":0,"e":"Last term = 3+(20\u22121)\u00d75 = 98. Sum = n/2 \u00d7 (first + last) = 20/2 \u00d7 (3+98) = <b>1010</b>.","d":"Medium"},{"t":"Quantitative","s":"Progressions","q":"Find the sum of the first 20 terms of the AP 3, 6, 9, \u2026","o":["315","630","60","1260"],"a":1,"e":"Last term = 3+(20\u22121)\u00d73 = 60. Sum = n/2 \u00d7 (first + last) = 20/2 \u00d7 (3+60) = <b>630</b>.","d":"Medium"},{"t":"Quantitative","s":"Progressions","q":"Find the sum of the first 20 terms of the AP 7, 9, 11, \u2026","o":["45","1040","260","520"],"a":3,"e":"Last term = 7+(20\u22121)\u00d72 = 45. Sum = n/2 \u00d7 (first + last) = 20/2 \u00d7 (7+45) = <b>520</b>.","d":"Medium"},{"t":"Quantitative","s":"Permutations & Combinations","q":"In how many ways can 3 people be selected from a group of 6?","o":["15","120","20","18"],"a":2,"e":"Order does not matter \u2192 combination. C(6,3) = <b>20</b>. (If order mattered it would be P(6,3) = 120.)","d":"Easy"},{"t":"Quantitative","s":"Permutations & Combinations","q":"In how many ways can 2 people be selected from a group of 8?","o":["28","56","16","8"],"a":0,"e":"Order does not matter \u2192 combination. C(8,2) = <b>28</b>. (If order mattered it would be P(8,2) = 56.)","d":"Easy"},{"t":"Quantitative","s":"Permutations & Combinations","q":"In how many ways can 4 people be selected from a group of 8?","o":["1680","32","70","56"],"a":2,"e":"Order does not matter \u2192 combination. C(8,4) = <b>70</b>. (If order mattered it would be P(8,4) = 1680.)","d":"Easy"},{"t":"Quantitative","s":"Permutations & Combinations","q":"In how many ways can 6 people be seated around a circular table?","o":["120","720","60","24"],"a":0,"e":"Circular arrangements = (n\u22121)! = 5! = <b>120</b>. One seat is fixed to remove rotational duplicates.","d":"Medium"},{"t":"Quantitative","s":"Permutations & Combinations","q":"From 5 men and 4 women, in how many ways can a committee of 2 men and 2 women be formed?","o":["126","16","120","60"],"a":3,"e":"Choose independently and multiply: C(5,2) \u00d7 C(4,2) = 10 \u00d7 6 = <b>60</b>.","d":"Medium"},{"t":"Logical Reasoning","s":"Clocks","q":"Find the angle between the hands of a clock at 7:15.","o":["210\u00b0","127.5\u00b0","150\u00b0","90\u00b0"],"a":1,"e":"Angle = |30H \u2212 5.5M| = |30\u00d77 \u2212 5.5\u00d715| = 127.5\u00b0 \u2192 <b>127.5\u00b0</b>.","d":"Medium"},{"t":"Logical Reasoning","s":"Clocks","q":"Find the angle between the hands of a clock at 10:25.","o":["300\u00b0","150\u00b0","162.5\u00b0","250\u00b0"],"a":2,"e":"Angle = |30H \u2212 5.5M| = |30\u00d710 \u2212 5.5\u00d725| = 162.5\u00b0 \u2192 <b>162.5\u00b0</b>.","d":"Medium"},{"t":"Logical Reasoning","s":"Clocks","q":"Find the angle between the hands of a clock at 2:40.","o":["160\u00b0","60\u00b0","240\u00b0","95\u00b0"],"a":0,"e":"Angle = |30H \u2212 5.5M| = |30\u00d72 \u2212 5.5\u00d740| = 160\u00b0 \u2192 <b>160\u00b0</b>.","d":"Medium"},{"t":"Logical Reasoning","s":"Clocks","q":"Find the angle between the hands of a clock at 1:15.","o":["52.5\u00b0","100\u00b0","30\u00b0","90\u00b0"],"a":0,"e":"Angle = |30H \u2212 5.5M| = |30\u00d71 \u2212 5.5\u00d715| = 52.5\u00b0 \u2192 <b>52.5\u00b0</b>.","d":"Medium"},{"t":"Logical Reasoning","s":"Clocks","q":"Find the angle between the hands of a clock at 5:00.","o":["200\u00b0","0\u00b0","125\u00b0","150\u00b0"],"a":3,"e":"Angle = |30H \u2212 5.5M| = |30\u00d75 \u2212 5.5\u00d70| = 150\u00b0 \u2192 <b>150\u00b0</b>.","d":"Medium"},{"t":"Logical Reasoning","s":"Clocks","q":"Find the angle between the hands of a clock at 2:15.","o":["60\u00b0","90\u00b0","22.5\u00b0","11\u00b0"],"a":2,"e":"Angle = |30H \u2212 5.5M| = |30\u00d72 \u2212 5.5\u00d715| = 22.5\u00b0 \u2192 <b>22.5\u00b0</b>.","d":"Medium"},{"t":"Logical Reasoning","s":"Clocks","q":"Find the angle between the hands of a clock at 10:00.","o":["300\u00b0","120\u00b0","60\u00b0","0\u00b0"],"a":2,"e":"Angle = |30H \u2212 5.5M| = |30\u00d710 \u2212 5.5\u00d70| = 300\u00b0, and since this exceeds 180\u00b0 we take 360 \u2212 300 \u2192 <b>60\u00b0</b>.","d":"Medium"},{"t":"Logical Reasoning","s":"Clocks","q":"Find the angle between the hands of a clock at 9:20.","o":["270\u00b0","250\u00b0","120\u00b0","160\u00b0"],"a":3,"e":"Angle = |30H \u2212 5.5M| = |30\u00d79 \u2212 5.5\u00d720| = 160\u00b0 \u2192 <b>160\u00b0</b>.","d":"Medium"},{"t":"Logical Reasoning","s":"Cubes","q":"A cube is painted on all faces and then cut into 64 equal smaller cubes. How many smaller cubes have no face(s) painted?","o":["16","10","8","24"],"a":2,"e":"With n = 4 per edge: (n\u22122)\u00b3 = <b>8</b>. (Corners = 8 always, edges = 12(n\u22122), faces = 6(n\u22122)\u00b2, interior = (n\u22122)\u00b3.)","d":"Medium"},{"t":"Logical Reasoning","s":"Cubes","q":"A cube is painted on all faces and then cut into 64 equal smaller cubes. How many smaller cubes have exactly two face(s) painted?","o":["35","8","24","14"],"a":2,"e":"With n = 4 per edge: 12(n\u22122) = <b>24</b>. (Corners = 8 always, edges = 12(n\u22122), faces = 6(n\u22122)\u00b2, interior = (n\u22122)\u00b3.)","d":"Medium"},{"t":"Logical Reasoning","s":"Calendars","q":"If 1 January 2024 was a Wednesday, what day was 1 January 2025? (2024 is a leap year.)","o":["Thursday","Wednesday","Friday","Saturday"],"a":2,"e":"A leap year has 366 days = 2 odd days. Wednesday + 2 = <b>Friday</b>.","d":"Medium"},{"t":"Logical Reasoning","s":"Calendars","q":"If 1 January 2028 was a Thursday, what day was 1 January 2029? (2028 is a leap year.)","o":["Sunday","Thursday","Saturday","Friday"],"a":2,"e":"A leap year has 366 days = 2 odd days. Thursday + 2 = <b>Saturday</b>.","d":"Medium"},{"t":"Logical Reasoning","s":"Calendars","q":"If 1 January 2026 was a Friday, what day was 1 January 2027? (2026 is an ordinary year.)","o":["Saturday","Sunday","Friday","Monday"],"a":0,"e":"An ordinary year has 365 days = 1 odd day. Friday + 1 = <b>Saturday</b>.","d":"Medium"},{"t":"Quantitative","s":"Percentages","q":"Find 37.5% of 960.","o":["25.6","456","360","36"],"a":2,"e":"37.5% of 960 = 960 \u00d7 37.5/100 = <b>360</b>. Faster: 37.5% = 3/8 of the number.","d":"Easy"},{"t":"Quantitative","s":"Percentages","q":"Find 37.5% of 240.","o":["90","114","9","6.4"],"a":0,"e":"37.5% of 240 = 240 \u00d7 37.5/100 = <b>90</b>. Faster: 37.5% = 3/8 of the number.","d":"Easy"},{"t":"Quantitative","s":"Percentages","q":"Find 75% of 240.","o":["204","18","3.2","180"],"a":3,"e":"75% of 240 = 240 \u00d7 75/100 = <b>180</b>. Faster: 75% = 3/4 of the number.","d":"Easy"},{"t":"Quantitative","s":"Percentages","q":"Find 12.5% of 640.","o":["8","144","80","51.2"],"a":2,"e":"12.5% of 640 = 640 \u00d7 12.5/100 = <b>80</b>. Faster: 12.5% = 1/8 of the number.","d":"Easy"},{"t":"Quantitative","s":"Percentages","q":"Find 20% of 800.","o":["40","16","240","160"],"a":3,"e":"20% of 800 = 800 \u00d7 20/100 = <b>160</b>. Faster: 20% = 1/5 of the number.","d":"Easy"},{"t":"Quantitative","s":"Percentages","q":"Find 37.5% of 480.","o":["12.8","228","180","18"],"a":2,"e":"37.5% of 480 = 480 \u00d7 37.5/100 = <b>180</b>. Faster: 37.5% = 3/8 of the number.","d":"Easy"},{"t":"Quantitative","s":"Percentages","q":"In a two-candidate election the winner got 60% of the votes and won by 800 votes. Find the total number of votes.","o":["1333.33","2000","4000","1600"],"a":2,"e":"Margin = 60% \u2212 40% = 20% of total = 800 \u2192 total = 800 \u00d7 100/20 = <b>4000</b>.","d":"Medium"},{"t":"Quantitative","s":"Percentages","q":"In a two-candidate election the winner got 55% of the votes and won by 1200 votes. Find the total number of votes.","o":["2181.82","2666.67","2400","12000"],"a":3,"e":"Margin = 55% \u2212 45% = 10% of total = 1200 \u2192 total = 1200 \u00d7 100/10 = <b>12000</b>.","d":"Medium"},{"t":"Quantitative","s":"Percentages","q":"In an exam 35% failed in Maths, 45% failed in English and 20% failed in both. What percent passed in both subjects?","o":["80%","20%","60%","40%"],"a":3,"e":"Failed in at least one = 35 + 45 \u2212 20 = 60%. Passed in both = 100 \u2212 60 = <b>40%</b>. Subtract the overlap or you double-count.","d":"Medium"},{"t":"Quantitative","s":"Percentages","q":"In an exam 30% failed in Maths, 50% failed in English and 20% failed in both. What percent passed in both subjects?","o":["20%","80%","40%","60%"],"a":2,"e":"Failed in at least one = 30 + 50 \u2212 20 = 60%. Passed in both = 100 \u2212 60 = <b>40%</b>. Subtract the overlap or you double-count.","d":"Medium"},{"t":"Quantitative","s":"Percentages","q":"In an exam 35% failed in Maths, 55% failed in English and 20% failed in both. What percent passed in both subjects?","o":["70%","80%","30%","10%"],"a":2,"e":"Failed in at least one = 35 + 55 \u2212 20 = 70%. Passed in both = 100 \u2212 70 = <b>30%</b>. Subtract the overlap or you double-count.","d":"Medium"},{"t":"Quantitative","s":"Profit & Loss","q":"An article costing \u20b9250 is sold at a profit of 20%. Find the selling price.","o":["50","200","270","300"],"a":3,"e":"SP = CP(100+P)/100 = 250 \u00d7 120/100 = <b>\u20b9300</b>.","d":"Easy"},{"t":"Quantitative","s":"Profit & Loss","q":"An article costing \u20b9800 is sold at a profit of 20%. Find the selling price.","o":["160","960","640","820"],"a":1,"e":"SP = CP(100+P)/100 = 800 \u00d7 120/100 = <b>\u20b9960</b>.","d":"Easy"},{"t":"Quantitative","s":"Profit & Loss","q":"An article bought for \u20b9750 is sold for \u20b9900. Find the profit percentage.","o":["150%","16.67%","9.09%","20%"],"a":3,"e":"Profit% = (SP\u2212CP)/CP \u00d7 100 = 150/750 \u00d7 100 = <b>20%</b>. Profit is always on COST price, never on SP.","d":"Easy"},{"t":"Quantitative","s":"Simple & Compound Interest","q":"Find the simple interest on \u20b96000 at 8% per annum for 4 years.","o":["480","1920","192","7920"],"a":1,"e":"SI = PRT/100 = 6000\u00d78\u00d74/100 = <b>\u20b91920</b>.","d":"Easy"},{"t":"Quantitative","s":"Simple & Compound Interest","q":"Find the simple interest on \u20b912000 at 12% per annum for 2 years.","o":["14880","1440","2880","288"],"a":2,"e":"SI = PRT/100 = 12000\u00d712\u00d72/100 = <b>\u20b92880</b>.","d":"Easy"},{"t":"Quantitative","s":"Simple & Compound Interest","q":"Find the difference between compound and simple interest on \u20b916000 at 10% per annum for 2 years.","o":["160","1600","320","3200"],"a":0,"e":"Difference for 2 years = P(R/100)\u00b2 = 16000 \u00d7 (10/100)\u00b2 = <b>\u20b9160</b>. Memorise this \u2014 it appears constantly.","d":"Medium"},{"t":"Quantitative","s":"Ratio & Proportion","q":"\u20b9600 is divided among A, B and C in the ratio 3 : 4 : 5. Find C's share.","o":["250","150","500","200"],"a":0,"e":"Total parts = 12. C gets 5/12 \u00d7 600 = <b>\u20b9250</b>.","d":"Easy"},{"t":"Quantitative","s":"Ratio & Proportion","q":"\u20b91440 is divided among A, B and C in the ratio 3 : 4 : 5. Find C's share.","o":["480","750","600","360"],"a":2,"e":"Total parts = 12. C gets 5/12 \u00d7 1440 = <b>\u20b9600</b>.","d":"Easy"},{"t":"Quantitative","s":"Ratio & Proportion","q":"\u20b91440 is divided among A, B and C in the ratio 2 : 3 : 7. Find C's share.","o":["480","360","240","840"],"a":3,"e":"Total parts = 12. C gets 7/12 \u00d7 1440 = <b>\u20b9840</b>.","d":"Easy"},{"t":"Quantitative","s":"Ratio & Proportion","q":"\u20b92400 is divided among A, B and C in the ratio 3 : 4 : 5. Find C's share.","o":["800","2000","1000","600"],"a":2,"e":"Total parts = 12. C gets 5/12 \u00d7 2400 = <b>\u20b91000</b>.","d":"Easy"},{"t":"Quantitative","s":"Ratio & Proportion","q":"\u20b9600 is divided among A, B and C in the ratio 1 : 2 : 3. Find C's share.","o":["250","100","200","300"],"a":3,"e":"Total parts = 6. C gets 3/6 \u00d7 600 = <b>\u20b9300</b>.","d":"Easy"},{"t":"Quantitative","s":"Ratio & Proportion","q":"The present ages of two people are in the ratio 3 : 4. After 8 years the ratio becomes 7 : 9. Find the present age of the younger one.","o":["56 years","64 years","48 years","72 years"],"a":2,"e":"Let the ages be 3x and 4x. Then (3x+8)/(4x+8) = 7/9 \u2192 x = 16 \u2192 younger = 3x = <b>48 years</b>.","d":"Medium"},{"t":"Quantitative","s":"Ratio & Proportion","q":"The present ages of two people are in the ratio 5 : 7. After 6 years the ratio becomes 3 : 4. Find the present age of the younger one.","o":["42 years","48 years","36 years","30 years"],"a":3,"e":"Let the ages be 5x and 7x. Then (5x+6)/(7x+6) = 3/4 \u2192 x = 6 \u2192 younger = 5x = <b>30 years</b>.","d":"Medium"},{"t":"Quantitative","s":"Ratio & Proportion","q":"The present ages of two people are in the ratio 2 : 3. After 6 years the ratio becomes 7 : 9. Find the present age of the younger one.","o":["14 years","8 years","18 years","12 years"],"a":1,"e":"Let the ages be 2x and 3x. Then (2x+6)/(3x+6) = 7/9 \u2192 x = 4 \u2192 younger = 2x = <b>8 years</b>.","d":"Medium"},{"t":"Quantitative","s":"Averages","q":"The average of 9 numbers is 30. If one number, 46, is removed, find the average of the remaining numbers.","o":["24.89","30","31.6","28"],"a":3,"e":"Sum = 9\u00d730 = 270. Remaining sum = 270\u221246 = 224, over 8 numbers \u2192 <b>28</b>.","d":"Medium"},{"t":"Quantitative","s":"Averages","q":"The average of 11 numbers is 25. If one number, 41, is removed, find the average of the remaining numbers.","o":["26.33","25","23.4","21.27"],"a":2,"e":"Sum = 11\u00d725 = 275. Remaining sum = 275\u221241 = 234, over 10 numbers \u2192 <b>23.4</b>.","d":"Medium"},{"t":"Quantitative","s":"Averages","q":"The average of 5 numbers is 30. If one number, 40, is removed, find the average of the remaining numbers.","o":["31.67","30","27.5","22"],"a":2,"e":"Sum = 5\u00d730 = 150. Remaining sum = 150\u221240 = 110, over 4 numbers \u2192 <b>27.5</b>.","d":"Medium"},{"t":"Quantitative","s":"Averages","q":"The average of 7 numbers is 25. If one number, 37, is removed, find the average of the remaining numbers.","o":["19.71","26.5","25","23"],"a":3,"e":"Sum = 7\u00d725 = 175. Remaining sum = 175\u221237 = 138, over 6 numbers \u2192 <b>23</b>.","d":"Medium"},{"t":"Quantitative","s":"Averages","q":"The average of 11 numbers is 30. If one number, 42, is removed, find the average of the remaining numbers.","o":["28.8","31","30","26.18"],"a":0,"e":"Sum = 11\u00d730 = 330. Remaining sum = 330\u221242 = 288, over 10 numbers \u2192 <b>28.8</b>.","d":"Medium"},{"t":"Quantitative","s":"Averages","q":"The average weight of 12 people increases by 2.5 kg when a new person replaces one weighing 65 kg. Find the weight of the new person.","o":["95 kg","30 kg","67.5 kg","35 kg"],"a":0,"e":"Total increase = 12 \u00d7 2.5 = 30 kg, so the new person is 30 kg heavier: 65 + 30 = <b>95 kg</b>.","d":"Medium"},{"t":"Quantitative","s":"Mixtures & Alligation","q":"In what ratio must an item costing \u20b924/kg be mixed with one costing \u20b936/kg to get a mixture worth \u20b926/kg?","o":["1 : 5","5 : 1","24 : 36","1 : 1"],"a":1,"e":"Alligation: cheaper : dearer = (d\u2212m) : (m\u2212c) = (36\u221226) : (26\u221224) = <b>5 : 1</b>.","d":"Medium"},{"t":"Quantitative","s":"Mixtures & Alligation","q":"In what ratio must an item costing \u20b924/kg be mixed with one costing \u20b936/kg to get a mixture worth \u20b932/kg?","o":["24 : 36","1 : 2","1 : 1","2 : 1"],"a":1,"e":"Alligation: cheaper : dearer = (d\u2212m) : (m\u2212c) = (36\u221232) : (32\u221224) = <b>1 : 2</b>.","d":"Medium"},{"t":"Quantitative","s":"Time & Work","q":"20 men complete a work in 12 days. How many men are needed to complete the same work in 8 days?","o":["30 men","28 men","13.33 men","12 men"],"a":0,"e":"Men \u00d7 days is constant: 20\u00d712 = M\u00d78 \u2192 M = <b>30 men</b>.","d":"Easy"},{"t":"Quantitative","s":"Time & Work","q":"15 men complete a work in 18 days. How many men are needed to complete the same work in 6 days?","o":["9 men","5 men","21 men","45 men"],"a":3,"e":"Men \u00d7 days is constant: 15\u00d718 = M\u00d76 \u2192 M = <b>45 men</b>.","d":"Easy"},{"t":"Quantitative","s":"Time & Work","q":"15 men complete a work in 12 days. How many men are needed to complete the same work in 6 days?","o":["9 men","7.5 men","21 men","30 men"],"a":3,"e":"Men \u00d7 days is constant: 15\u00d712 = M\u00d76 \u2192 M = <b>30 men</b>.","d":"Easy"},{"t":"Quantitative","s":"Time & Work","q":"12 men complete a work in 18 days. How many men are needed to complete the same work in 9 days?","o":["24 men","21 men","3 men","6 men"],"a":0,"e":"Men \u00d7 days is constant: 12\u00d718 = M\u00d79 \u2192 M = <b>24 men</b>.","d":"Easy"},{"t":"Quantitative","s":"Time & Work","q":"A is 50% more efficient than B. B alone takes 20 days. How long do they take together?","o":["13.33 days","6.67 days","8 days","10 days"],"a":2,"e":"A is 50% more efficient \u2192 A takes 20/1.5 = 13.33 days. Together = ab/(a+b) = <b>8 days</b>.","d":"Medium"},{"t":"Quantitative","s":"Time, Speed & Distance","q":"Walking at 4 km/h a man reaches his office 10 minutes late; at 5 km/h he arrives 10 minutes early. Find the distance to his office.","o":["13.33 km","6.67 km","9 km","1.33 km"],"a":1,"e":"Time difference = 10+10 = 20 min = 0.33 h. d/4 \u2212 d/5 = 0.33 \u2192 d = <b>6.67 km</b>.","d":"Medium"},{"t":"Quantitative","s":"Time, Speed & Distance","q":"Walking at 5 km/h a man reaches his office 10 minutes late; at 7 km/h he arrives 10 minutes early. Find the distance to his office.","o":["1.67 km","11.67 km","12 km","5.83 km"],"a":3,"e":"Time difference = 10+10 = 20 min = 0.33 h. d/5 \u2212 d/7 = 0.33 \u2192 d = <b>5.83 km</b>.","d":"Medium"},{"t":"Quantitative","s":"Time, Speed & Distance","q":"Two cities are 600 km apart. A car starts from one at 50 km/h and another from the other at 60 km/h, moving towards each other at the same time. After how long do they meet?","o":["10 hrs","5.45 hrs","60 hrs","12 hrs"],"a":1,"e":"Approaching \u2192 add speeds: 50+60 = 110 km/h. Time = 600/110 = <b>5.45 hours</b>.","d":"Easy"},{"t":"Quantitative","s":"Time, Speed & Distance","q":"Two cities are 200 km apart. A car starts from one at 60 km/h and another from the other at 60 km/h, moving towards each other at the same time. After how long do they meet?","o":["3.33 hrs","1.67 hrs","2.5 hrs","1 hrs"],"a":1,"e":"Approaching \u2192 add speeds: 60+60 = 120 km/h. Time = 200/120 = <b>1.67 hours</b>.","d":"Easy"},{"t":"Quantitative","s":"Time, Speed & Distance","q":"Two cities are 600 km apart. A car starts from one at 60 km/h and another from the other at 60 km/h, moving towards each other at the same time. After how long do they meet?","o":["6 hrs","10 hrs","5 hrs","8 hrs"],"a":2,"e":"Approaching \u2192 add speeds: 60+60 = 120 km/h. Time = 600/120 = <b>5 hours</b>.","d":"Easy"},{"t":"Quantitative","s":"Trains","q":"A train 240 m long crosses a pole in 9 seconds. Find its speed in km/h.","o":["7.41 km/h","216 km/h","26.67 km/h","96 km/h"],"a":3,"e":"Crossing a pole covers only the train's length: 240/9 = 26.67 m/s \u2192 \u00d7 18/5 = <b>96 km/h</b>.","d":"Easy"},{"t":"Quantitative","s":"Trains","q":"A train 150 m long travelling at 54 km/h crosses a platform in 20 seconds. Find the length of the platform.","o":["450 m","100 m","150 m","300 m"],"a":2,"e":"54 km/h = 15 m/s. Total distance = 15\u00d720 = 300 m. Platform = 300 \u2212 150 = <b>150 m</b>.","d":"Medium"},{"t":"Quantitative","s":"Trains","q":"A train 240 m long travelling at 54 km/h crosses a platform in 20 seconds. Find the length of the platform.","o":["60 m","540 m","125 m","300 m"],"a":0,"e":"54 km/h = 15 m/s. Total distance = 15\u00d720 = 300 m. Platform = 300 \u2212 240 = <b>60 m</b>.","d":"Medium"},{"t":"Quantitative","s":"Trains","q":"A train 150 m long travelling at 36 km/h crosses a platform in 30 seconds. Find the length of the platform.","o":["150 m","300 m","200 m","450 m"],"a":0,"e":"36 km/h = 10 m/s. Total distance = 10\u00d730 = 300 m. Platform = 300 \u2212 150 = <b>150 m</b>.","d":"Medium"},{"t":"Quantitative","s":"Trains","q":"Two trains 100 m and 150 m long move towards each other at 40 km/h and 50 km/h. How long do they take to cross each other completely?","o":["-90 s","4 s","10 s","2.78 s"],"a":2,"e":"Opposite directions \u2192 relative speed = 40+50 = 90 km/h = 25 m/s. Distance = 100+150 = 250 m \u2192 <b>10 seconds</b>.","d":"Medium"},{"t":"Quantitative","s":"Boats & Streams","q":"A boat's speed in still water is 10 km/h and the stream flows at 3 km/h. How long will it take to travel 30 km downstream?","o":["2.31 hrs","3 hrs","4.29 hrs","10 hrs"],"a":0,"e":"Downstream speed = 10+3 = 13 km/h \u2192 30/13 = <b>2.31 hours</b>.","d":"Easy"},{"t":"Quantitative","s":"Boats & Streams","q":"A boat's speed in still water is 10 km/h and the stream flows at 2 km/h. How long will it take to travel 24 km downstream?","o":["12 hrs","3 hrs","2 hrs","2.4 hrs"],"a":2,"e":"Downstream speed = 10+2 = 12 km/h \u2192 24/12 = <b>2 hours</b>.","d":"Easy"},{"t":"Quantitative","s":"Boats & Streams","q":"A boat's speed in still water is 12 km/h and the stream flows at 3 km/h. How long will it take to travel 36 km downstream?","o":["3 hrs","4 hrs","2.4 hrs","12 hrs"],"a":2,"e":"Downstream speed = 12+3 = 15 km/h \u2192 36/15 = <b>2.4 hours</b>.","d":"Easy"},{"t":"Quantitative","s":"Boats & Streams","q":"A boat's speed in still water is 18 km/h and the stream flows at 3 km/h. How long will it take to travel 24 km downstream?","o":["1.6 hrs","1.33 hrs","8 hrs","1.14 hrs"],"a":3,"e":"Downstream speed = 18+3 = 21 km/h \u2192 24/21 = <b>1.14 hours</b>.","d":"Easy"},{"t":"Quantitative","s":"Number System","q":"Find the unit digit of 8^101.","o":["6","8","4.8","4"],"a":1,"e":"The unit digits of powers of 8 cycle as [8, 4, 2, 6] (length 4). 101 mod 4 = 1 \u2192 <b>8</b>. (Remainder 0 means take the last element.)","d":"Medium"},{"t":"Quantitative","s":"Number System","q":"Find the unit digit of 7^32.","o":["0.8","1","7","0.6"],"a":1,"e":"The unit digits of powers of 7 cycle as [7, 9, 3, 1] (length 4). 32 mod 4 = 0 \u2192 <b>1</b>. (Remainder 0 means take the last element.)","d":"Medium"},{"t":"Quantitative","s":"Number System","q":"Find the unit digit of 3^107.","o":["1","3","7","9"],"a":2,"e":"The unit digits of powers of 3 cycle as [3, 9, 7, 1] (length 4). 107 mod 4 = 3 \u2192 <b>7</b>. (Remainder 0 means take the last element.)","d":"Medium"},{"t":"Quantitative","s":"Number System","q":"Find the unit digit of 8^99.","o":["6","2","2.5","8"],"a":1,"e":"The unit digits of powers of 8 cycle as [8, 4, 2, 6] (length 4). 99 mod 4 = 3 \u2192 <b>2</b>. (Remainder 0 means take the last element.)","d":"Medium"},{"t":"Quantitative","s":"Number System","q":"Find the unit digit of 7^70.","o":["14","9","7","3"],"a":1,"e":"The unit digits of powers of 7 cycle as [7, 9, 3, 1] (length 4). 70 mod 4 = 2 \u2192 <b>9</b>. (Remainder 0 means take the last element.)","d":"Medium"},{"t":"Quantitative","s":"Number System","q":"Find the unit digit of 3^29.","o":["3","6","1.5","9"],"a":0,"e":"The unit digits of powers of 3 cycle as [3, 9, 7, 1] (length 4). 29 mod 4 = 1 \u2192 <b>3</b>. (Remainder 0 means take the last element.)","d":"Medium"},{"t":"Quantitative","s":"Number System","q":"Find the unit digit of 3^48.","o":["1.25","3","0.8","1"],"a":3,"e":"The unit digits of powers of 3 cycle as [3, 9, 7, 1] (length 4). 48 mod 4 = 0 \u2192 <b>1</b>. (Remainder 0 means take the last element.)","d":"Medium"},{"t":"Quantitative","s":"Number System","q":"Find the unit digit of 8^65.","o":["8","16","10","4"],"a":0,"e":"The unit digits of powers of 8 cycle as [8, 4, 2, 6] (length 4). 65 mod 4 = 1 \u2192 <b>8</b>. (Remainder 0 means take the last element.)","d":"Medium"},{"t":"Quantitative","s":"Number System","q":"Find the unit digit of 9^71.","o":["1","11","5","9"],"a":3,"e":"The unit digits of powers of 9 cycle as [9, 1] (length 2). 71 mod 2 = 1 \u2192 <b>9</b>. (Remainder 0 means take the last element.)","d":"Medium"},{"t":"Quantitative","s":"Number System","q":"Find the remainder when 3^25 is divided by 7.","o":["3","4","1","1.8"],"a":0,"e":"Find the smallest power of 3 that leaves remainder 1 mod 7, then reduce the exponent. Result: <b>3</b>.","d":"Hard"},{"t":"Quantitative","s":"Number System","q":"Find the remainder when 5^73 is divided by 7.","o":["5","3.75","1","6"],"a":0,"e":"Find the smallest power of 5 that leaves remainder 1 mod 7, then reduce the exponent. Result: <b>5</b>.","d":"Hard"},{"t":"Quantitative","s":"Number System","q":"Find the remainder when 2^26 is divided by 5.","o":["0","1","4","2"],"a":2,"e":"Find the smallest power of 2 that leaves remainder 1 mod 5, then reduce the exponent. Result: <b>4</b>.","d":"Hard"},{"t":"Quantitative","s":"Number System","q":"Find the remainder when 5^67 is divided by 7.","o":["3.75","1","5","6"],"a":2,"e":"Find the smallest power of 5 that leaves remainder 1 mod 7, then reduce the exponent. Result: <b>5</b>.","d":"Hard"},{"t":"Quantitative","s":"Number System","q":"Find the remainder when 2^90 is divided by 7.","o":["1.5","0.5","2","1"],"a":3,"e":"Find the smallest power of 2 that leaves remainder 1 mod 7, then reduce the exponent. Result: <b>1</b>.","d":"Hard"},{"t":"Quantitative","s":"Number System","q":"Find the remainder when 5^79 is divided by 7.","o":["6","3","5","1"],"a":2,"e":"Find the smallest power of 5 that leaves remainder 1 mod 7, then reduce the exponent. Result: <b>5</b>.","d":"Hard"},{"t":"Quantitative","s":"Progressions","q":"Find the sum of the first 15 natural numbers.","o":["240","225","60","120"],"a":3,"e":"Formula: n(n+1)/2 with n = 15 \u2192 <b>120</b>.","d":"Medium"},{"t":"Quantitative","s":"Progressions","q":"Find the sum of the first 10 terms of the AP 5, 7, 9, \u2026","o":["23","280","140","70"],"a":2,"e":"Last term = 5+(10\u22121)\u00d72 = 23. Sum = n/2 \u00d7 (first + last) = 10/2 \u00d7 (5+23) = <b>140</b>.","d":"Medium"},{"t":"Quantitative","s":"Progressions","q":"Find the sum of the first 15 terms of the AP 3, 5, 7, \u2026","o":["31","127","510","255"],"a":3,"e":"Last term = 3+(15\u22121)\u00d72 = 31. Sum = n/2 \u00d7 (first + last) = 15/2 \u00d7 (3+31) = <b>255</b>.","d":"Medium"},{"t":"Quantitative","s":"Progressions","q":"Find the sum of the first 15 terms of the AP 7, 11, 15, \u2026","o":["525","262","1050","63"],"a":0,"e":"Last term = 7+(15\u22121)\u00d74 = 63. Sum = n/2 \u00d7 (first + last) = 15/2 \u00d7 (7+63) = <b>525</b>.","d":"Medium"},{"t":"Quantitative","s":"Permutations & Combinations","q":"In how many ways can 3 people be arranged in a row from a group of 5?","o":["120","125","10","60"],"a":3,"e":"Order matters \u2192 permutation. P(5,3) = 5!/(5\u22123)! = <b>60</b>.","d":"Easy"},{"t":"Quantitative","s":"Permutations & Combinations","q":"From 5 men and 4 women, in how many ways can a committee of 3 men and 2 women be formed?","o":["126","16","120","60"],"a":3,"e":"Choose independently and multiply: C(5,3) \u00d7 C(4,2) = 10 \u00d7 6 = <b>60</b>.","d":"Medium"},{"t":"Logical Reasoning","s":"Clocks","q":"Find the angle between the hands of a clock at 4:10.","o":["50\u00b0","60\u00b0","65\u00b0","120\u00b0"],"a":2,"e":"Angle = |30H \u2212 5.5M| = |30\u00d74 \u2212 5.5\u00d710| = 65\u00b0 \u2192 <b>65\u00b0</b>.","d":"Medium"},{"t":"Logical Reasoning","s":"Clocks","q":"Find the angle between the hands of a clock at 9:30.","o":["180\u00b0","85\u00b0","105\u00b0","270\u00b0"],"a":2,"e":"Angle = |30H \u2212 5.5M| = |30\u00d79 \u2212 5.5\u00d730| = 105\u00b0 \u2192 <b>105\u00b0</b>.","d":"Medium"},{"t":"Logical Reasoning","s":"Clocks","q":"Find the angle between the hands of a clock at 5:15.","o":["150\u00b0","90\u00b0","125\u00b0","67.5\u00b0"],"a":3,"e":"Angle = |30H \u2212 5.5M| = |30\u00d75 \u2212 5.5\u00d715| = 67.5\u00b0 \u2192 <b>67.5\u00b0</b>.","d":"Medium"},{"t":"Logical Reasoning","s":"Clocks","q":"Find the angle between the hands of a clock at 6:30.","o":["9\u00b0","180\u00b0","8\u00b0","15\u00b0"],"a":3,"e":"Angle = |30H \u2212 5.5M| = |30\u00d76 \u2212 5.5\u00d730| = 15\u00b0 \u2192 <b>15\u00b0</b>.","d":"Medium"},{"t":"Logical Reasoning","s":"Clocks","q":"Find the angle between the hands of a clock at 6:10.","o":["250\u00b0","125\u00b0","180\u00b0","60\u00b0"],"a":1,"e":"Angle = |30H \u2212 5.5M| = |30\u00d76 \u2212 5.5\u00d710| = 125\u00b0 \u2192 <b>125\u00b0</b>.","d":"Medium"},{"t":"Logical Reasoning","s":"Calendars","q":"If 1 January 2025 was a Tuesday, what day was 1 January 2026? (2025 is an ordinary year.)","o":["Tuesday","Wednesday","Friday","Thursday"],"a":1,"e":"An ordinary year has 365 days = 1 odd day. Tuesday + 1 = <b>Wednesday</b>.","d":"Medium"},{"t":"Logical Reasoning","s":"Calendars","q":"If 1 January 2028 was a Friday, what day was 1 January 2029? (2028 is a leap year.)","o":["Saturday","Friday","Monday","Sunday"],"a":3,"e":"A leap year has 366 days = 2 odd days. Friday + 2 = <b>Sunday</b>.","d":"Medium"},{"t":"Quantitative","s":"Percentages","q":"Find 25% of 240.","o":["9.6","60","6","84"],"a":1,"e":"25% of 240 = 240 \u00d7 25/100 = <b>60</b>. Faster: 25% = 1/4 of the number.","d":"Easy"},{"t":"Quantitative","s":"Percentages","q":"Find 25% of 800.","o":["32","200","280","20"],"a":1,"e":"25% of 800 = 800 \u00d7 25/100 = <b>200</b>. Faster: 25% = 1/4 of the number.","d":"Easy"},{"t":"Quantitative","s":"Percentages","q":"Find 75% of 640.","o":["480","544","48","8.53"],"a":0,"e":"75% of 640 = 640 \u00d7 75/100 = <b>480</b>. Faster: 75% = 3/4 of the number.","d":"Easy"},{"t":"Quantitative","s":"Percentages","q":"Find 62.5% of 640.","o":["464","400","40","10.24"],"a":1,"e":"62.5% of 640 = 640 \u00d7 62.5/100 = <b>400</b>. Faster: 62.5% = 5/8 of the number.","d":"Easy"},{"t":"Quantitative","s":"Percentages","q":"A number is increased by 30% and then decreased by 20%. Find the net percentage change.","o":["44%","10%","4%","-10%"],"a":2,"e":"Successive change = a + b + ab/100 with b negative: 30 \u2212 20 \u2212 (30\u00d720)/100 = <b>4%</b> (increase). The naive answer 10% ignores the cross term.","d":"Medium"},{"t":"Quantitative","s":"Percentages","q":"A number is increased by 30% and then decreased by 10%. Find the net percentage change.","o":["37%","-20%","20%","17%"],"a":3,"e":"Successive change = a + b + ab/100 with b negative: 30 \u2212 10 \u2212 (30\u00d710)/100 = <b>17%</b> (increase). The naive answer 20% ignores the cross term.","d":"Medium"},{"t":"Quantitative","s":"Percentages","q":"A number is increased by 10% and then decreased by 25%. Find the net percentage change.","o":["32.5%","-17.5%","-15%","15%"],"a":1,"e":"Successive change = a + b + ab/100 with b negative: 10 \u2212 25 \u2212 (10\u00d725)/100 = <b>-17.5%</b> (decrease). The naive answer -15% ignores the cross term.","d":"Medium"},{"t":"Quantitative","s":"Percentages","q":"In a two-candidate election the winner got 70% of the votes and won by 1200 votes. Find the total number of votes.","o":["1714.29","3000","2400","4000"],"a":1,"e":"Margin = 70% \u2212 30% = 40% of total = 1200 \u2192 total = 1200 \u00d7 100/40 = <b>3000</b>.","d":"Medium"},{"t":"Quantitative","s":"Percentages","q":"In an exam 40% failed in Maths, 50% failed in English and 20% failed in both. What percent passed in both subjects?","o":["80%","70%","10%","30%"],"a":3,"e":"Failed in at least one = 40 + 50 \u2212 20 = 70%. Passed in both = 100 \u2212 70 = <b>30%</b>. Subtract the overlap or you double-count.","d":"Medium"},{"t":"Quantitative","s":"Profit & Loss","q":"An article costing \u20b91200 is sold at a profit of 40%. Find the selling price.","o":["1680","480","1240","720"],"a":0,"e":"SP = CP(100+P)/100 = 1200 \u00d7 140/100 = <b>\u20b91680</b>.","d":"Easy"},{"t":"Quantitative","s":"Profit & Loss","q":"An article costing \u20b9250 is sold at a profit of 25%. Find the selling price.","o":["62.5","275","312.5","187.5"],"a":2,"e":"SP = CP(100+P)/100 = 250 \u00d7 125/100 = <b>\u20b9312.5</b>.","d":"Easy"},{"t":"Quantitative","s":"Profit & Loss","q":"An article costing \u20b9250 is sold at a profit of 15%. Find the selling price.","o":["212.5","37.5","287.5","265"],"a":2,"e":"SP = CP(100+P)/100 = 250 \u00d7 115/100 = <b>\u20b9287.5</b>.","d":"Easy"},{"t":"Quantitative","s":"Profit & Loss","q":"An article costing \u20b9400 is sold at a profit of 15%. Find the selling price.","o":["415","460","60","340"],"a":1,"e":"SP = CP(100+P)/100 = 400 \u00d7 115/100 = <b>\u20b9460</b>.","d":"Easy"},{"t":"Quantitative","s":"Profit & Loss","q":"An article bought for \u20b9400 is sold for \u20b9500. Find the profit percentage.","o":["11.11%","20%","25%","100%"],"a":2,"e":"Profit% = (SP\u2212CP)/CP \u00d7 100 = 100/400 \u00d7 100 = <b>25%</b>. Profit is always on COST price, never on SP.","d":"Easy"},{"t":"Quantitative","s":"Profit & Loss","q":"An article bought for \u20b9300 is sold for \u20b9400. Find the profit percentage.","o":["33.33%","25%","100%","14.29%"],"a":0,"e":"Profit% = (SP\u2212CP)/CP \u00d7 100 = 100/300 \u00d7 100 = <b>33.33%</b>. Profit is always on COST price, never on SP.","d":"Easy"},{"t":"Quantitative","s":"Profit & Loss","q":"The cost price of 10 articles equals the selling price of 8 articles. Find the profit percentage.","o":["2%","225%","20%","25%"],"a":3,"e":"Profit% = (m\u2212n)/n \u00d7 100 = (10\u22128)/8 \u00d7 100 = <b>25%</b>.","d":"Medium"},{"t":"Quantitative","s":"Simple & Compound Interest","q":"Find the simple interest on \u20b95000 at 12% per annum for 3 years.","o":["600","6800","1800","180"],"a":2,"e":"SI = PRT/100 = 5000\u00d712\u00d73/100 = <b>\u20b91800</b>.","d":"Easy"},{"t":"Quantitative","s":"Simple & Compound Interest","q":"Find the simple interest on \u20b94000 at 5% per annum for 2 years.","o":["200","4400","400","40"],"a":2,"e":"SI = PRT/100 = 4000\u00d75\u00d72/100 = <b>\u20b9400</b>.","d":"Easy"},{"t":"Quantitative","s":"Simple & Compound Interest","q":"Find the simple interest on \u20b94000 at 10% per annum for 3 years.","o":["120","5200","400","1200"],"a":3,"e":"SI = PRT/100 = 4000\u00d710\u00d73/100 = <b>\u20b91200</b>.","d":"Easy"},{"t":"Quantitative","s":"Simple & Compound Interest","q":"Find the simple interest on \u20b95000 at 10% per annum for 2 years.","o":["1000","100","500","6000"],"a":0,"e":"SI = PRT/100 = 5000\u00d710\u00d72/100 = <b>\u20b91000</b>.","d":"Easy"},{"t":"Quantitative","s":"Simple & Compound Interest","q":"Find the compound interest on \u20b910000 at 10% per annum for 2 years.","o":["12100","4200","2100","2000"],"a":2,"e":"A = P(1+R/100)\u00b2 = 10000 \u00d7 1.21 = 12100; CI = A \u2212 P = <b>\u20b92100</b>. (SI would be only \u20b92000.)","d":"Medium"},{"t":"Quantitative","s":"Simple & Compound Interest","q":"A sum doubles in 6 years at compound interest. In how many years will it become 4 times itself?","o":["10 years","15 years","12 years","24 years"],"a":2,"e":"4 = 2^2, so it needs 2 doubling periods \u2192 2 \u00d7 6 = <b>12 years</b>. At CI growth is multiplicative, not linear.","d":"Medium"},{"t":"Quantitative","s":"Ratio & Proportion","q":"\u20b93000 is divided among A, B and C in the ratio 2 : 5 : 8. Find C's share.","o":["1000","400","1600","800"],"a":2,"e":"Total parts = 15. C gets 8/15 \u00d7 3000 = <b>\u20b91600</b>.","d":"Easy"},{"t":"Quantitative","s":"Ratio & Proportion","q":"The present ages of two people are in the ratio 2 : 3. After 6 years the ratio becomes 5 : 6. Find the present age of the younger one.","o":["12 years","6 years","10 years","4 years"],"a":3,"e":"Let the ages be 2x and 3x. Then (2x+6)/(3x+6) = 5/6 \u2192 x = 2 \u2192 younger = 2x = <b>4 years</b>.","d":"Medium"},{"t":"Quantitative","s":"Averages","q":"The average of 5 numbers is 25. If one number, 33, is removed, find the average of the remaining numbers.","o":["18.4","23","25","26.33"],"a":1,"e":"Sum = 5\u00d725 = 125. Remaining sum = 125\u221233 = 92, over 4 numbers \u2192 <b>23</b>.","d":"Medium"},{"t":"Quantitative","s":"Averages","q":"The average of 11 numbers is 20. If one number, 28, is removed, find the average of the remaining numbers.","o":["19.2","20","17.45","20.67"],"a":0,"e":"Sum = 11\u00d720 = 220. Remaining sum = 220\u221228 = 192, over 10 numbers \u2192 <b>19.2</b>.","d":"Medium"},{"t":"Quantitative","s":"Averages","q":"The average of 11 numbers is 20. If one number, 32, is removed, find the average of the remaining numbers.","o":["17.09","20","18.8","21"],"a":2,"e":"Sum = 11\u00d720 = 220. Remaining sum = 220\u221232 = 188, over 10 numbers \u2192 <b>18.8</b>.","d":"Medium"},{"t":"Quantitative","s":"Averages","q":"The average of 5 numbers is 40. If one number, 56, is removed, find the average of the remaining numbers.","o":["28.8","40","36","42.67"],"a":2,"e":"Sum = 5\u00d740 = 200. Remaining sum = 200\u221256 = 144, over 4 numbers \u2192 <b>36</b>.","d":"Medium"},{"t":"Quantitative","s":"Averages","q":"The average of 9 numbers is 20. If one number, 30, is removed, find the average of the remaining numbers.","o":["21","18.75","16.67","20"],"a":1,"e":"Sum = 9\u00d720 = 180. Remaining sum = 180\u221230 = 150, over 8 numbers \u2192 <b>18.75</b>.","d":"Medium"},{"t":"Quantitative","s":"Averages","q":"The average weight of 10 people increases by 3 kg when a new person replaces one weighing 55 kg. Find the weight of the new person.","o":["25 kg","30 kg","58 kg","85 kg"],"a":3,"e":"Total increase = 10 \u00d7 3 = 30 kg, so the new person is 30 kg heavier: 55 + 30 = <b>85 kg</b>.","d":"Medium"},{"t":"Quantitative","s":"Averages","q":"The average weight of 8 people increases by 2.5 kg when a new person replaces one weighing 60 kg. Find the weight of the new person.","o":["40 kg","80 kg","62.5 kg","20 kg"],"a":1,"e":"Total increase = 8 \u00d7 2.5 = 20 kg, so the new person is 20 kg heavier: 60 + 20 = <b>80 kg</b>.","d":"Medium"},{"t":"Quantitative","s":"Averages","q":"The average weight of 10 people increases by 2 kg when a new person replaces one weighing 55 kg. Find the weight of the new person.","o":["75 kg","35 kg","20 kg","57 kg"],"a":0,"e":"Total increase = 10 \u00d7 2 = 20 kg, so the new person is 20 kg heavier: 55 + 20 = <b>75 kg</b>.","d":"Medium"},{"t":"Quantitative","s":"Time & Work","q":"12 men complete a work in 18 days. How many men are needed to complete the same work in 6 days?","o":["6 men","36 men","4 men","18 men"],"a":1,"e":"Men \u00d7 days is constant: 12\u00d718 = M\u00d76 \u2192 M = <b>36 men</b>.","d":"Easy"},{"t":"Quantitative","s":"Time & Work","q":"20 men complete a work in 18 days. How many men are needed to complete the same work in 6 days?","o":["60 men","14 men","6.67 men","26 men"],"a":0,"e":"Men \u00d7 days is constant: 20\u00d718 = M\u00d76 \u2192 M = <b>60 men</b>.","d":"Easy"},{"t":"Quantitative","s":"Time & Work","q":"24 men complete a work in 18 days. How many men are needed to complete the same work in 9 days?","o":["33 men","48 men","15 men","12 men"],"a":1,"e":"Men \u00d7 days is constant: 24\u00d718 = M\u00d79 \u2192 M = <b>48 men</b>.","d":"Easy"},{"t":"Quantitative","s":"Time & Work","q":"24 men complete a work in 18 days. How many men are needed to complete the same work in 8 days?","o":["16 men","10.67 men","54 men","32 men"],"a":2,"e":"Men \u00d7 days is constant: 24\u00d718 = M\u00d78 \u2192 M = <b>54 men</b>.","d":"Easy"},{"t":"Quantitative","s":"Time, Speed & Distance","q":"Walking at 4 km/h a man reaches his office 20 minutes late; at 5 km/h he arrives 10 minutes early. Find the distance to his office.","o":["20 km","9 km","10 km","2 km"],"a":2,"e":"Time difference = 20+10 = 30 min = 0.5 h. d/4 \u2212 d/5 = 0.5 \u2192 d = <b>10 km</b>.","d":"Medium"},{"t":"Quantitative","s":"Time, Speed & Distance","q":"Two cities are 300 km apart. A car starts from one at 60 km/h and another from the other at 40 km/h, moving towards each other at the same time. After how long do they meet?","o":["15 hrs","7.5 hrs","5 hrs","3 hrs"],"a":3,"e":"Approaching \u2192 add speeds: 60+40 = 100 km/h. Time = 300/100 = <b>3 hours</b>.","d":"Easy"},{"t":"Quantitative","s":"Time, Speed & Distance","q":"Two cities are 600 km apart. A car starts from one at 40 km/h and another from the other at 30 km/h, moving towards each other at the same time. After how long do they meet?","o":["15 hrs","20 hrs","60 hrs","8.57 hrs"],"a":3,"e":"Approaching \u2192 add speeds: 40+30 = 70 km/h. Time = 600/70 = <b>8.57 hours</b>.","d":"Easy"},{"t":"Quantitative","s":"Time, Speed & Distance","q":"Two cities are 200 km apart. A car starts from one at 50 km/h and another from the other at 30 km/h, moving towards each other at the same time. After how long do they meet?","o":["2.5 hrs","4 hrs","10 hrs","6.67 hrs"],"a":0,"e":"Approaching \u2192 add speeds: 50+30 = 80 km/h. Time = 200/80 = <b>2.5 hours</b>.","d":"Easy"},{"t":"Quantitative","s":"Time, Speed & Distance","q":"Two cities are 300 km apart. A car starts from one at 50 km/h and another from the other at 30 km/h, moving towards each other at the same time. After how long do they meet?","o":["3.75 hrs","15 hrs","10 hrs","6 hrs"],"a":0,"e":"Approaching \u2192 add speeds: 50+30 = 80 km/h. Time = 300/80 = <b>3.75 hours</b>.","d":"Easy"},{"t":"Quantitative","s":"Trains","q":"A train 240 m long travelling at 36 km/h crosses a platform in 30 seconds. Find the length of the platform.","o":["60 m","540 m","300 m","35 m"],"a":0,"e":"36 km/h = 10 m/s. Total distance = 10\u00d730 = 300 m. Platform = 300 \u2212 240 = <b>60 m</b>.","d":"Medium"},{"t":"Quantitative","s":"Trains","q":"A train 200 m long travelling at 72 km/h crosses a platform in 25 seconds. Find the length of the platform.","o":["500 m","600 m","300 m","700 m"],"a":2,"e":"72 km/h = 20 m/s. Total distance = 20\u00d725 = 500 m. Platform = 500 \u2212 200 = <b>300 m</b>.","d":"Medium"},{"t":"Quantitative","s":"Boats & Streams","q":"A boat's speed in still water is 15 km/h and the stream flows at 3 km/h. How long will it take to travel 45 km downstream?","o":["3 hrs","2.5 hrs","15 hrs","3.75 hrs"],"a":1,"e":"Downstream speed = 15+3 = 18 km/h \u2192 45/18 = <b>2.5 hours</b>.","d":"Easy"},{"t":"Quantitative","s":"Boats & Streams","q":"A boat's speed in still water is 12 km/h and the stream flows at 4 km/h. How long will it take to travel 36 km downstream?","o":["9 hrs","2.25 hrs","3 hrs","4.5 hrs"],"a":1,"e":"Downstream speed = 12+4 = 16 km/h \u2192 36/16 = <b>2.25 hours</b>.","d":"Easy"},{"t":"Quantitative","s":"Boats & Streams","q":"A boat's speed in still water is 18 km/h and the stream flows at 4 km/h. How long will it take to travel 24 km downstream?","o":["1.71 hrs","1.33 hrs","6 hrs","1.09 hrs"],"a":3,"e":"Downstream speed = 18+4 = 22 km/h \u2192 24/22 = <b>1.09 hours</b>.","d":"Easy"},{"t":"Quantitative","s":"Boats & Streams","q":"A boat's speed in still water is 10 km/h and the stream flows at 2 km/h. How long will it take to travel 36 km downstream?","o":["4.5 hrs","3.6 hrs","18 hrs","3 hrs"],"a":3,"e":"Downstream speed = 10+2 = 12 km/h \u2192 36/12 = <b>3 hours</b>.","d":"Easy"},{"t":"Quantitative","s":"Number System","q":"Find the unit digit of 3^75.","o":["1","3","5","7"],"a":3,"e":"The unit digits of powers of 3 cycle as [3, 9, 7, 1] (length 4). 75 mod 4 = 3 \u2192 <b>7</b>. (Remainder 0 means take the last element.)","d":"Medium"},{"t":"Quantitative","s":"Number System","q":"Find the unit digit of 7^34.","o":["9","4.5","3","7"],"a":0,"e":"The unit digits of powers of 7 cycle as [7, 9, 3, 1] (length 4). 34 mod 4 = 2 \u2192 <b>9</b>. (Remainder 0 means take the last element.)","d":"Medium"},{"t":"Quantitative","s":"Number System","q":"Find the unit digit of 8^75.","o":["6","8","1","2"],"a":3,"e":"The unit digits of powers of 8 cycle as [8, 4, 2, 6] (length 4). 75 mod 4 = 3 \u2192 <b>2</b>. (Remainder 0 means take the last element.)","d":"Medium"},{"t":"Quantitative","s":"Number System","q":"Find the unit digit of 3^44.","o":["1","0.8","3","1.5"],"a":0,"e":"The unit digits of powers of 3 cycle as [3, 9, 7, 1] (length 4). 44 mod 4 = 0 \u2192 <b>1</b>. (Remainder 0 means take the last element.)","d":"Medium"},{"t":"Quantitative","s":"Number System","q":"Find the unit digit of 4^59.","o":["2.4","6","5","4"],"a":3,"e":"The unit digits of powers of 4 cycle as [4, 6] (length 2). 59 mod 2 = 1 \u2192 <b>4</b>. (Remainder 0 means take the last element.)","d":"Medium"},{"t":"Quantitative","s":"Number System","q":"Find the unit digit of 3^32.","o":["1","3","0.8","0.6"],"a":0,"e":"The unit digits of powers of 3 cycle as [3, 9, 7, 1] (length 4). 32 mod 4 = 0 \u2192 <b>1</b>. (Remainder 0 means take the last element.)","d":"Medium"},{"t":"Quantitative","s":"Number System","q":"Find the unit digit of 8^44.","o":["9","8","6","7"],"a":2,"e":"The unit digits of powers of 8 cycle as [8, 4, 2, 6] (length 4). 44 mod 4 = 0 \u2192 <b>6</b>. (Remainder 0 means take the last element.)","d":"Medium"},{"t":"Quantitative","s":"Number System","q":"Find the unit digit of 4^117.","o":["6","5","4","4.8"],"a":2,"e":"The unit digits of powers of 4 cycle as [4, 6] (length 2). 117 mod 2 = 1 \u2192 <b>4</b>. (Remainder 0 means take the last element.)","d":"Medium"},{"t":"Quantitative","s":"Number System","q":"Find the remainder when 3^88 is divided by 7.","o":["5","3","1","4"],"a":3,"e":"Find the smallest power of 3 that leaves remainder 1 mod 7, then reduce the exponent. Result: <b>4</b>.","d":"Hard"},{"t":"Quantitative","s":"Number System","q":"Find the remainder when 2^40 is divided by 7.","o":["1","1.6","2","3"],"a":2,"e":"Find the smallest power of 2 that leaves remainder 1 mod 7, then reduce the exponent. Result: <b>2</b>.","d":"Hard"},{"t":"Quantitative","s":"Number System","q":"Find the remainder when 2^39 is divided by 5.","o":["4","3","2","1"],"a":1,"e":"Find the smallest power of 2 that leaves remainder 1 mod 5, then reduce the exponent. Result: <b>3</b>.","d":"Hard"},{"t":"Quantitative","s":"Number System","q":"Find the remainder when 2^58 is divided by 5.","o":["0","4","2","1"],"a":1,"e":"Find the smallest power of 2 that leaves remainder 1 mod 5, then reduce the exponent. Result: <b>4</b>.","d":"Hard"},{"t":"Quantitative","s":"Number System","q":"Find the remainder when 3^20 is divided by 5.","o":["0.75","3","1","2"],"a":2,"e":"Find the smallest power of 3 that leaves remainder 1 mod 5, then reduce the exponent. Result: <b>1</b>.","d":"Hard"},{"t":"Quantitative","s":"Number System","q":"Find the remainder when 3^32 is divided by 5.","o":["1","3","0.5","2"],"a":0,"e":"Find the smallest power of 3 that leaves remainder 1 mod 5, then reduce the exponent. Result: <b>1</b>.","d":"Hard"},{"t":"Quantitative","s":"Progressions","q":"Find the sum of the squares of the first 10 natural numbers.","o":["385","192","770","100"],"a":0,"e":"Formula: n(n+1)(2n+1)/6 with n = 10 \u2192 <b>385</b>.","d":"Medium"},{"t":"Quantitative","s":"Progressions","q":"Find the sum of the squares of the first 25 natural numbers.","o":["625","2762","5525","11050"],"a":2,"e":"Formula: n(n+1)(2n+1)/6 with n = 25 \u2192 <b>5525</b>.","d":"Medium"},{"t":"Quantitative","s":"Progressions","q":"Find the sum of the first 10 terms of the AP 3, 7, 11, \u2026","o":["420","39","210","105"],"a":2,"e":"Last term = 3+(10\u22121)\u00d74 = 39. Sum = n/2 \u00d7 (first + last) = 10/2 \u00d7 (3+39) = <b>210</b>.","d":"Medium"},{"t":"Quantitative","s":"Progressions","q":"Find the sum of the first 15 terms of the AP 5, 10, 15, \u2026","o":["1200","600","75","300"],"a":1,"e":"Last term = 5+(15\u22121)\u00d75 = 75. Sum = n/2 \u00d7 (first + last) = 15/2 \u00d7 (5+75) = <b>600</b>.","d":"Medium"},{"t":"Quantitative","s":"Progressions","q":"Find the sum of the first 10 terms of the AP 7, 9, 11, \u2026","o":["80","25","160","320"],"a":2,"e":"Last term = 7+(10\u22121)\u00d72 = 25. Sum = n/2 \u00d7 (first + last) = 10/2 \u00d7 (7+25) = <b>160</b>.","d":"Medium"},{"t":"Quantitative","s":"Permutations & Combinations","q":"In how many ways can 4 people be selected from a group of 9?","o":["36","84","126","3024"],"a":2,"e":"Order does not matter \u2192 combination. C(9,4) = <b>126</b>. (If order mattered it would be P(9,4) = 3024.)","d":"Easy"},{"t":"Quantitative","s":"Permutations & Combinations","q":"From 5 men and 4 women, in how many ways can a committee of 2 men and 3 women be formed?","o":["14","80","126","40"],"a":3,"e":"Choose independently and multiply: C(5,2) \u00d7 C(4,3) = 10 \u00d7 4 = <b>40</b>.","d":"Medium"},{"t":"Logical Reasoning","s":"Clocks","q":"Find the angle between the hands of a clock at 4:30.","o":["120\u00b0","45\u00b0","70\u00b0","180\u00b0"],"a":1,"e":"Angle = |30H \u2212 5.5M| = |30\u00d74 \u2212 5.5\u00d730| = 45\u00b0 \u2192 <b>45\u00b0</b>.","d":"Medium"},{"t":"Logical Reasoning","s":"Clocks","q":"Find the angle between the hands of a clock at 6:40.","o":["180\u00b0","40\u00b0","25\u00b0","240\u00b0"],"a":1,"e":"Angle = |30H \u2212 5.5M| = |30\u00d76 \u2212 5.5\u00d740| = 40\u00b0 \u2192 <b>40\u00b0</b>.","d":"Medium"},{"t":"Logical Reasoning","s":"Clocks","q":"Find the angle between the hands of a clock at 9:25.","o":["80\u00b0","270\u00b0","150\u00b0","132.5\u00b0"],"a":3,"e":"Angle = |30H \u2212 5.5M| = |30\u00d79 \u2212 5.5\u00d725| = 132.5\u00b0 \u2192 <b>132.5\u00b0</b>.","d":"Medium"},{"t":"Logical Reasoning","s":"Clocks","q":"Find the angle between the hands of a clock at 12:30.","o":["165\u00b0","360\u00b0","180\u00b0","15\u00b0"],"a":0,"e":"Angle = |30H \u2212 5.5M| = |30\u00d712 \u2212 5.5\u00d730| = 195\u00b0, and since this exceeds 180\u00b0 we take 360 \u2212 195 \u2192 <b>165\u00b0</b>.","d":"Medium"},{"t":"Logical Reasoning","s":"Clocks","q":"Find the angle between the hands of a clock at 7:50.","o":["65\u00b0","210\u00b0","300\u00b0","50\u00b0"],"a":0,"e":"Angle = |30H \u2212 5.5M| = |30\u00d77 \u2212 5.5\u00d750| = 65\u00b0 \u2192 <b>65\u00b0</b>.","d":"Medium"},{"t":"Logical Reasoning","s":"Cubes","q":"A cube is painted on all faces and then cut into 125 equal smaller cubes. How many smaller cubes have no face(s) painted?","o":["14","36","27","8"],"a":2,"e":"With n = 5 per edge: (n\u22122)\u00b3 = <b>27</b>. (Corners = 8 always, edges = 12(n\u22122), faces = 6(n\u22122)\u00b2, interior = (n\u22122)\u00b3.)","d":"Medium"},{"t":"Logical Reasoning","s":"Calendars","q":"If 1 January 2026 was a Wednesday, what day was 1 January 2027? (2026 is an ordinary year.)","o":["Friday","Saturday","Thursday","Wednesday"],"a":2,"e":"An ordinary year has 365 days = 1 odd day. Wednesday + 1 = <b>Thursday</b>.","d":"Medium"},{"t":"Quantitative","s":"Percentages","q":"Find 15% of 960.","o":["144","240","14.4","64"],"a":0,"e":"15% of 960 = 960 \u00d7 15/100 = <b>144</b>. Faster: 15% = 3/20 of the number.","d":"Easy"},{"t":"Quantitative","s":"Percentages","q":"Find 20% of 240.","o":["48","4.8","72","12"],"a":0,"e":"20% of 240 = 240 \u00d7 20/100 = <b>48</b>. Faster: 20% = 1/5 of the number.","d":"Easy"},{"t":"Quantitative","s":"Percentages","q":"In an exam 40% failed in Maths, 45% failed in English and 20% failed in both. What percent passed in both subjects?","o":["80%","15%","65%","35%"],"a":3,"e":"Failed in at least one = 40 + 45 \u2212 20 = 65%. Passed in both = 100 \u2212 65 = <b>35%</b>. Subtract the overlap or you double-count.","d":"Medium"},{"t":"Quantitative","s":"Profit & Loss","q":"An article costing \u20b9200 is sold at a profit of 20%. Find the selling price.","o":["240","40","220","160"],"a":0,"e":"SP = CP(100+P)/100 = 200 \u00d7 120/100 = <b>\u20b9240</b>.","d":"Easy"},{"t":"Quantitative","s":"Profit & Loss","q":"An article costing \u20b9200 is sold at a profit of 40%. Find the selling price.","o":["120","280","80","240"],"a":1,"e":"SP = CP(100+P)/100 = 200 \u00d7 140/100 = <b>\u20b9280</b>.","d":"Easy"},{"t":"Quantitative","s":"Profit & Loss","q":"An article costing \u20b9500 is sold at a profit of 10%. Find the selling price.","o":["450","50","510","550"],"a":3,"e":"SP = CP(100+P)/100 = 500 \u00d7 110/100 = <b>\u20b9550</b>.","d":"Easy"},{"t":"Quantitative","s":"Simple & Compound Interest","q":"Find the simple interest on \u20b912000 at 8% per annum for 4 years.","o":["960","3840","384","15840"],"a":1,"e":"SI = PRT/100 = 12000\u00d78\u00d74/100 = <b>\u20b93840</b>.","d":"Easy"},{"t":"Quantitative","s":"Simple & Compound Interest","q":"Find the simple interest on \u20b96000 at 12% per annum for 3 years.","o":["720","8160","2160","216"],"a":2,"e":"SI = PRT/100 = 6000\u00d712\u00d73/100 = <b>\u20b92160</b>.","d":"Easy"},{"t":"Quantitative","s":"Simple & Compound Interest","q":"Find the simple interest on \u20b95000 at 5% per annum for 2 years.","o":["250","500","50","5500"],"a":1,"e":"SI = PRT/100 = 5000\u00d75\u00d72/100 = <b>\u20b9500</b>.","d":"Easy"},{"t":"Quantitative","s":"Simple & Compound Interest","q":"Find the simple interest on \u20b95000 at 8% per annum for 3 years.","o":["120","6200","1200","400"],"a":2,"e":"SI = PRT/100 = 5000\u00d78\u00d73/100 = <b>\u20b91200</b>.","d":"Easy"},{"t":"Quantitative","s":"Ratio & Proportion","q":"The present ages of two people are in the ratio 2 : 3. After 5 years the ratio becomes 3 : 4. Find the present age of the younger one.","o":["20 years","8 years","10 years","15 years"],"a":2,"e":"Let the ages be 2x and 3x. Then (2x+5)/(3x+5) = 3/4 \u2192 x = 5 \u2192 younger = 2x = <b>10 years</b>.","d":"Medium"},{"t":"Quantitative","s":"Ratio & Proportion","q":"The present ages of two people are in the ratio 4 : 5. After 6 years the ratio becomes 5 : 6. Find the present age of the younger one.","o":["24 years","19 years","30 years","36 years"],"a":0,"e":"Let the ages be 4x and 5x. Then (4x+6)/(5x+6) = 5/6 \u2192 x = 6 \u2192 younger = 4x = <b>24 years</b>.","d":"Medium"},{"t":"Quantitative","s":"Averages","q":"The average of 9 numbers is 40. If one number, 50, is removed, find the average of the remaining numbers.","o":["40","41","34.44","38.75"],"a":3,"e":"Sum = 9\u00d740 = 360. Remaining sum = 360\u221250 = 310, over 8 numbers \u2192 <b>38.75</b>.","d":"Medium"},{"t":"Quantitative","s":"Averages","q":"The average of 5 numbers is 20. If one number, 28, is removed, find the average of the remaining numbers.","o":["20","21.33","18","14.4"],"a":2,"e":"Sum = 5\u00d720 = 100. Remaining sum = 100\u221228 = 72, over 4 numbers \u2192 <b>18</b>.","d":"Medium"},{"t":"Quantitative","s":"Averages","q":"The average of 11 numbers is 40. If one number, 56, is removed, find the average of the remaining numbers.","o":["38.4","40","41.33","34.91"],"a":0,"e":"Sum = 11\u00d740 = 440. Remaining sum = 440\u221256 = 384, over 10 numbers \u2192 <b>38.4</b>.","d":"Medium"},{"t":"Quantitative","s":"Averages","q":"The average weight of 12 people increases by 2 kg when a new person replaces one weighing 45 kg. Find the weight of the new person.","o":["47 kg","69 kg","21 kg","24 kg"],"a":1,"e":"Total increase = 12 \u00d7 2 = 24 kg, so the new person is 24 kg heavier: 45 + 24 = <b>69 kg</b>.","d":"Medium"},{"t":"Quantitative","s":"Averages","q":"The average weight of 8 people increases by 3 kg when a new person replaces one weighing 65 kg. Find the weight of the new person.","o":["41 kg","89 kg","68 kg","24 kg"],"a":1,"e":"Total increase = 8 \u00d7 3 = 24 kg, so the new person is 24 kg heavier: 65 + 24 = <b>89 kg</b>.","d":"Medium"},{"t":"Quantitative","s":"Averages","q":"The average weight of 10 people increases by 1.5 kg when a new person replaces one weighing 60 kg. Find the weight of the new person.","o":["75 kg","45 kg","61.5 kg","15 kg"],"a":0,"e":"Total increase = 10 \u00d7 1.5 = 15 kg, so the new person is 15 kg heavier: 60 + 15 = <b>75 kg</b>.","d":"Medium"},{"t":"Quantitative","s":"Time & Work","q":"15 men complete a work in 10 days. How many men are needed to complete the same work in 8 days?","o":["23 men","18.75 men","7 men","12 men"],"a":1,"e":"Men \u00d7 days is constant: 15\u00d710 = M\u00d78 \u2192 M = <b>18.75 men</b>.","d":"Easy"},{"t":"Quantitative","s":"Time, Speed & Distance","q":"Walking at 4 km/h a man reaches his office 20 minutes late; at 6 km/h he arrives 5 minutes early. Find the distance to his office.","o":["1.67 km","10 km","2.5 km","5 km"],"a":3,"e":"Time difference = 20+5 = 25 min = 0.42 h. d/4 \u2212 d/6 = 0.42 \u2192 d = <b>5 km</b>.","d":"Medium"},{"t":"Quantitative","s":"Time, Speed & Distance","q":"Two cities are 600 km apart. A car starts from one at 60 km/h and another from the other at 30 km/h, moving towards each other at the same time. After how long do they meet?","o":["6.67 hrs","10 hrs","8 hrs","20 hrs"],"a":0,"e":"Approaching \u2192 add speeds: 60+30 = 90 km/h. Time = 600/90 = <b>6.67 hours</b>.","d":"Easy"},{"t":"Quantitative","s":"Time, Speed & Distance","q":"Two cities are 200 km apart. A car starts from one at 40 km/h and another from the other at 60 km/h, moving towards each other at the same time. After how long do they meet?","o":["10 hrs","5 hrs","2 hrs","3.33 hrs"],"a":2,"e":"Approaching \u2192 add speeds: 40+60 = 100 km/h. Time = 200/100 = <b>2 hours</b>.","d":"Easy"},{"t":"Quantitative","s":"Trains","q":"A train 200 m long travelling at 36 km/h crosses a platform in 30 seconds. Find the length of the platform.","o":["80 m","500 m","100 m","300 m"],"a":2,"e":"36 km/h = 10 m/s. Total distance = 10\u00d730 = 300 m. Platform = 300 \u2212 200 = <b>100 m</b>.","d":"Medium"},{"t":"Quantitative","s":"Boats & Streams","q":"A boat's speed in still water is 15 km/h and the stream flows at 3 km/h. How long will it take to travel 30 km downstream?","o":["1.67 hrs","2 hrs","2.5 hrs","10 hrs"],"a":0,"e":"Downstream speed = 15+3 = 18 km/h \u2192 30/18 = <b>1.67 hours</b>.","d":"Easy"},{"t":"Quantitative","s":"Boats & Streams","q":"A boat's speed in still water is 15 km/h and the stream flows at 2 km/h. How long will it take to travel 24 km downstream?","o":["12 hrs","1.6 hrs","1.85 hrs","1.41 hrs"],"a":3,"e":"Downstream speed = 15+2 = 17 km/h \u2192 24/17 = <b>1.41 hours</b>.","d":"Easy"},{"t":"Quantitative","s":"Boats & Streams","q":"A boat's speed in still water is 10 km/h and the stream flows at 2 km/h. How long will it take to travel 45 km downstream?","o":["4.5 hrs","5.62 hrs","22.5 hrs","3.75 hrs"],"a":3,"e":"Downstream speed = 10+2 = 12 km/h \u2192 45/12 = <b>3.75 hours</b>.","d":"Easy"},{"t":"Quantitative","s":"Boats & Streams","q":"A boat's speed in still water is 10 km/h and the stream flows at 4 km/h. How long will it take to travel 30 km downstream?","o":["7.5 hrs","5 hrs","3 hrs","2.14 hrs"],"a":3,"e":"Downstream speed = 10+4 = 14 km/h \u2192 30/14 = <b>2.14 hours</b>.","d":"Easy"},{"t":"Quantitative","s":"Boats & Streams","q":"A boat's speed in still water is 18 km/h and the stream flows at 4 km/h. How long will it take to travel 45 km downstream?","o":["3.21 hrs","2.5 hrs","2.05 hrs","11.25 hrs"],"a":2,"e":"Downstream speed = 18+4 = 22 km/h \u2192 45/22 = <b>2.05 hours</b>.","d":"Easy"},{"t":"Quantitative","s":"Boats & Streams","q":"A man rows 36 km downstream in 2 hours and the same distance upstream in 4 hours. Find the speed of the boat in still water.","o":["9 km/h","18 km/h","13.5 km/h","4.5 km/h"],"a":2,"e":"Downstream = 36/2 = 18 km/h, upstream = 36/4 = 9 km/h. Boat = (D+U)/2 = <b>13.5 km/h</b> (stream = 4.5 km/h).","d":"Medium"},{"t":"Quantitative","s":"Boats & Streams","q":"A man rows 30 km downstream in 2 hours and the same distance upstream in 3 hours. Find the speed of the boat in still water.","o":["12.5 km/h","15 km/h","2.5 km/h","10 km/h"],"a":0,"e":"Downstream = 30/2 = 15 km/h, upstream = 30/3 = 10 km/h. Boat = (D+U)/2 = <b>12.5 km/h</b> (stream = 2.5 km/h).","d":"Medium"},{"t":"Quantitative","s":"Number System","q":"Find the unit digit of 7^75.","o":["1","2.4","7","3"],"a":3,"e":"The unit digits of powers of 7 cycle as [7, 9, 3, 1] (length 4). 75 mod 4 = 3 \u2192 <b>3</b>. (Remainder 0 means take the last element.)","d":"Medium"},{"t":"Quantitative","s":"Number System","q":"Find the unit digit of 3^69.","o":["9","3","1.5","3.6"],"a":1,"e":"The unit digits of powers of 3 cycle as [3, 9, 7, 1] (length 4). 69 mod 4 = 1 \u2192 <b>3</b>. (Remainder 0 means take the last element.)","d":"Medium"},{"t":"Quantitative","s":"Number System","q":"Find the unit digit of 7^119.","o":["1","7","4.5","3"],"a":3,"e":"The unit digits of powers of 7 cycle as [7, 9, 3, 1] (length 4). 119 mod 4 = 3 \u2192 <b>3</b>. (Remainder 0 means take the last element.)","d":"Medium"},{"t":"Quantitative","s":"Number System","q":"Find the unit digit of 7^105.","o":["4.2","9","7","3.5"],"a":2,"e":"The unit digits of powers of 7 cycle as [7, 9, 3, 1] (length 4). 105 mod 4 = 1 \u2192 <b>7</b>. (Remainder 0 means take the last element.)","d":"Medium"},{"t":"Quantitative","s":"Number System","q":"Find the unit digit of 2^111.","o":["10","8","6","2"],"a":1,"e":"The unit digits of powers of 2 cycle as [2, 4, 8, 6] (length 4). 111 mod 4 = 3 \u2192 <b>8</b>. (Remainder 0 means take the last element.)","d":"Medium"},{"t":"Quantitative","s":"Number System","q":"Find the unit digit of 7^81.","o":["14","6","7","9"],"a":2,"e":"The unit digits of powers of 7 cycle as [7, 9, 3, 1] (length 4). 81 mod 4 = 1 \u2192 <b>7</b>. (Remainder 0 means take the last element.)","d":"Medium"},{"t":"Quantitative","s":"Number System","q":"Find the unit digit of 8^34.","o":["2","4","8","2.4"],"a":1,"e":"The unit digits of powers of 8 cycle as [8, 4, 2, 6] (length 4). 34 mod 4 = 2 \u2192 <b>4</b>. (Remainder 0 means take the last element.)","d":"Medium"},{"t":"Quantitative","s":"Number System","q":"Find the unit digit of 4^93.","o":["4.8","6","4","5"],"a":2,"e":"The unit digits of powers of 4 cycle as [4, 6] (length 2). 93 mod 2 = 1 \u2192 <b>4</b>. (Remainder 0 means take the last element.)","d":"Medium"},{"t":"Quantitative","s":"Number System","q":"Find the unit digit of 7^89.","o":["7","14","4.2","9"],"a":0,"e":"The unit digits of powers of 7 cycle as [7, 9, 3, 1] (length 4). 89 mod 4 = 1 \u2192 <b>7</b>. (Remainder 0 means take the last element.)","d":"Medium"},{"t":"Quantitative","s":"Number System","q":"Find the remainder when 2^28 is divided by 5.","o":["1","1.2","2","1.5"],"a":0,"e":"Find the smallest power of 2 that leaves remainder 1 mod 5, then reduce the exponent. Result: <b>1</b>.","d":"Hard"},{"t":"Quantitative","s":"Number System","q":"Find the remainder when 3^73 is divided by 5.","o":["3","1","4","2.4"],"a":0,"e":"Find the smallest power of 3 that leaves remainder 1 mod 5, then reduce the exponent. Result: <b>3</b>.","d":"Hard"},{"t":"Quantitative","s":"Number System","q":"Find the remainder when 3^64 is divided by 5.","o":["3","1","0.5","2"],"a":1,"e":"Find the smallest power of 3 that leaves remainder 1 mod 5, then reduce the exponent. Result: <b>1</b>.","d":"Hard"},{"t":"Quantitative","s":"Number System","q":"Find the remainder when 2^35 is divided by 5.","o":["2","4","1","3"],"a":3,"e":"Find the smallest power of 2 that leaves remainder 1 mod 5, then reduce the exponent. Result: <b>3</b>.","d":"Hard"},{"t":"Quantitative","s":"Number System","q":"Find the remainder when 2^73 is divided by 7.","o":["3","2.5","1","2"],"a":3,"e":"Find the smallest power of 2 that leaves remainder 1 mod 7, then reduce the exponent. Result: <b>2</b>.","d":"Hard"},{"t":"Quantitative","s":"Progressions","q":"Find the sum of the squares of the first 20 natural numbers.","o":["2870","1435","5740","400"],"a":0,"e":"Formula: n(n+1)(2n+1)/6 with n = 20 \u2192 <b>2870</b>.","d":"Medium"},{"t":"Quantitative","s":"Progressions","q":"Find the sum of the first 20 natural numbers.","o":["105","400","420","210"],"a":3,"e":"Formula: n(n+1)/2 with n = 20 \u2192 <b>210</b>.","d":"Medium"},{"t":"Quantitative","s":"Progressions","q":"Find the sum of the first 12 terms of the AP 5, 9, 13, \u2026","o":["162","648","324","49"],"a":2,"e":"Last term = 5+(12\u22121)\u00d74 = 49. Sum = n/2 \u00d7 (first + last) = 12/2 \u00d7 (5+49) = <b>324</b>.","d":"Medium"},{"t":"Quantitative","s":"Progressions","q":"Find the sum of the first 10 terms of the AP 3, 5, 7, \u2026","o":["60","240","21","120"],"a":3,"e":"Last term = 3+(10\u22121)\u00d72 = 21. Sum = n/2 \u00d7 (first + last) = 10/2 \u00d7 (3+21) = <b>120</b>.","d":"Medium"},{"t":"Quantitative","s":"Progressions","q":"Find the sum of the first 20 terms of the AP 7, 11, 15, \u2026","o":["83","1800","900","450"],"a":2,"e":"Last term = 7+(20\u22121)\u00d74 = 83. Sum = n/2 \u00d7 (first + last) = 20/2 \u00d7 (7+83) = <b>900</b>.","d":"Medium"},{"t":"Quantitative","s":"Progressions","q":"Find the sum of the first 15 terms of the AP 7, 9, 11, \u2026","o":["157","315","35","630"],"a":1,"e":"Last term = 7+(15\u22121)\u00d72 = 35. Sum = n/2 \u00d7 (first + last) = 15/2 \u00d7 (7+35) = <b>315</b>.","d":"Medium"},{"t":"Logical Reasoning","s":"Clocks","q":"Find the angle between the hands of a clock at 2:25.","o":["95\u00b0","150\u00b0","77.5\u00b0","60\u00b0"],"a":2,"e":"Angle = |30H \u2212 5.5M| = |30\u00d72 \u2212 5.5\u00d725| = 77.5\u00b0 \u2192 <b>77.5\u00b0</b>.","d":"Medium"},{"t":"Logical Reasoning","s":"Clocks","q":"Find the angle between the hands of a clock at 8:00.","o":["0\u00b0","120\u00b0","240\u00b0","60\u00b0"],"a":1,"e":"Angle = |30H \u2212 5.5M| = |30\u00d78 \u2212 5.5\u00d70| = 240\u00b0, and since this exceeds 180\u00b0 we take 360 \u2212 240 \u2192 <b>120\u00b0</b>.","d":"Medium"},{"t":"Logical Reasoning","s":"Clocks","q":"Find the angle between the hands of a clock at 5:40.","o":["150\u00b0","70\u00b0","90\u00b0","240\u00b0"],"a":1,"e":"Angle = |30H \u2212 5.5M| = |30\u00d75 \u2212 5.5\u00d740| = 70\u00b0 \u2192 <b>70\u00b0</b>.","d":"Medium"},{"t":"Logical Reasoning","s":"Clocks","q":"Find the angle between the hands of a clock at 5:10.","o":["60\u00b0","75\u00b0","95\u00b0","150\u00b0"],"a":2,"e":"Angle = |30H \u2212 5.5M| = |30\u00d75 \u2212 5.5\u00d710| = 95\u00b0 \u2192 <b>95\u00b0</b>.","d":"Medium"},{"t":"Logical Reasoning","s":"Clocks","q":"Find the angle between the hands of a clock at 8:30.","o":["75\u00b0","240\u00b0","180\u00b0","95\u00b0"],"a":0,"e":"Angle = |30H \u2212 5.5M| = |30\u00d78 \u2212 5.5\u00d730| = 75\u00b0 \u2192 <b>75\u00b0</b>.","d":"Medium"},{"t":"Logical Reasoning","s":"Clocks","q":"Find the angle between the hands of a clock at 10:40.","o":["300\u00b0","100\u00b0","80\u00b0","240\u00b0"],"a":2,"e":"Angle = |30H \u2212 5.5M| = |30\u00d710 \u2212 5.5\u00d740| = 80\u00b0 \u2192 <b>80\u00b0</b>.","d":"Medium"},{"t":"Logical Reasoning","s":"Clocks","q":"Find the angle between the hands of a clock at 11:10.","o":["330\u00b0","85\u00b0","60\u00b0","95\u00b0"],"a":1,"e":"Angle = |30H \u2212 5.5M| = |30\u00d711 \u2212 5.5\u00d710| = 275\u00b0, and since this exceeds 180\u00b0 we take 360 \u2212 275 \u2192 <b>85\u00b0</b>.","d":"Medium"},{"t":"Logical Reasoning","s":"Clocks","q":"Find the angle between the hands of a clock at 11:40.","o":["110\u00b0","240\u00b0","55\u00b0","330\u00b0"],"a":0,"e":"Angle = |30H \u2212 5.5M| = |30\u00d711 \u2212 5.5\u00d740| = 110\u00b0 \u2192 <b>110\u00b0</b>.","d":"Medium"},{"t":"Logical Reasoning","s":"Calendars","q":"If 1 January 2026 was a Sunday, what day was 1 January 2027? (2026 is an ordinary year.)","o":["Monday","Sunday","Wednesday","Tuesday"],"a":0,"e":"An ordinary year has 365 days = 1 odd day. Sunday + 1 = <b>Monday</b>.","d":"Medium"},{"t":"Logical Reasoning","s":"Calendars","q":"If 1 January 2024 was a Tuesday, what day was 1 January 2025? (2024 is a leap year.)","o":["Wednesday","Friday","Thursday","Tuesday"],"a":2,"e":"A leap year has 366 days = 2 odd days. Tuesday + 2 = <b>Thursday</b>.","d":"Medium"},{"t":"Logical Reasoning","s":"Calendars","q":"If 1 January 2023 was a Friday, what day was 1 January 2024? (2023 is an ordinary year.)","o":["Saturday","Sunday","Friday","Monday"],"a":0,"e":"An ordinary year has 365 days = 1 odd day. Friday + 1 = <b>Saturday</b>.","d":"Medium"},{"t":"Logical Reasoning","s":"Calendars","q":"If 1 January 2023 was a Tuesday, what day was 1 January 2024? (2023 is an ordinary year.)","o":["Wednesday","Tuesday","Thursday","Friday"],"a":0,"e":"An ordinary year has 365 days = 1 odd day. Tuesday + 1 = <b>Wednesday</b>.","d":"Medium"},{"t":"Logical Reasoning","s":"Calendars","q":"If 1 January 2023 was a Wednesday, what day was 1 January 2024? (2023 is an ordinary year.)","o":["Friday","Thursday","Wednesday","Saturday"],"a":1,"e":"An ordinary year has 365 days = 1 odd day. Wednesday + 1 = <b>Thursday</b>.","d":"Medium"},{"t":"Logical Reasoning","s":"Number Series","q":"Find the next term: 2, 6, 12, 20, 30, ?","o":["36","40","42","44"],"a":2,"e":"Differences are 4, 6, 8, 10 \u2192 next is 12. 30 + 12 = <b>42</b>. (Also n\u00b2+n.)","d":"Easy"},{"t":"Logical Reasoning","s":"Number Series","q":"Find the next term: 1, 4, 9, 16, 25, ?","o":["30","35","49","36"],"a":3,"e":"Perfect squares: 1\u00b2, 2\u00b2, 3\u00b2, 4\u00b2, 5\u00b2 \u2192 6\u00b2 = <b>36</b>.","d":"Easy"},{"t":"Logical Reasoning","s":"Number Series","q":"Find the next term: 3, 7, 15, 31, ?","o":["62","63","47","64"],"a":1,"e":"Each term \u00d7 2 + 1: 31 \u00d7 2 + 1 = <b>63</b>.","d":"Easy"},{"t":"Logical Reasoning","s":"Number Series","q":"Find the next term: 5, 11, 23, 47, ?","o":["71","96","95","94"],"a":2,"e":"\u00d7 2 + 1 each time: 47 \u00d7 2 + 1 = <b>95</b>.","d":"Medium"},{"t":"Logical Reasoning","s":"Number Series","q":"Find the next term: 2, 5, 10, 17, 26, ?","o":["38","37","36","35"],"a":1,"e":"Pattern n\u00b2 + 1: 6\u00b2 + 1 = <b>37</b>. Differences 3, 5, 7, 9 \u2192 next 11.","d":"Easy"},{"t":"Logical Reasoning","s":"Number Series","q":"Find the next term: 1, 1, 2, 3, 5, 8, ?","o":["12","16","13","11"],"a":2,"e":"Fibonacci \u2014 each term is the sum of the previous two: 5 + 8 = <b>13</b>
