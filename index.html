/b>. Simply subtracting 8 L is wrong \u2014 the second removal takes out diluted mixture.","d":"Medium"},{"t":"Quantitative","s":"Mixtures & Alligation","q":"From 80 litres of pure milk, 8 litres are removed and replaced with water. This is done twice. How much pure milk remains?","o":["72 L","64 L","64.8 L","80 L"],"a":2,"e":"Remaining = V(1\u2212r/V)\u207f = 80(1\u22128/80)\u00b2 = 80 \u00d7 0.81 = <b>64.8 L</b>. Simply subtracting 16 L is wrong \u2014 the second removal takes out diluted mixture.","d":"Medium"},{"t":"Quantitative","s":"Time & Work","q":"A can do a piece of work in 10 days and B in 15 days. How long will they take working together?","o":["12.5 days","5 days","6 days","25 days"],"a":2,"e":"Take total work = LCM(10,15) = 30 units. A does 3/day, B does 2/day \u2192 together 5/day \u2192 <b>6 days</b>.","d":"Easy"},{"t":"Quantitative","s":"Time & Work","q":"A can do a work in 16 days and B in 24 days. They work together for 5 days, after which B leaves. How many more days will A take to finish?","o":["11.5 days","4.6 days","11 days","7.67 days"],"a":3,"e":"LCM = 48 units. A = 3/day, B = 2/day. In 5 days together: 5\u00d75 = 25 units. Remaining 23 units \u00f7 3 = <b>7.67 days</b>.","d":"Medium"},{"t":"Quantitative","s":"Time & Work","q":"15 men complete a work in 18 days. How many men are needed to complete the same work in 9 days?","o":["7.5 men","30 men","6 men","24 men"],"a":1,"e":"Men \u00d7 days is constant: 15\u00d718 = M\u00d79 \u2192 M = <b>30 men</b>.","d":"Easy"},{"t":"Quantitative","s":"Time & Work","q":"15 men complete a work in 10 days. How many men are needed to complete the same work in 9 days?","o":["16.67 men","13.5 men","24 men","6 men"],"a":0,"e":"Men \u00d7 days is constant: 15\u00d710 = M\u00d79 \u2192 M = <b>16.67 men</b>.","d":"Easy"},{"t":"Quantitative","s":"Time & Work","q":"20 men complete a work in 12 days. How many men are needed to complete the same work in 6 days?","o":["14 men","26 men","40 men","10 men"],"a":2,"e":"Men \u00d7 days is constant: 20\u00d712 = M\u00d76 \u2192 M = <b>40 men</b>.","d":"Easy"},{"t":"Quantitative","s":"Time & Work","q":"12 men complete a work in 10 days. How many men are needed to complete the same work in 6 days?","o":["18 men","20 men","6 men","7.2 men"],"a":1,"e":"Men \u00d7 days is constant: 12\u00d710 = M\u00d76 \u2192 M = <b>20 men</b>.","d":"Easy"},{"t":"Quantitative","s":"Time & Work","q":"15 men complete a work in 12 days. How many men are needed to complete the same work in 8 days?","o":["22.5 men","7 men","10 men","23 men"],"a":0,"e":"Men \u00d7 days is constant: 15\u00d712 = M\u00d78 \u2192 M = <b>22.5 men</b>.","d":"Easy"},{"t":"Quantitative","s":"Time & Work","q":"A is 100% more efficient than B. B alone takes 20 days. How long do they take together?","o":["3.33 days","6.67 days","10 days","5 days"],"a":1,"e":"A is 100% more efficient \u2192 A takes 20/2 = 10 days. Together = ab/(a+b) = <b>6.67 days</b>.","d":"Medium"},{"t":"Quantitative","s":"Time, Speed & Distance","q":"Convert 18 km/h into m/s.","o":["5 m/s","10 m/s","9 m/s","64.8 m/s"],"a":0,"e":"Multiply by 5/18: 18 \u00d7 5/18 = <b>5 m/s</b>.","d":"Easy"},{"t":"Quantitative","s":"Time, Speed & Distance","q":"Walking at 6 km/h a man reaches his office 15 minutes late; at 7 km/h he arrives 5 minutes early. Find the distance to his office.","o":["13 km","2 km","14 km","28 km"],"a":2,"e":"Time difference = 15+5 = 20 min = 0.33 h. d/6 \u2212 d/7 = 0.33 \u2192 d = <b>14 km</b>.","d":"Medium"},{"t":"Quantitative","s":"Time, Speed & Distance","q":"Walking at 4 km/h a man reaches his office 20 minutes late; at 5 km/h he arrives 5 minutes early. Find the distance to his office.","o":["9 km","8.33 km","1.67 km","16.67 km"],"a":1,"e":"Time difference = 20+5 = 25 min = 0.42 h. d/4 \u2212 d/5 = 0.42 \u2192 d = <b>8.33 km</b>.","d":"Medium"},{"t":"Quantitative","s":"Time, Speed & Distance","q":"Walking at 5 km/h a man reaches his office 10 minutes late; at 7 km/h he arrives 5 minutes early. Find the distance to his office.","o":["1.25 km","4.37 km","12 km","8.75 km"],"a":1,"e":"Time difference = 10+5 = 15 min = 0.25 h. d/5 \u2212 d/7 = 0.25 \u2192 d = <b>4.37 km</b>.","d":"Medium"},{"t":"Quantitative","s":"Time, Speed & Distance","q":"Walking at 6 km/h a man reaches his office 15 minutes late; at 8 km/h he arrives 5 minutes early. Find the distance to his office.","o":["16 km","14 km","2 km","8 km"],"a":3,"e":"Time difference = 15+5 = 20 min = 0.33 h. d/6 \u2212 d/8 = 0.33 \u2192 d = <b>8 km</b>.","d":"Medium"},{"t":"Quantitative","s":"Time, Speed & Distance","q":"Two cities are 300 km apart. A car starts from one at 40 km/h and another from the other at 30 km/h, moving towards each other at the same time. After how long do they meet?","o":["30 hrs","4.29 hrs","7.5 hrs","10 hrs"],"a":1,"e":"Approaching \u2192 add speeds: 40+30 = 70 km/h. Time = 300/70 = <b>4.29 hours</b>.","d":"Easy"},{"t":"Quantitative","s":"Time, Speed & Distance","q":"Two cities are 400 km apart. A car starts from one at 60 km/h and another from the other at 40 km/h, moving towards each other at the same time. After how long do they meet?","o":["4 hrs","20 hrs","10 hrs","6.67 hrs"],"a":0,"e":"Approaching \u2192 add speeds: 60+40 = 100 km/h. Time = 400/100 = <b>4 hours</b>.","d":"Easy"},{"t":"Quantitative","s":"Time, Speed & Distance","q":"Two cities are 400 km apart. A car starts from one at 60 km/h and another from the other at 30 km/h, moving towards each other at the same time. After how long do they meet?","o":["6.67 hrs","4.44 hrs","13.33 hrs","3.33 hrs"],"a":1,"e":"Approaching \u2192 add speeds: 60+30 = 90 km/h. Time = 400/90 = <b>4.44 hours</b>.","d":"Easy"},{"t":"Quantitative","s":"Time, Speed & Distance","q":"Two cities are 300 km apart. A car starts from one at 40 km/h and another from the other at 40 km/h, moving towards each other at the same time. After how long do they meet?","o":["3.75 hrs","4.69 hrs","6 hrs","7.5 hrs"],"a":0,"e":"Approaching \u2192 add speeds: 40+40 = 80 km/h. Time = 300/80 = <b>3.75 hours</b>.","d":"Easy"},{"t":"Quantitative","s":"Time, Speed & Distance","q":"Two cities are 600 km apart. A car starts from one at 40 km/h and another from the other at 60 km/h, moving towards each other at the same time. After how long do they meet?","o":["30 hrs","10 hrs","6 hrs","15 hrs"],"a":2,"e":"Approaching \u2192 add speeds: 40+60 = 100 km/h. Time = 600/100 = <b>6 hours</b>.","d":"Easy"},{"t":"Quantitative","s":"Time, Speed & Distance","q":"Two cities are 600 km apart. A car starts from one at 40 km/h and another from the other at 40 km/h, moving towards each other at the same time. After how long do they meet?","o":["6 hrs","7.5 hrs","15 hrs","11 hrs"],"a":1,"e":"Approaching \u2192 add speeds: 40+40 = 80 km/h. Time = 600/80 = <b>7.5 hours</b>.","d":"Easy"},{"t":"Quantitative","s":"Trains","q":"A train 300 m long crosses a pole in 12 seconds. Find its speed in km/h.","o":["360 km/h","6.94 km/h","25 km/h","90 km/h"],"a":3,"e":"Crossing a pole covers only the train's length: 300/12 = 25 m/s \u2192 \u00d7 18/5 = <b>90 km/h</b>.","d":"Easy"},{"t":"Quantitative","s":"Trains","q":"A train 120 m long crosses a pole in 12 seconds. Find its speed in km/h.","o":["144 km/h","2.78 km/h","10 km/h","36 km/h"],"a":3,"e":"Crossing a pole covers only the train's length: 120/12 = 10 m/s \u2192 \u00d7 18/5 = <b>36 km/h</b>.","d":"Easy"},{"t":"Quantitative","s":"Trains","q":"A train 150 m long crosses a pole in 9 seconds. Find its speed in km/h.","o":["60 km/h","16.67 km/h","4.63 km/h","135 km/h"],"a":0,"e":"Crossing a pole covers only the train's length: 150/9 = 16.67 m/s \u2192 \u00d7 18/5 = <b>60 km/h</b>.","d":"Easy"},{"t":"Quantitative","s":"Trains","q":"A train 300 m long crosses a pole in 9 seconds. Find its speed in km/h.","o":["33.33 km/h","270 km/h","9.26 km/h","120 km/h"],"a":3,"e":"Crossing a pole covers only the train's length: 300/9 = 33.33 m/s \u2192 \u00d7 18/5 = <b>120 km/h</b>.","d":"Easy"},{"t":"Quantitative","s":"Trains","q":"A train 240 m long crosses a pole in 12 seconds. Find its speed in km/h.","o":["5.56 km/h","72 km/h","20 km/h","288 km/h"],"a":1,"e":"Crossing a pole covers only the train's length: 240/12 = 20 m/s \u2192 \u00d7 18/5 = <b>72 km/h</b>.","d":"Easy"},{"t":"Quantitative","s":"Trains","q":"A train 240 m long travelling at 54 km/h crosses a platform in 30 seconds. Find the length of the platform.","o":["450 m","690 m","210 m","175 m"],"a":2,"e":"54 km/h = 15 m/s. Total distance = 15\u00d730 = 450 m. Platform = 450 \u2212 240 = <b>210 m</b>.","d":"Medium"},{"t":"Quantitative","s":"Trains","q":"A train 150 m long travelling at 36 km/h crosses a platform in 20 seconds. Find the length of the platform.","o":["50 m","200 m","350 m","75 m"],"a":0,"e":"36 km/h = 10 m/s. Total distance = 10\u00d720 = 200 m. Platform = 200 \u2212 150 = <b>50 m</b>.","d":"Medium"},{"t":"Quantitative","s":"Trains","q":"A train 150 m long travelling at 72 km/h crosses a platform in 30 seconds. Find the length of the platform.","o":["225 m","750 m","600 m","450 m"],"a":3,"e":"72 km/h = 20 m/s. Total distance = 20\u00d730 = 600 m. Platform = 600 \u2212 150 = <b>450 m</b>.","d":"Medium"},{"t":"Quantitative","s":"Trains","q":"A train 200 m long travelling at 72 km/h crosses a platform in 20 seconds. Find the length of the platform.","o":["200 m","100 m","600 m","400 m"],"a":0,"e":"72 km/h = 20 m/s. Total distance = 20\u00d720 = 400 m. Platform = 400 \u2212 200 = <b>200 m</b>.","d":"Medium"},{"t":"Quantitative","s":"Trains","q":"A train 150 m long travelling at 72 km/h crosses a platform in 25 seconds. Find the length of the platform.","o":["250 m","650 m","350 m","500 m"],"a":2,"e":"72 km/h = 20 m/s. Total distance = 20\u00d725 = 500 m. Platform = 500 \u2212 150 = <b>350 m</b>.","d":"Medium"},{"t":"Quantitative","s":"Trains","q":"Two trains 150 m and 250 m long move towards each other at 60 km/h and 30 km/h. How long do they take to cross each other completely?","o":["16 s","4.44 s","48 s","6 s"],"a":0,"e":"Opposite directions \u2192 relative speed = 60+30 = 90 km/h = 25 m/s. Distance = 150+250 = 400 m \u2192 <b>16 seconds</b>.","d":"Medium"},{"t":"Quantitative","s":"Boats & Streams","q":"A boat's speed in still water is 10 km/h and the stream flows at 4 km/h. How long will it take to travel 45 km downstream?","o":["4.5 hrs","3.21 hrs","11.25 hrs","7.5 hrs"],"a":1,"e":"Downstream speed = 10+4 = 14 km/h \u2192 45/14 = <b>3.21 hours</b>.","d":"Easy"},{"t":"Quantitative","s":"Boats & Streams","q":"A boat's speed in still water is 12 km/h and the stream flows at 2 km/h. How long will it take to travel 24 km downstream?","o":["2.4 hrs","1.71 hrs","12 hrs","2 hrs"],"a":1,"e":"Downstream speed = 12+2 = 14 km/h \u2192 24/14 = <b>1.71 hours</b>.","d":"Easy"},{"t":"Quantitative","s":"Boats & Streams","q":"A boat's speed in still water is 12 km/h and the stream flows at 3 km/h. How long will it take to travel 24 km downstream?","o":["2.67 hrs","8 hrs","1.6 hrs","2 hrs"],"a":2,"e":"Downstream speed = 12+3 = 15 km/h \u2192 24/15 = <b>1.6 hours</b>.","d":"Easy"},{"t":"Quantitative","s":"Boats & Streams","q":"A man rows 24 km downstream in 3 hours and the same distance upstream in 5 hours. Find the speed of the boat in still water.","o":["6.4 km/h","4.8 km/h","8 km/h","1.6 km/h"],"a":0,"e":"Downstream = 24/3 = 8 km/h, upstream = 24/5 = 4.8 km/h. Boat = (D+U)/2 = <b>6.4 km/h</b> (stream = 1.6 km/h).","d":"Medium"},{"t":"Quantitative","s":"Boats & Streams","q":"A man rows 30 km downstream in 3 hours and the same distance upstream in 5 hours. Find the speed of the boat in still water.","o":["8 km/h","10 km/h","6 km/h","2 km/h"],"a":0,"e":"Downstream = 30/3 = 10 km/h, upstream = 30/5 = 6 km/h. Boat = (D+U)/2 = <b>8 km/h</b> (stream = 2 km/h).","d":"Medium"},{"t":"Quantitative","s":"Boats & Streams","q":"A man rows 30 km downstream in 2 hours and the same distance upstream in 4 hours. Find the speed of the boat in still water.","o":["7.5 km/h","15 km/h","3.75 km/h","11.25 km/h"],"a":3,"e":"Downstream = 30/2 = 15 km/h, upstream = 30/4 = 7.5 km/h. Boat = (D+U)/2 = <b>11.25 km/h</b> (stream = 3.75 km/h).","d":"Medium"},{"t":"Quantitative","s":"Boats & Streams","q":"A man rows 18 km downstream in 2 hours and the same distance upstream in 4 hours. Find the speed of the boat in still water.","o":["6.75 km/h","9 km/h","2.25 km/h","4.5 km/h"],"a":0,"e":"Downstream = 18/2 = 9 km/h, upstream = 18/4 = 4.5 km/h. Boat = (D+U)/2 = <b>6.75 km/h</b> (stream = 2.25 km/h).","d":"Medium"},{"t":"Quantitative","s":"Boats & Streams","q":"A man rows 18 km downstream in 2 hours and the same distance upstream in 3 hours. Find the speed of the boat in still water.","o":["1.5 km/h","7.5 km/h","6 km/h","9 km/h"],"a":1,"e":"Downstream = 18/2 = 9 km/h, upstream = 18/3 = 6 km/h. Boat = (D+U)/2 = <b>7.5 km/h</b> (stream = 1.5 km/h).","d":"Medium"},{"t":"Quantitative","s":"Number System","q":"Find the unit digit of 3^38.","o":["3","7","9","11"],"a":2,"e":"The unit digits of powers of 3 cycle as [3, 9, 7, 1] (length 4). 38 mod 4 = 2 \u2192 <b>9</b>. (Remainder 0 means take the last element.)","d":"Medium"},{"t":"Quantitative","s":"Number System","q":"Find the unit digit of 7^90.","o":["5","9","3","7"],"a":1,"e":"The unit digits of powers of 7 cycle as [7, 9, 3, 1] (length 4). 90 mod 4 = 2 \u2192 <b>9</b>. (Remainder 0 means take the last element.)","d":"Medium"},{"t":"Quantitative","s":"Number System","q":"Find the unit digit of 7^103.","o":["3","2.25","7","1"],"a":0,"e":"The unit digits of powers of 7 cycle as [7, 9, 3, 1] (length 4). 103 mod 4 = 3 \u2192 <b>3</b>. (Remainder 0 means take the last element.)","d":"Medium"},{"t":"Quantitative","s":"Number System","q":"Find the unit digit of 3^60.","o":["0.5","3","1","1.25"],"a":2,"e":"The unit digits of powers of 3 cycle as [3, 9, 7, 1] (length 4). 60 mod 4 = 0 \u2192 <b>1</b>. (Remainder 0 means take the last element.)","d":"Medium"},{"t":"Quantitative","s":"Number System","q":"Find the unit digit of 2^48.","o":["12","4.8","6","2"],"a":2,"e":"The unit digits of powers of 2 cycle as [2, 4, 8, 6] (length 4). 48 mod 4 = 0 \u2192 <b>6</b>. (Remainder 0 means take the last element.)","d":"Medium"},{"t":"Quantitative","s":"Number System","q":"Find the unit digit of 4^46.","o":["6","4","9","4.5"],"a":0,"e":"The unit digits of powers of 4 cycle as [4, 6] (length 2). 46 mod 2 = 0 \u2192 <b>6</b>. (Remainder 0 means take the last element.)","d":"Medium"},{"t":"Quantitative","s":"Number System","q":"Find the unit digit of 2^108.","o":["8","3.6","2","6"],"a":3,"e":"The unit digits of powers of 2 cycle as [2, 4, 8, 6] (length 4). 108 mod 4 = 0 \u2192 <b>6</b>. (Remainder 0 means take the last element.)","d":"Medium"},{"t":"Quantitative","s":"Number System","q":"Find the unit digit of 2^65.","o":["2","2.5","1.6","4"],"a":0,"e":"The unit digits of powers of 2 cycle as [2, 4, 8, 6] (length 4). 65 mod 4 = 1 \u2192 <b>2</b>. (Remainder 0 means take the last element.)","d":"Medium"},{"t":"Quantitative","s":"Number System","q":"How many factors does 400 have?","o":["200","17","15","7"],"a":2,"e":"400 = 2^4 \u00d7 5^2. Number of factors = product of (exponent + 1) = <b>15</b>.","d":"Medium"},{"t":"Quantitative","s":"Number System","q":"How many factors does 180 have?","o":["20","9","90","18"],"a":3,"e":"180 = 2^2 \u00d7 3^2 \u00d7 5^1. Number of factors = product of (exponent + 1) = <b>18</b>.","d":"Medium"},{"t":"Quantitative","s":"Number System","q":"How many factors does 96 have?","o":["6","14","48","12"],"a":3,"e":"96 = 2^5 \u00d7 3^1. Number of factors = product of (exponent + 1) = <b>12</b>.","d":"Medium"},{"t":"Quantitative","s":"Number System","q":"How many factors does 120 have?","o":["60","18","16","8"],"a":2,"e":"120 = 2^3 \u00d7 3^1 \u00d7 5^1. Number of factors = product of (exponent + 1) = <b>16</b>.","d":"Medium"},{"t":"Quantitative","s":"LCM & HCF","q":"Find the HCF of 40 and 60.","o":["40","120","20","60"],"a":2,"e":"HCF(40,60) = 20 and LCM = 120. Answer: <b>20</b>. Check: HCF \u00d7 LCM = 2400 = 40\u00d760 \u2713","d":"Easy"},{"t":"Quantitative","s":"LCM & HCF","q":"Find the HCF of 36 and 48.","o":["36","12","48","144"],"a":1,"e":"HCF(36,48) = 12 and LCM = 144. Answer: <b>12</b>. Check: HCF \u00d7 LCM = 1728 = 36\u00d748 \u2713","d":"Easy"},{"t":"Quantitative","s":"LCM & HCF","q":"Find the HCF of 18 and 27.","o":["54","9","27","18"],"a":1,"e":"HCF(18,27) = 9 and LCM = 54. Answer: <b>9</b>. Check: HCF \u00d7 LCM = 486 = 18\u00d727 \u2713","d":"Easy"},{"t":"Quantitative","s":"LCM & HCF","q":"Find the HCF of 24 and 36.","o":["12","24","36","72"],"a":0,"e":"HCF(24,36) = 12 and LCM = 72. Answer: <b>12</b>. Check: HCF \u00d7 LCM = 864 = 24\u00d736 \u2713","d":"Easy"},{"t":"Quantitative","s":"LCM & HCF","q":"Find the least number which, when divided by 4, 6 and 10, leaves a remainder of 3 in each case.","o":["23","60","57","63"],"a":3,"e":"The number is LCM + remainder = LCM(4,6,10) + 3 = 60 + 3 = <b>63</b>.","d":"Medium"},{"t":"Quantitative","s":"LCM & HCF","q":"Find the least number which, when divided by 9, 12 and 15, leaves a remainder of 1 in each case.","o":["180","37","179","181"],"a":3,"e":"The number is LCM + remainder = LCM(9,12,15) + 1 = 180 + 1 = <b>181</b>.","d":"Medium"},{"t":"Quantitative","s":"LCM & HCF","q":"Find the least number which, when divided by 8, 12 and 20, leaves a remainder of 1 in each case.","o":["119","120","121","41"],"a":2,"e":"The number is LCM + remainder = LCM(8,12,20) + 1 = 120 + 1 = <b>121</b>.","d":"Medium"},{"t":"Quantitative","s":"LCM & HCF","q":"Find the least number which, when divided by 8, 12 and 20, leaves a remainder of 2 in each case.","o":["118","122","42","120"],"a":1,"e":"The number is LCM + remainder = LCM(8,12,20) + 2 = 120 + 2 = <b>122</b>.","d":"Medium"},{"t":"Quantitative","s":"Number System","q":"Find the remainder when 2^24 is divided by 7.","o":["2","1","1.2","0.75"],"a":1,"e":"Find the smallest power of 2 that leaves remainder 1 mod 7, then reduce the exponent. Result: <b>1</b>.","d":"Hard"},{"t":"Quantitative","s":"Number System","q":"Find the remainder when 3^60 is divided by 5.","o":["1.5","2","1","3"],"a":2,"e":"Find the smallest power of 3 that leaves remainder 1 mod 5, then reduce the exponent. Result: <b>1</b>.","d":"Hard"},{"t":"Quantitative","s":"Number System","q":"Find the remainder when 3^63 is divided by 5.","o":["2","2.4","1","3"],"a":0,"e":"Find the smallest power of 3 that leaves remainder 1 mod 5, then reduce the exponent. Result: <b>2</b>.","d":"Hard"},{"t":"Quantitative","s":"Number System","q":"Find the remainder when 2^29 is divided by 5.","o":["3","1","4","2"],"a":3,"e":"Find the smallest power of 2 that leaves remainder 1 mod 5, then reduce the exponent. Result: <b>2</b>.","d":"Hard"},{"t":"Quantitative","s":"Number System","q":"Find the remainder when 3^41 is divided by 7.","o":["3","5","6","1"],"a":1,"e":"Find the smallest power of 3 that leaves remainder 1 mod 7, then reduce the exponent. Result: <b>5</b>.","d":"Hard"},{"t":"Quantitative","s":"Number System","q":"Find the remainder when 2^34 is divided by 7.","o":["3","2","4","1"],"a":1,"e":"Find the smallest power of 2 that leaves remainder 1 mod 7, then reduce the exponent. Result: <b>2</b>.","d":"Hard"},{"t":"Quantitative","s":"Progressions","q":"Find the sum of the first 50 natural numbers.","o":["637","2500","2550","1275"],"a":3,"e":"Formula: n(n+1)/2 with n = 50 \u2192 <b>1275</b>.","d":"Medium"},{"t":"Quantitative","s":"Progressions","q":"Find the sum of the cubes of the first 25 natural numbers.","o":["211250","105625","625","52812"],"a":1,"e":"Formula: [n(n+1)/2]\u00b2 with n = 25 \u2192 <b>105625</b>.","d":"Medium"},{"t":"Quantitative","s":"Progressions","q":"Find the sum of the first 25 natural numbers.","o":["162","625","325","650"],"a":2,"e":"Formula: n(n+1)/2 with n = 25 \u2192 <b>325</b>.","d":"Medium"},{"t":"Quantitative","s":"Progressions","q":"Find the sum of the first 10 terms of the AP 7, 11, 15, \u2026","o":["125","500","250","43"],"a":2,"e":"Last term = 7+(10\u22121)\u00d74 = 43. Sum = n/2 \u00d7 (first + last) = 10/2 \u00d7 (7+43) = <b>250</b>.","d":"Medium"},{"t":"Quantitative","s":"Progressions","q":"Find the sum of the first 20 terms of the AP 7, 10, 13, \u2026","o":["1420","710","355","64"],"a":1,"e":"Last term = 7+(20\u22121)\u00d73 = 64. Sum = n/2 \u00d7 (first + last) = 20/2 \u00d7 (7+64) = <b>710</b>.","d":"Medium"},{"t":"Quantitative","s":"Progressions","q":"Find the sum of the first 20 terms of the AP 7, 12, 17, \u2026","o":["1090","2180","102","545"],"a":0,"e":"Last term = 7+(20\u22121)\u00d75 = 102. Sum = n/2 \u00d7 (first + last) = 20/2 \u00d7 (7+102) = <b>1090</b>.","d":"Medium"},{"t":"Quantitative","s":"Progressions","q":"Find the sum of the first 10 terms of the AP 5, 8, 11, \u2026","o":["370","185","92","32"],"a":1,"e":"Last term = 5+(10\u22121)\u00d73 = 32. Sum = n/2 \u00d7 (first + last) = 10/2 \u00d7 (5+32) = <b>185</b>.","d":"Medium"},{"t":"Quantitative","s":"Progressions","q":"Find the sum of the first 20 terms of the AP 5, 8, 11, \u2026","o":["1340","670","62","335"],"a":1,"e":"Last term = 5+(20\u22121)\u00d73 = 62. Sum = n/2 \u00d7 (first + last) = 20/2 \u00d7 (5+62) = <b>670</b>.","d":"Medium"},{"t":"Quantitative","s":"Permutations & Combinations","q":"In how many ways can 3 people be selected from a group of 7?","o":["35","21","25","210"],"a":0,"e":"Order does not matter \u2192 combination. C(7,3) = <b>35</b>. (If order mattered it would be P(7,3) = 210.)","d":"Easy"},{"t":"Quantitative","s":"Permutations & Combinations","q":"In how many ways can 2 people be selected from a group of 9?","o":["36","72","18","9"],"a":0,"e":"Order does not matter \u2192 combination. C(9,2) = <b>36</b>. (If order mattered it would be P(9,2) = 72.)","d":"Easy"},{"t":"Quantitative","s":"Permutations & Combinations","q":"In how many ways can 2 people be selected from a group of 6?","o":["12","15","30","6"],"a":1,"e":"Order does not matter \u2192 combination. C(6,2) = <b>15</b>. (If order mattered it would be P(6,2) = 30.)","d":"Easy"},{"t":"Quantitative","s":"Permutations & Combinations","q":"In how many ways can 5 people be seated around a circular table?","o":["120","24","12","6"],"a":1,"e":"Circular arrangements = (n\u22121)! = 4! = <b>24</b>. One seat is fixed to remove rotational duplicates.","d":"Medium"},{"t":"Quantitative","s":"Permutations & Combinations","q":"From 6 men and 4 women, in how many ways can a committee of 3 men and 2 women be formed?","o":["120","252","240","26"],"a":0,"e":"Choose independently and multiply: C(6,3) \u00d7 C(4,2) = 20 \u00d7 6 = <b>120</b>.","d":"Medium"},{"t":"Quantitative","s":"Permutations & Combinations","q":"From 6 men and 5 women, in how many ways can a committee of 2 men and 2 women be formed?","o":["330","300","150","25"],"a":2,"e":"Choose independently and multiply: C(6,2) \u00d7 C(5,2) = 15 \u00d7 10 = <b>150</b>.","d":"Medium"},{"t":"Quantitative","s":"Probability","q":"A bag contains 4 red and 6 blue balls. Two balls are drawn at random. What is the probability that both are red?","o":["2/5","2/15","1/3","4/25"],"a":1,"e":"C(4,2)/C(10,2) = 6/45 = <b>2/15</b>.","d":"Medium"},{"t":"Logical Reasoning","s":"Clocks","q":"Find the angle between the hands of a clock at 1:20.","o":["30\u00b0","80\u00b0","120\u00b0","50\u00b0"],"a":1,"e":"Angle = |30H \u2212 5.5M| = |30\u00d71 \u2212 5.5\u00d720| = 80\u00b0 \u2192 <b>80\u00b0</b>.","d":"Medium"},{"t":"Logical Reasoning","s":"Clocks","q":"Find the angle between the hands of a clock at 5:45.","o":["270\u00b0","97.5\u00b0","50\u00b0","150\u00b0"],"a":1,"e":"Angle = |30H \u2212 5.5M| = |30\u00d75 \u2212 5.5\u00d745| = 97.5\u00b0 \u2192 <b>97.5\u00b0</b>.","d":"Medium"},{"t":"Logical Reasoning","s":"Clocks","q":"Find the angle between the hands of a clock at 9:45.","o":["22.5\u00b0","270\u00b0","45\u00b0","30\u00b0"],"a":0,"e":"Angle = |30H \u2212 5.5M| = |30\u00d79 \u2212 5.5\u00d745| = 22.5\u00b0 \u2192 <b>22.5\u00b0</b>.","d":"Medium"},{"t":"Logical Reasoning","s":"Clocks","q":"Find the angle between the hands of a clock at 1:00.","o":["15\u00b0","40\u00b0","0\u00b0","30\u00b0"],"a":3,"e":"Angle = |30H \u2212 5.5M| = |30\u00d71 \u2212 5.5\u00d70| = 30\u00b0 \u2192 <b>30\u00b0</b>.","d":"Medium"},{"t":"Logical Reasoning","s":"Clocks","q":"Find the angle between the hands of a clock at 6:50.","o":["300\u00b0","70\u00b0","180\u00b0","95\u00b0"],"a":3,"e":"Angle = |30H \u2212 5.5M| = |30\u00d76 \u2212 5.5\u00d750| = 95\u00b0 \u2192 <b>95\u00b0</b>.","d":"Medium"},{"t":"Logical Reasoning","s":"Clocks","q":"Find the angle between the hands of a clock at 3:30.","o":["90\u00b0","75\u00b0","150\u00b0","180\u00b0"],"a":1,"e":"Angle = |30H \u2212 5.5M| = |30\u00d73 \u2212 5.5\u00d730| = 75\u00b0 \u2192 <b>75\u00b0</b>.","d":"Medium"},{"t":"Logical Reasoning","s":"Clocks","q":"Find the angle between the hands of a clock at 2:10.","o":["5\u00b0","60\u00b0","3.75\u00b0","6\u00b0"],"a":0,"e":"Angle = |30H \u2212 5.5M| = |30\u00d72 \u2212 5.5\u00d710| = 5\u00b0 \u2192 <b>5\u00b0</b>.","d":"Medium"},{"t":"Logical Reasoning","s":"Clocks","q":"Find the angle between the hands of a clock at 9:40.","o":["270\u00b0","60\u00b0","240\u00b0","50\u00b0"],"a":3,"e":"Angle = |30H \u2212 5.5M| = |30\u00d79 \u2212 5.5\u00d740| = 50\u00b0 \u2192 <b>50\u00b0</b>.","d":"Medium"},{"t":"Logical Reasoning","s":"Clocks","q":"Find the angle between the hands of a clock at 9:10.","o":["35\u00b0","60\u00b0","270\u00b0","145\u00b0"],"a":3,"e":"Angle = |30H \u2212 5.5M| = |30\u00d79 \u2212 5.5\u00d710| = 215\u00b0, and since this exceeds 180\u00b0 we take 360 \u2212 215 \u2192 <b>145\u00b0</b>.","d":"Medium"},{"t":"Logical Reasoning","s":"Cubes","q":"A cube is painted on all faces and then cut into 216 equal smaller cubes. How many smaller cubes have exactly one face(s) painted?","o":["96","48","64","8"],"a":0,"e":"With n = 6 per edge: 6(n\u22122)\u00b2 = <b>96</b>. (Corners = 8 always, edges = 12(n\u22122), faces = 6(n\u22122)\u00b2, interior = (n\u22122)\u00b3.)","d":"Medium"},{"t":"Logical Reasoning","s":"Cubes","q":"A cube is painted on all faces and then cut into 216 equal smaller cubes. How many smaller cubes have no face(s) painted?","o":["48","8","64","75"],"a":2,"e":"With n = 6 per edge: (n\u22122)\u00b3 = <b>64</b>. (Corners = 8 always, edges = 12(n\u22122), faces = 6(n\u22122)\u00b2, interior = (n\u22122)\u00b3.)","d":"Medium"},{"t":"Logical Reasoning","s":"Cubes","q":"A cube is painted on all faces and then cut into 27 equal smaller cubes. How many smaller cubes have no face(s) painted?","o":["1","8","12","0.75"],"a":0,"e":"With n = 3 per edge: (n\u22122)\u00b3 = <b>1</b>. (Corners = 8 always, edges = 12(n\u22122), faces = 6(n\u22122)\u00b2, interior = (n\u22122)\u00b3.)","d":"Medium"},{"t":"Logical Reasoning","s":"Calendars","q":"If 1 January 2024 was a Thursday, what day was 1 January 2025? (2024 is a leap year.)","o":["Saturday","Sunday","Friday","Thursday"],"a":0,"e":"A leap year has 366 days = 2 odd days. Thursday + 2 = <b>Saturday</b>.","d":"Medium"},{"t":"Logical Reasoning","s":"Calendars","q":"If 1 January 2024 was a Friday, what day was 1 January 2025? (2024 is a leap year.)","o":["Monday","Friday","Sunday","Saturday"],"a":2,"e":"A leap year has 366 days = 2 odd days. Friday + 2 = <b>Sunday</b>.","d":"Medium"},{"t":"Logical Reasoning","s":"Calendars","q":"If 1 January 2025 was a Saturday, what day was 1 January 2026? (2025 is an ordinary year.)","o":["Saturday","Sunday","Tuesday","Monday"],"a":1,"e":"An ordinary year has 365 days = 1 odd day. Saturday + 1 = <b>Sunday</b>.","d":"Medium"},{"t":"Logical Reasoning","s":"Calendars","q":"If 1 January 2028 was a Saturday, what day was 1 January 2029? (2028 is a leap year.)","o":["Sunday","Tuesday","Monday","Saturday"],"a":2,"e":"A leap year has 366 days = 2 odd days. Saturday + 2 = <b>Monday</b>.","d":"Medium"},{"t":"Logical Reasoning","s":"Calendars","q":"If 1 January 2023 was a Thursday, what day was 1 January 2024? (2023 is an ordinary year.)","o":["Thursday","Sunday","Saturday","Friday"],"a":3,"e":"An ordinary year has 365 days = 1 odd day. Thursday + 1 = <b>Friday</b>.","d":"Medium"},{"t":"Logical Reasoning","s":"Calendars","q":"If 1 January 2023 was a Sunday, what day was 1 January 2024? (2023 is an ordinary year.)","o":["Tuesday","Wednesday","Sunday","Monday"],"a":3,"e":"An ordinary year has 365 days = 1 odd day. Sunday + 1 = <b>Monday</b>.","d":"Medium"},{"t":"Quantitative","s":"Percentages","q":"Find 40% of 240.","o":["96","120","6","9.6"],"a":0,"e":"40% of 240 = 240 \u00d7 40/100 = <b>96</b>. Faster: 40% = 2/5 of the number.","d":"Easy"},{"t":"Quantitative","s":"Percentages","q":"Find 75% of 960.","o":["720","72","12.8","816"],"a":0,"e":"75% of 960 = 960 \u00d7 75/100 = <b>720</b>. Faster: 75% = 3/4 of the number.","d":"Easy"},{"t":"Quantitative","s":"Percentages","q":"Find 15% of 160.","o":["2.4","40","10.67","24"],"a":3,"e":"15% of 160 = 160 \u00d7 15/100 = <b>24</b>. Faster: 15% = 3/20 of the number.","d":"Easy"},{"t":"Quantitative","s":"Percentages","q":"Find 25% of 320.","o":["12.8","112","80","8"],"a":2,"e":"25% of 320 = 320 \u00d7 25/100 = <b>80</b>. Faster: 25% = 1/4 of the number.","d":"Easy"},{"t":"Quantitative","s":"Percentages","q":"Find 15% of 320.","o":["80","21.33","48","4.8"],"a":2,"e":"15% of 320 = 320 \u00d7 15/100 = <b>48</b>. Faster: 15% = 3/20 of the number.","d":"Easy"},{"t":"Quantitative","s":"Percentages","q":"Find 20% of 320.","o":["16","96","6.4","64"],"a":3,"e":"20% of 320 = 320 \u00d7 20/100 = <b>64</b>. Faster: 20% = 1/5 of the number.","d":"Easy"},{"t":"Quantitative","s":"Percentages","q":"Find 40% of 960.","o":["384","38.4","480","24"],"a":0,"e":"40% of 960 = 960 \u00d7 40/100 = <b>384</b>. Faster: 40% = 2/5 of the number.","d":"Easy"},{"t":"Quantitative","s":"Percentages","q":"Find 35% of 160.","o":["5.6","4.57","56","72"],"a":2,"e":"35% of 160 = 160 \u00d7 35/100 = <b>56</b>. Faster: 35% = 7/20 of the number.","d":"Easy"},{"t":"Quantitative","s":"Percentages","q":"In a two-candidate election the winner got 70% of the votes and won by 800 votes. Find the total number of votes.","o":["2666.67","1600","1142.86","2000"],"a":3,"e":"Margin = 70% \u2212 30% = 40% of total = 800 \u2192 total = 800 \u00d7 100/40 = <b>2000</b>.","d":"Medium"},{"t":"Quantitative","s":"Percentages","q":"In a two-candidate election the winner got 60% of the votes and won by 2000 votes. Find the total number of votes.","o":["5000","3333.33","10000","4000"],"a":2,"e":"Margin = 60% \u2212 40% = 20% of total = 2000 \u2192 total = 2000 \u00d7 100/20 = <b>10000</b>.","d":"Medium"},{"t":"Quantitative","s":"Percentages","q":"In a two-candidate election the winner got 65% of the votes and won by 400 votes. Find the total number of votes.","o":["615.38","800","1142.86","1333.33"],"a":3,"e":"Margin = 65% \u2212 35% = 30% of total = 400 \u2192 total = 400 \u00d7 100/30 = <b>1333.33</b>.","d":"Medium"},{"t":"Quantitative","s":"Percentages","q":"In an exam 40% failed in Maths, 45% failed in English and 15% failed in both. What percent passed in both subjects?","o":["15%","30%","70%","85%"],"a":1,"e":"Failed in at least one = 40 + 45 \u2212 15 = 70%. Passed in both = 100 \u2212 70 = <b>30%</b>. Subtract the overlap or you double-count.","d":"Medium"},{"t":"Quantitative","s":"Percentages","q":"In an exam 30% failed in Maths, 55% failed in English and 25% failed in both. What percent passed in both subjects?","o":["40%","75%","15%","60%"],"a":0,"e":"Failed in at least one = 30 + 55 \u2212 25 = 60%. Passed in both = 100 \u2212 60 = <b>40%</b>. Subtract the overlap or you double-count.","d":"Medium"},{"t":"Quantitative","s":"Percentages","q":"In an exam 35% failed in Maths, 50% failed in English and 20% failed in both. What percent passed in both subjects?","o":["15%","80%","65%","35%"],"a":3,"e":"Failed in at least one = 35 + 50 \u2212 20 = 65%. Passed in both = 100 \u2212 65 = <b>35%</b>. Subtract the overlap or you double-count.","d":"Medium"},{"t":"Quantitative","s":"Percentages","q":"In an exam 40% failed in Maths, 55% failed in English and 20% failed in both. What percent passed in both subjects?","o":["75%","80%","25%","5%"],"a":2,"e":"Failed in at least one = 40 + 55 \u2212 20 = 75%. Passed in both = 100 \u2212 75 = <b>25%</b>. Subtract the overlap or you double-count.","d":"Medium"},{"t":"Quantitative","s":"Percentages","q":"In an exam 40% failed in Maths, 45% failed in English and 25% failed in both. What percent passed in both subjects?","o":["60%","75%","40%","15%"],"a":2,"e":"Failed in at least one = 40 + 45 \u2212 25 = 60%. Passed in both = 100 \u2212 60 = <b>40%</b>. Subtract the overlap or you double-count.","d":"Medium"},{"t":"Quantitative","s":"Profit & Loss","q":"An article costing \u20b91200 is sold at a profit of 20%. Find the selling price.","o":["1220","240","960","1440"],"a":3,"e":"SP = CP(100+P)/100 = 1200 \u00d7 120/100 = <b>\u20b91440</b>.","d":"Easy"},{"t":"Quantitative","s":"Profit & Loss","q":"An article costing \u20b9500 is sold at a profit of 25%. Find the selling price.","o":["125","525","375","625"],"a":3,"e":"SP = CP(100+P)/100 = 500 \u00d7 125/100 = <b>\u20b9625</b>.","d":"Easy"},{"t":"Quantitative","s":"Profit & Loss","q":"An article costing \u20b91200 is sold at a profit of 25%. Find the selling price.","o":["1225","300","1500","900"],"a":2,"e":"SP = CP(100+P)/100 = 1200 \u00d7 125/100 = <b>\u20b91500</b>.","d":"Easy"},{"t":"Quantitative","s":"Profit & Loss","q":"An article costing \u20b9800 is sold at a profit of 25%. Find the selling price.","o":["1000","200","600","825"],"a":0,"e":"SP = CP(100+P)/100 = 800 \u00d7 125/100 = <b>\u20b91000</b>.","d":"Easy"},{"t":"Quantitative","s":"Profit & Loss","q":"An article bought for \u20b9750 is sold for \u20b9810. Find the profit percentage.","o":["3.85%","60%","8%","7.41%"],"a":2,"e":"Profit% = (SP\u2212CP)/CP \u00d7 100 = 60/750 \u00d7 100 = <b>8%</b>. Profit is always on COST price, never on SP.","d":"Easy"},{"t":"Quantitative","s":"Profit & Loss","q":"An article bought for \u20b9600 is sold for \u20b9750. Find the profit percentage.","o":["20%","25%","150%","11.11%"],"a":1,"e":"Profit% = (SP\u2212CP)/CP \u00d7 100 = 150/600 \u00d7 100 = <b>25%</b>. Profit is always on COST price, never on SP.","d":"Easy"},{"t":"Quantitative","s":"Profit & Loss","q":"An article bought for \u20b9300 is sold for \u20b9360. Find the profit percentage.","o":["20%","16.67%","60%","9.09%"],"a":0,"e":"Profit% = (SP\u2212CP)/CP \u00d7 100 = 60/300 \u00d7 100 = <b>20%</b>. Profit is always on COST price, never on SP.","d":"Easy"},{"t":"Quantitative","s":"Profit & Loss","q":"A shopkeeper marks his goods 40% above cost and then allows a discount of 20%. Find his net profit percentage.","o":["-20%","60%","20%","12%"],"a":3,"e":"Take CP = 100 \u2192 MP = 140 \u2192 SP = 140 \u00d7 0.8 = 112 \u2192 profit = <b>12%</b>. Markup is on CP but discount is on MP, so you cannot just subtract.","d":"Medium"},{"t":"Quantitative","s":"Profit & Loss","q":"A shopkeeper marks his goods 50% above cost and then allows a discount of 20%. Find his net profit percentage.","o":["30%","70%","20%","-30%"],"a":2,"e":"Take CP = 100 \u2192 MP = 150 \u2192 SP = 150 \u00d7 0.8 = 120 \u2192 profit = <b>20%</b>. Markup is on CP but discount is on MP, so you cannot just subtract.","d":"Medium"},{"t":"Quantitative","s":"Profit & Loss","q":"A shopkeeper marks his goods 60% above cost and then allows a discount of 20%. Find his net profit percentage.","o":["-40%","40%","28%","80%"],"a":2,"e":"Take CP = 100 \u2192 MP = 160 \u2192 SP = 160 \u00d7 0.8 = 128 \u2192 profit = <b>28%</b>. Markup is on CP but discount is on MP, so you cannot just subtract.","d":"Medium"},{"t":"Quantitative","s":"Profit & Loss","q":"A shopkeeper marks his goods 40% above cost and then allows a discount of 25%. Find his net profit percentage.","o":["15%","-15%","65%","5%"],"a":3,"e":"Take CP = 100 \u2192 MP = 140 \u2192 SP = 140 \u00d7 0.75 = 105 \u2192 profit = <b>5%</b>. Markup is on CP but discount is on MP, so you cannot just subtract.","d":"Medium"},{"t":"Quantitative","s":"Profit & Loss","q":"Two articles are each sold for \u20b9480. One is sold at a profit of 20% and the other at a loss of 20%. What is the net result?","o":["4%","0%","20%","-4%"],"a":3,"e":"Whenever two items sell at the SAME price with equal \u00b120%, the result is always a LOSS of x\u00b2/100 = <b>4%</b>. Never break-even.","d":"Medium"},{"t":"Quantitative","s":"Simple & Compound Interest","q":"Find the simple interest on \u20b96000 at 10% per annum for 2 years.","o":["7200","600","1200","120"],"a":2,"e":"SI = PRT/100 = 6000\u00d710\u00d72/100 = <b>\u20b91200</b>.","d":"Easy"},{"t":"Quantitative","s":"Simple & Compound Interest","q":"Find the simple interest on \u20b912000 at 5% per annum for 2 years.","o":["120","1200","600","13200"],"a":1,"e":"SI = PRT/100 = 12000\u00d75\u00d72/100 = <b>\u20b91200</b>.","d":"Easy"},{"t":"Quantitative","s":"Simple & Compound Interest","q":"Find the simple interest on \u20b96000 at 5% per annum for 2 years.","o":["6600","300","600","60"],"a":2,"e":"SI = PRT/100 = 6000\u00d75\u00d72/100 = <b>\u20b9600</b>.","d":"Easy"},{"t":"Quantitative","s":"Simple & Compound Interest","q":"Find the simple interest on \u20b95000 at 8% per annum for 2 years.","o":["80","400","5800","800"],"a":3,"e":"SI = PRT/100 = 5000\u00d78\u00d72/100 = <b>\u20b9800</b>.","d":"Easy"},{"t":"Quantitative","s":"Simple & Compound Interest","q":"Find the simple interest on \u20b912000 at 12% per annum for 4 years.","o":["576","17760","5760","1440"],"a":2,"e":"SI = PRT/100 = 12000\u00d712\u00d74/100 = <b>\u20b95760</b>.","d":"Easy"},{"t":"Quantitative","s":"Simple & Compound Interest","q":"Find the simple interest on \u20b94000 at 12% per annum for 4 years.","o":["192","1920","480","5920"],"a":1,"e":"SI = PRT/100 = 4000\u00d712\u00d74/100 = <b>\u20b91920</b>.","d":"Easy"},{"t":"Quantitative","s":"Simple & Compound Interest","q":"Find the compound interest on \u20b920000 at 20% per annum for 2 years.","o":["28800","8000","17600","8800"],"a":3,"e":"A = P(1+R/100)\u00b2 = 20000 \u00d7 1.44 = 28800; CI = A \u2212 P = <b>\u20b98800</b>. (SI would be only \u20b98000.)","d":"Medium"},{"t":"Quantitative","s":"Simple & Compound Interest","q":"Find the compound interest on \u20b95000 at 20% per annum for 2 years.","o":["2200","2000","4400","7200"],"a":0,"e":"A = P(1+R/100)\u00b2 = 5000 \u00d7 1.44 = 7200; CI = A \u2212 P = <b>\u20b92200</b>. (SI would be only \u20b92000.)","d":"Medium"},{"t":"Quantitative","s":"Simple & Compound Interest","q":"Find the difference between compound and simple interest on \u20b910000 at 20% per annum for 2 years.","o":["2000","800","400","4000"],"a":2,"e":"Difference for 2 years = P(R/100)\u00b2 = 10000 \u00d7 (20/100)\u00b2 = <b>\u20b9400</b>. Memorise this \u2014 it appears constantly.","d":"Medium"},{"t":"Quantitative","s":"Simple & Compound Interest","q":"Find the difference between compound and simple interest on \u20b916000 at 5% per annum for 2 years.","o":["40","800","1600","80"],"a":0,"e":"Difference for 2 years = P(R/100)\u00b2 = 16000 \u00d7 (5/100)\u00b2 = <b>\u20b940</b>. Memorise this \u2014 it appears constantly.","d":"Medium"},{"t":"Quantitative","s":"Simple & Compound Interest","q":"Find the difference between compound and simple interest on \u20b95000 at 5% per annum for 2 years.","o":["12.5","500","25","250"],"a":0,"e":"Difference for 2 years = P(R/100)\u00b2 = 5000 \u00d7 (5/100)\u00b2 = <b>\u20b912.5</b>. Memorise this \u2014 it appears constantly.","d":"Medium"},{"t":"Quantitative","s":"Simple & Compound Interest","q":"A sum doubles in 4 years at compound interest. In how many years will it become 4 times itself?","o":["4.8 years","16 years","8 years","6 years"],"a":2,"e":"4 = 2^2, so it needs 2 doubling periods \u2192 2 \u00d7 4 = <b>8 years</b>. At CI growth is multiplicative, not linear.","d":"Medium"},{"t":"Quantitative","s":"Simple & Compound Interest","q":"A sum doubles in 3 years at compound interest. In how many years will it become 16 times itself?","o":["12 years","48 years","19 years","24 years"],"a":0,"e":"16 = 2^4, so it needs 4 doubling periods \u2192 4 \u00d7 3 = <b>12 years</b>. At CI growth is multiplicative, not linear.","d":"Medium"},{"t":"Quantitative","s":"Ratio & Proportion","q":"\u20b9720 is divided among A, B and C in the ratio 1 : 2 : 3. Find C's share.","o":["360","120","240","425"],"a":0,"e":"Total parts = 6. C gets 3/6 \u00d7 720 = <b>\u20b9360</b>.","d":"Easy"},{"t":"Quantitative","s":"Ratio & Proportion","q":"\u20b9600 is divided among A, B and C in the ratio 2 : 3 : 7. Find C's share.","o":["200","350","150","100"],"a":1,"e":"Total parts = 12. C gets 7/12 \u00d7 600 = <b>\u20b9350</b>.","d":"Easy"},{"t":"Quantitative","s":"Ratio & Proportion","q":"\u20b9300 is divided among A, B and C in the ratio 1 : 2 : 3. Find C's share.","o":["100","50","125","150"],"a":3,"e":"Total parts = 6. C gets 3/6 \u00d7 300 = <b>\u20b9150</b>.","d":"Easy"},{"t":"Quantitative","s":"Ratio & Proportion","q":"The present ages of two people are in the ratio 2 : 3. After 8 years the ratio becomes 3 : 4. Find the present age of the younger one.","o":["25 years","16 years","24 years","32 years"],"a":1,"e":"Let the ages be 2x and 3x. Then (2x+8)/(3x+8) = 3/4 \u2192 x = 8 \u2192 younger = 2x = <b>16 years</b>.","d":"Medium"},{"t":"Quantitative","s":"Ratio & Proportion","q":"The present ages of two people are in the ratio 5 : 7. After 4 years the ratio becomes 7 : 9. Find the present age of the younger one.","o":["14 years","10 years","6 years","18 years"],"a":1,"e":"Let the ages be 5x and 7x. Then (5x+4)/(7x+4) = 7/9 \u2192 x = 2 \u2192 younger = 5x = <b>10 years</b>.","d":"Medium"},{"t":"Quantitative","s":"Averages","q":"The average of 7 numbers is 20. If one number, 28, is removed, find the average of the remaining numbers.","o":["20","21","18.67","16"],"a":2,"e":"Sum = 7\u00d720 = 140. Remaining sum = 140\u221228 = 112, over 6 numbers \u2192 <b>18.67</b>.","d":"Medium"},{"t":"Quantitative","s":"Averages","q":"The average of 7 numbers is 40. If one number, 50, is removed, find the average of the remaining numbers.","o":["41.25","38.33","32.86","40"],"a":1,"e":"Sum = 7\u00d740 = 280. Remaining sum = 280\u221250 = 230, over 6 numbers \u2192 <b>38.33</b>.","d":"Medium"},{"t":"Quantitative","s":"Averages","q":"The average of 9 numbers is 20. If one number, 36, is removed, find the average of the remaining numbers.","o":["21.6","18","16","20"],"a":1,"e":"Sum = 9\u00d720 = 180. Remaining sum = 180\u221236 = 144, over 8 numbers \u2192 <b>18</b>.","d":"Medium"},{"t":"Quantitative","s":"Averages","q":"The average of 9 numbers is 40. If one number, 52, is removed, find the average of the remaining numbers.","o":["38.5","34.22","41.2","40"],"a":0,"e":"Sum = 9\u00d740 = 360. Remaining sum = 360\u221252 = 308, over 8 numbers \u2192 <b>38.5</b>.","d":"Medium"},{"t":"Quantitative","s":"Averages","q":"The average of 9 numbers is 25. If one number, 35, is removed, find the average of the remaining numbers.","o":["21.11","26","23.75","25"],"a":2,"e":"Sum = 9\u00d725 = 225. Remaining sum = 225\u221235 = 190, over 8 numbers \u2192 <b>23.75</b>.","d":"Medium"},{"t":"Quantitative","s":"Averages","q":"The average of 9 numbers is 30. If one number, 40, is removed, find the average of the remaining numbers.","o":["30","31","25.56","28.75"],"a":3,"e":"Sum = 9\u00d730 = 270. Remaining sum = 270\u221240 = 230, over 8 numbers \u2192 <b>28.75</b>.","d":"Medium"},{"t":"Quantitative","s":"Averages","q":"The average weight of 12 people increases by 2 kg when a new person replaces one weighing 65 kg. Find the weight of the new person.","o":["89 kg","67 kg","24 kg","41 kg"],"a":0,"e":"Total increase = 12 \u00d7 2 = 24 kg, so the new person is 24 kg heavier: 65 + 24 = <b>89 kg</b>.","d":"Medium"},{"t":"Quantitative","s":"Averages","q":"The average weight of 8 people increases by 2.5 kg when a new person replaces one weighing 65 kg. Find the weight of the new person.","o":["67.5 kg","85 kg","20 kg","45 kg"],"a":1,"e":"Total increase = 8 \u00d7 2.5 = 20 kg, so the new person is 20 kg heavier: 65 + 20 = <b>85 kg</b>.","d":"Medium"},{"t":"Quantitative","s":"Averages","q":"The average weight of 8 people increases by 2 kg when a new person replaces one weighing 65 kg. Find the weight of the new person.","o":["16 kg","49 kg","67 kg","81 kg"],"a":3,"e":"Total increase = 8 \u00d7 2 = 16 kg, so the new person is 16 kg heavier: 65 + 16 = <b>81 kg</b>.","d":"Medium"},{"t":"Quantitative","s":"Averages","q":"The average weight of 10 people increases by 2.5 kg when a new person replaces one weighing 60 kg. Find the weight of the new person.","o":["62.5 kg","35 kg","25 kg","85 kg"],"a":3,"e":"Total increase = 10 \u00d7 2.5 = 25 kg, so the new person is 25 kg heavier: 60 + 25 = <b>85 kg</b>.","d":"Medium"},{"t":"Quantitative","s":"Mixtures & Alligation","q":"In what ratio must an item costing \u20b924/kg be mixed with one costing \u20b936/kg to get a mixture worth \u20b928/kg?","o":["24 : 36","1 : 2","2 : 1","1 : 1"],"a":2,"e":"Alligation: cheaper : dearer = (d\u2212m) : (m\u2212c) = (36\u221228) : (28\u221224) = <b>2 : 1</b>.","d":"Medium"},{"t":"Quantitative","s":"Mixtures & Alligation","q":"In what ratio must an item costing \u20b920/kg be mixed with one costing \u20b930/kg to get a mixture worth \u20b928/kg?","o":["20 : 30","1 : 4","4 : 1","1 : 1"],"a":1,"e":"Alligation: cheaper : dearer = (d\u2212m) : (m\u2212c) = (30\u221228) : (28\u221220) = <b>1 : 4</b>.","d":"Medium"},{"t":"Quantitative","s":"Time & Work","q":"A can do a work in 10 days and B in 15 days. They work together for 4 days, after which B leaves. How many more days will A take to finish?","o":["3.33 days","2 days","5 days","6 days"],"a":0,"e":"LCM = 30 units. A = 3/day, B = 2/day. In 4 days together: 5\u00d74 = 20 units. Remaining 10 units \u00f7 3 = <b>3.33 days</b>.","d":"Medium"},{"t":"Quantitative","s":"Time & Work","q":"A can do a work in 16 days and B in 24 days. They work together for 3 days, after which B leaves. How many more days will A take to finish?","o":["11 days","13 days","16.5 days","6.6 days"],"a":0,"e":"LCM = 48 units. A = 3/day, B = 2/day. In 3 days together: 5\u00d73 = 15 units. Remaining 33 units \u00f7 3 = <b>11 days</b>.","d":"Medium"},{"t":"Quantitative","s":"Time & Work","q":"A can do a work in 20 days and B in 30 days. They work together for 5 days, after which B leaves. How many more days will A take to finish?","o":["11.67 days","15 days","7 days","17.5 days"],"a":0,"e":"LCM = 60 units. A = 3/day, B = 2/day. In 5 days together: 5\u00d75 = 25 units. Remaining 35 units \u00f7 3 = <b>11.67 days</b>.","d":"Medium"},{"t":"Quantitative","s":"Time & Work","q":"15 men complete a work in 10 days. How many men are needed to complete the same work in 6 days?","o":["40 men","9 men","21 men","25 men"],"a":3,"e":"Men \u00d7 days is constant: 15\u00d710 = M\u00d76 \u2192 M = <b>25 men</b>.","d":"Easy"},{"t":"Quantitative","s":"Time & Work","q":"12 men complete a work in 12 days. How many men are needed to complete the same work in 9 days?","o":["3 men","9 men","21 men","16 men"],"a":3,"e":"Men \u00d7 days is constant: 12\u00d712 = M\u00d79 \u2192 M = <b>16 men</b>.","d":"Easy"},{"t":"Quantitative","s":"Time & Work","q":"12 men complete a work in 18 days. How many men are needed to complete the same work in 8 days?","o":["20 men","5.33 men","4 men","27 men"],"a":3,"e":"Men \u00d7 days is constant: 12\u00d718 = M\u00d78 \u2192 M = <b>27 men</b>.","d":"Easy"},{"t":"Quantitative","s":"Time & Work","q":"20 men complete a work in 10 days. How many men are needed to complete the same work in 9 days?","o":["29 men","22.22 men","11 men","18 men"],"a":1,"e":"Men \u00d7 days is constant: 20\u00d710 = M\u00d79 \u2192 M = <b>22.22 men</b>.","d":"Easy"},{"t":"Quantitative","s":"Time & Work","q":"A is 50% more efficient than B. B alone takes 45 days. How long do they take together?","o":["18 days","15 days","22.5 days","30 days"],"a":0,"e":"A is 50% more efficient \u2192 A takes 45/1.5 = 30 days. Together = ab/(a+b) = <b>18 days</b>.","d":"Medium"},{"t":"Quantitative","s":"Time & Work","q":"A is 100% more efficient than B. B alone takes 30 days. How long do they take together?","o":["5 days","8 days","15 days","10 days"],"a":3,"e":"A is 100% more efficient \u2192 A takes 30/2 = 15 days. Together = ab/(a+b) = <b>10 days</b>.","d":"Medium"},{"t":"Quantitative","s":"Time, Speed & Distance","q":"Walking at 4 km/h a man reaches his office 15 minutes late; at 6 km/h he arrives 10 minutes early. Find the distance to his office.","o":["10 km","5 km","1.67 km","4 km"],"a":1,"e":"Time difference = 15+10 = 25 min = 0.42 h. d/4 \u2212 d/6 = 0.42 \u2192 d = <b>5 km</b>.","d":"Medium"},{"t":"Quantitative","s":"Time, Speed & Distance","q":"Walking at 5 km/h a man reaches his office 15 minutes late; at 7 km/h he arrives 10 minutes early. Find the distance to his office.","o":["12 km","14.58 km","7.29 km","2.08 km"],"a":2,"e":"Time difference = 15+10 = 25 min = 0.42 h. d/5 \u2212 d/7 = 0.42 \u2192 d = <b>7.29 km</b>.","d":"Medium"},{"t":"Quantitative","s":"Time, Speed & Distance","q":"Walking at 6 km/h a man reaches his office 15 minutes late; at 7 km/h he arrives 10 minutes early. Find the distance to his office.","o":["17.5 km","2.5 km","13 km","35 km"],"a":0,"e":"Time difference = 15+10 = 25 min = 0.42 h. d/6 \u2212 d/7 = 0.42 \u2192 d = <b>17.5 km</b>.","d":"Medium"},{"t":"Quantitative","s":"Time, Speed & Distance","q":"Walking at 5 km/h a man reaches his office 10 minutes late; at 6 km/h he arrives 5 minutes early. Find the distance to his office.","o":["1.25 km","15 km","11 km","7.5 km"],"a":3,"e":"Time difference = 10+5 = 15 min = 0.25 h. d/5 \u2212 d/6 = 0.25 \u2192 d = <b>7.5 km</b>.","d":"Medium"},{"t":"Quantitative","s":"Time, Speed & Distance","q":"Walking at 5 km/h a man reaches his office 20 minutes late; at 7 km/h he arrives 10 minutes early. Find the distance to his office.","o":["8.75 km","2.5 km","12 km","17.5 km"],"a":0,"e":"Time difference = 20+10 = 30 min = 0.5 h. d/5 \u2212 d/7 = 0.5 \u2192 d = <b>8.75 km</b>.","d":"Medium"},{"t":"Quantitative","s":"Time, Speed & Distance","q":"Two cities are 200 km apart. A car starts from one at 40 km/h and another from the other at 40 km/h, moving towards each other at the same time. After how long do they meet?","o":["2.5 hrs","1.25 hrs","3 hrs","5 hrs"],"a":0,"e":"Approaching \u2192 add speeds: 40+40 = 80 km/h. Time = 200/80 = <b>2.5 hours</b>.","d":"Easy"},{"t":"Quantitative","s":"Time, Speed & Distance","q":"Two cities are 400 km apart. A car starts from one at 40 km/h and another from the other at 60 km/h, moving towards each other at the same time. After how long do they meet?","o":["6.67 hrs","10 hrs","4 hrs","20 hrs"],"a":2,"e":"Approaching \u2192 add speeds: 40+60 = 100 km/h. Time = 400/100 = <b>4 hours</b>.","d":"Easy"},{"t":"Quantitative","s":"Time, Speed & Distance","q":"Two cities are 400 km apart. A car starts from one at 60 km/h and another from the other at 60 km/h, moving towards each other at the same time. After how long do they meet?","o":["3.33 hrs","2 hrs","5 hrs","6.67 hrs"],"a":0,"e":"Approaching \u2192 add speeds: 60+60 = 120 km/h. Time = 400/120 = <b>3.33 hours</b>.","d":"Easy"},{"t":"Quantitative","s":"Trains","q":"A train 180 m long crosses a pole in 15 seconds. Find its speed in km/h.","o":["12 km/h","43.2 km/h","270 km/h","3.33 km/h"],"a":1,"e":"Crossing a pole covers only the train's length: 180/15 = 12 m/s \u2192 \u00d7 18/5 = <b>43.2 km/h</b>.","d":"Easy"},{"t":"Quantitative","s":"Trains","q":"A train 180 m long crosses a pole in 9 seconds. Find its speed in km/h.","o":["162 km/h","5.56 km/h","20 km/h","72 km/h"],"a":3,"e":"Crossing a pole covers only the train's length: 180/9 = 20 m/s \u2192 \u00d7 18/5 = <b>72 km/h</b>.","d":"Easy"},{"t":"Quantitative","s":"Trains","q":"A train 150 m long crosses a pole in 12 seconds. Find its speed in km/h.","o":["45 km/h","12.5 km/h","3.47 km/h","180 km/h"],"a":0,"e":"Crossing a pole covers only the train's length: 150/12 = 12.5 m/s \u2192 \u00d7 18/5 = <b>45 km/h</b>.","d":"Easy"},{"t":"Quantitative","s":"Trains","q":"A train 120 m long crosses a pole in 9 seconds. Find its speed in km/h.","o":["13.33 km/h","108 km/h","3.7 km/h","48 km/h"],"a":3,"e":"Crossing a pole covers only the train's length: 120/9 = 13.33 m/s \u2192 \u00d7 18/5 = <b>48 km/h</b>.","d":"Easy"},{"t":"Quantitative","s":"Trains","q":"A train 200 m long travelling at 54 km/h crosses a platform in 25 seconds. Find the length of the platform.","o":["225 m","175 m","575 m","375 m"],"a":1,"e":"54 km/h = 15 m/s. Total distance = 15\u00d725 = 375 m. Platform = 375 \u2212 200 = <b>175 m</b>.","d":"Medium"},{"t":"Quantitative","s":"Trains","q":"A train 240 m long travelling at 72 km/h crosses a platform in 25 seconds. Find the length of the platform.","o":["125 m","500 m","740 m","260 m"],"a":3,"e":"72 km/h = 20 m/s. Total distance = 20\u00d725 = 500 m. Platform = 500 \u2212 240 = <b>260 m</b>.","d":"Medium"},{"t":"Quantitative","s":"Trains","q":"A train 150 m long travelling at 54 km/h crosses a platform in 30 seconds. Find the length of the platform.","o":["150 m","450 m","600 m","300 m"],"a":3,"e":"54 km/h = 15 m/s. Total distance = 15\u00d730 = 450 m. Platform = 450 \u2212 150 = <b>300 m</b>.","d":"Medium"},{"t":"Quantitative","s":"Trains","q":"A train 200 m long travelling at 36 km/h crosses a platform in 25 seconds. Find the length of the platform.","o":["50 m","450 m","250 m","25 m"],"a":0,"e":"36 km/h = 10 m/s. Total distance = 10\u00d725 = 250 m. Platform = 250 \u2212 200 = <b>50 m</b>.","d":"Medium"},{"t":"Quantitative","s":"Trains","q":"Two trains 100 m and 150 m long move towards each other at 60 km/h and 30 km/h. How long do they take to cross each other completely?","o":["2.78 s","10 s","4 s","30 s"],"a":1,"e":"Opposite directions \u2192 relative speed = 60+30 = 90 km/h = 25 m/s. Distance = 100+150 = 250 m \u2192 <b>10 seconds</b>.","d":"Medium"},{"t":"Quantitative","s":"Boats & Streams","q":"A boat's speed in still water is 12 km/h and the stream flows at 2 km/h. How long will it take to travel 36 km downstream?","o":["18 hrs","3 hrs","2.57 hrs","3.6 hrs"],"a":2,"e":"Downstream speed = 12+2 = 14 km/h \u2192 36/14 = <b>2.57 hours</b>.","d":"Easy"},{"t":"Quantitative","s":"Boats & Streams","q":"A boat's speed in still water is 12 km/h and the stream flows at 4 km/h. How long will it take to travel 24 km downstream?","o":["6 hrs","1.5 hrs","3 hrs","2 hrs"],"a":1,"e":"Downstream speed = 12+4 = 16 km/h \u2192 24/16 = <b>1.5 hours</b>.","d":"Easy"},{"t":"Quantitative","s":"Boats & Streams","q":"A boat's speed in still water is 10 km/h and the stream flows at 4 km/h. How long will it take to travel 24 km downstream?","o":["4 hrs","6 hrs","2.4 hrs","1.71 hrs"],"a":3,"e":"Downstream speed = 10+4 = 14 km/h \u2192 24/14 = <b>1.71 hours</b>.","d":"Easy"},{"t":"Quantitative","s":"Boats & Streams","q":"A boat's speed in still water is 18 km/h and the stream flows at 4 km/h. How long will it take to travel 36 km downstream?","o":["9 hrs","2.57 hrs","1.64 hrs","2 hrs"],"a":2,"e":"Downstream speed = 18+4 = 22 km/h \u2192 36/22 = <b>1.64 hours</b>.","d":"Easy"},{"t":"Quantitative","s":"Boats & Streams","q":"A man rows 18 km downstream in 3 hours and the same distance upstream in 5 hours. Find the speed of the boat in still water.","o":["4.8 km/h","3.6 km/h","6 km/h","1.2 km/h"],"a":0,"e":"Downstream = 18/3 = 6 km/h, upstream = 18/5 = 3.6 km/h. Boat = (D+U)/2 = <b>4.8 km/h</b> (stream = 1.2 km/h).","d":"Medium"},{"t":"Quantitative","s":"Boats & Streams","q":"A man rows 36 km downstream in 3 hours and the same distance upstream in 5 hours. Find the speed of the boat in still water.","o":["12 km/h","9.6 km/h","7.2 km/h","2.4 km/h"],"a":1,"e":"Downstream = 36/3 = 12 km/h, upstream = 36/5 = 7.2 km/h. Boat = (D+U)/2 = <b>9.6 km/h</b> (stream = 2.4 km/h).","d":"Medium"},{"t":"Quantitative","s":"Boats & Streams","q":"A man rows 24 km downstream in 3 hours and the same distance upstream in 4 hours. Find the speed of the boat in still water.","o":["1 km/h","8 km/h","6 km/h","7 km/h"],"a":3,"e":"Downstream = 24/3 = 8 km/h, upstream = 24/4 = 6 km/h. Boat = (D+U)/2 = <b>7 km/h</b> (stream = 1 km/h).","d":"Medium"},{"t":"Quantitative","s":"Number System","q":"Find the unit digit of 3^42.","o":["5","3","7","9"],"a":3,"e":"The unit digits of powers of 3 cycle as [3, 9, 7, 1] (length 4). 42 mod 4 = 2 \u2192 <b>9</b>. (Remainder 0 means take the last element.)","d":"Medium"},{"t":"Quantitative","s":"Number System","q":"Find the unit digit of 2^26.","o":["5","8","2","4"],"a":3,"e":"The unit digits of powers of 2 cycle as [2, 4, 8, 6] (length 4). 26 mod 4 = 2 \u2192 <b>4</b>. (Remainder 0 means take the last element.)","d":"Medium"},{"t":"Quantitative","s":"Number System","q":"Find the unit digit of 3^102.","o":["9","3","7","5"],"a":0,"e":"The unit digits of powers of 3 cycle as [3, 9, 7, 1] (length 4). 102 mod 4 = 2 \u2192 <b>9</b>. (Remainder 0 means take the last element.)","d":"Medium"},{"t":"Quantitative","s":"Number System","q":"Find the unit digit of 3^25.","o":["9","1.5","3","2.25"],"a":2,"e":"The unit digits of powers of 3 cycle as [3, 9, 7, 1] (length 4). 25 mod 4 = 1 \u2192 <b>3</b>. (Remainder 0 means take the last element.)","d":"Medium"},{"t":"Quantitative","s":"Number System","q":"Find the unit digit of 4^102.","o":["4.5","3.6","4","6"],"a":3,"e":"The unit digits of powers of 4 cycle as [4, 6] (length 2). 102 mod 2 = 0 \u2192 <b>6</b>. (Remainder 0 means take the last element.)","d":"Medium"},{"t":"Quantitative","s":"Number System","q":"Find the unit digit of 9^109.","o":["11","1","9","7"],"a":2,"e":"The unit digits of powers of 9 cycle as [9, 1] (length 2). 109 mod 2 = 1 \u2192 <b>9</b>. (Remainder 0 means take the last element.)","d":"Medium"},{"t":"Quantitative","s":"Number System","q":"Find the unit digit of 8^63.","o":["2.4","2","6","8"],"a":1,"e":"The unit digits of powers of 8 cycle as [8, 4, 2, 6] (length 4). 63 mod 4 = 3 \u2192 <b>2</b>. (Remainder 0 means take the last element.)","d":"Medium"},{"t":"Quantitative","s":"Number System","q":"Find the unit digit of 7^65.","o":["8","4.2","7","9"],"a":2,"e":"The unit digits of powers of 7 cycle as [7, 9, 3, 1] (length 4). 65 mod 4 = 1 \u2192 <b>7</b>. (Remainder 0 means take the last element.)","d":"Medium"},{"t":"Quantitative","s":"Number System","q":"Find the unit digit of 8^56.","o":["3.6","8","12","6"],"a":3,"e":"The unit digits of powers of 8 cycle as [8, 4, 2, 6] (length 4). 56 mod 4 = 0 \u2192 <b>6</b>. (Remainder 0 means take the last element.)","d":"Medium"},{"t":"Quantitative","s":"LCM & HCF","q":"Find the least number which, when divided by 6, 8 and 12, leaves a remainder of 2 in each case.","o":["28","24","22","26"],"a":3,"e":"The number is LCM + remainder = LCM(6,8,12) + 2 = 24 + 2 = <b>26</b>.","d":"Medium"},{"t":"Quantitative","s":"Number System","q":"Find the remainder when 5^87 is divided by 7.","o":["0","6","5","1"],"a":1,"e":"Find the smallest power of 5 that leaves remainder 1 mod 7, then reduce the exponent. Result: <b>6</b>.","d":"Hard"},{"t":"Quantitative","s":"Number System","q":"Find the remainder when 5^54 is divided by 7.","o":["2","0.75","5","1"],"a":3,"e":"Find the smallest power of 5 that leaves remainder 1 mod 7, then reduce the exponent. Result: <b>1</b>.","d":"Hard"},{"t":"Quantitative","s":"Number System","q":"Find the remainder when 5^81 is divided by 7.","o":["1","5","6","0"],"a":2,"e":"Find the smallest power of 5 that leaves remainder 1 mod 7, then reduce the exponent. Result: <b>6</b>.","d":"Hard"},{"t":"Quantitative","s":"Number System","q":"Find the remainder when 3^56 is divided by 7.","o":["4","1","2","3"],"a":2,"e":"Find the smallest power of 3 that leaves remainder 1 mod 7, then reduce the exponent. Result: <b>2</b>.","d":"Hard"},{"t":"Quantitative","s":"Number System","q":"Find the remainder when 3^35 is divided by 7.","o":["1","5","6","3"],"a":1,"e":"Find the smallest power of 3 that leaves remainder 1 mod 7, then reduce the exponent. Result: <b>5</b>.","d":"Hard"},{"t":"Quantitative","s":"Number System","q":"Find the remainder when 3^67 is divided by 5.","o":["3","4","1","2"],"a":3,"e":"Find the smallest power of 3 that leaves remainder 1 mod 5, then reduce the exponent. Result: <b>2</b>.","d":"Hard"},{"t":"Quantitative","s":"Progressions","q":"Find the sum of the cubes of the first 50 natural numbers.","o":["1625625","3251250","2500","812812"],"a":0,"e":"Formula: [n(n+1)/2]\u00b2 with n = 50 \u2192 <b>1625625</b>.","d":"Medium"},{"t":"Quantitative","s":"Progressions","q":"Find the sum of the first 15 terms of the AP 5, 9, 13, \u2026","o":["990","495","61","247"],"a":1,"e":"Last term = 5+(15\u22121)\u00d74 = 61. Sum = n/2 \u00d7 (first + last) = 15/2 \u00d7 (5+61) = <b>495</b>.","d":"Medium"},{"t":"Quantitative","s":"Progressions","q":"Find the sum of the first 10 terms of the AP 3, 8, 13, \u2026","o":["255","510","48","127"],"a":0,"e":"Last term = 3+(10\u22121)\u00d75 = 48. Sum = n/2 \u00d7 (first + last) = 10/2 \u00d7 (3+48) = <b>255</b>.","d":"Medium"},{"t":"Quantitative","s":"Progressions","q":"Find the sum of the first 10 terms of the AP 7, 12, 17, \u2026","o":["295","147","590","52"],"a":0,"e":"Last term = 7+(10\u22121)\u00d75 = 52. Sum = n/2 \u00d7 (first + last) = 10/2 \u00d7 (7+52) = <b>295</b>.","d":"Medium"},{"t":"Quantitative","s":"Progressions","q":"Find the sum of the first 10 terms of the AP 5, 10, 15, \u2026","o":["137","550","50","275"],"a":3,"e":"Last term = 5+(10\u22121)\u00d75 = 50. Sum = n/2 \u00d7 (first + last) = 10/2 \u00d7 (5+50) = <b>275</b>.","d":"Medium"},{"t":"Quantitative","s":"Permutations & Combinations","q":"In how many ways can 2 people be selected from a group of 10?","o":["90","10","20","45"],"a":3,"e":"Order does not matter \u2192 combination. C(10,2) = <b>45</b>. (If order mattered it would be P(10,2) = 90.)","d":"Easy"},{"t":"Quantitative","s":"Permutations & Combinations","q":"In how many ways can 2 people be selected from a group of 7?","o":["7","21","14","42"],"a":1,"e":"Order does not matter \u2192 combination. C(7,2) = <b>21</b>. (If order mattered it would be P(7,2) = 42.)","d":"Easy"},{"t":"Quantitative","s":"Permutations & Combinations","q":"From 7 men and 5 women, in how many ways can a committee of 2 men and 3 women be formed?","o":["420","31","792","210"],"a":3,"e":"Choose independently and multiply: C(7,2) \u00d7 C(5,3) = 21 \u00d7 10 = <b>210</b>.","d":"Medium"},{"t":"Quantitative","s":"Permutations & Combinations","q":"From 6 men and 5 women, in how many ways can a committee of 2 men and 3 women be formed?","o":["25","462","150","300"],"a":2,"e":"Choose independently and multiply: C(6,2) \u00d7 C(5,3) = 15 \u00d7 10 = <b>150</b>.","d":"Medium"},{"t":"Quantitative","s":"Permutations & Combinations","q":"From 7 men and 5 women, in how many ways can a committee of 3 men and 2 women be formed?","o":["350","700","45","792"],"a":0,"e":"Choose independently and multiply: C(7,3) \u00d7 C(5,2) = 35 \u00d7 10 = <b>350</b>.","d":"Medium"},{"t":"Logical Reasoning","s":"Clocks","q":"Find the angle between the hands of a clock at 12:10.","o":["60\u00b0","360\u00b0","125\u00b0","55\u00b0"],"a":3,"e":"Angle = |30H \u2212 5.5M| = |30\u00d712 \u2212 5.5\u00d710| = 305\u00b0, and since this exceeds 180\u00b0 we take 360 \u2212 305 \u2192 <b>55\u00b0</b>.","d":"Medium"},{"t":"Logical Reasoning","s":"Clocks","q":"Find the angle between the hands of a clock at 7:25.","o":["72.5\u00b0","210\u00b0","90\u00b0","150\u00b0"],"a":0,"e":"Angle = |30H \u2212 5.5M| = |30\u00d77 \u2212 5.5\u00d725| = 72.5\u00b0 \u2192 <b>72.5\u00b0</b>.","d":"Medium"},{"t":"Logical Reasoning","s":"Clocks","q":"Find the angle between the hands of a clock at 6:25.","o":["150\u00b0","180\u00b0","35\u00b0","42.5\u00b0"],"a":3,"e":"Angle = |30H \u2212 5.5M| = |30\u00d76 \u2212 5.5\u00d725| = 42.5\u00b0 \u2192 <b>42.5\u00b0</b>.","d":"Medium"},{"t":"Logical Reasoning","s":"Clocks","q":"Find the angle between the hands of a clock at 7:20.","o":["80\u00b0","100\u00b0","120\u00b0","210\u00b0"],"a":1,"e":"Angle = |30H \u2212 5.5M| = |30\u00d77 \u2212 5.5\u00d720| = 100\u00b0 \u2192 <b>100\u00b0</b>.","d":"Medium"},{"t":"Logical Reasoning","s":"Clocks","q":"Find the angle between the hands of a clock at 6:20.","o":["35\u00b0","120\u00b0","70\u00b0","180\u00b0"],"a":2,"e":"Angle = |30H \u2212 5.5M| = |30\u00d76 \u2212 5.5\u00d720| = 70\u00b0 \u2192 <b>70\u00b0</b>.","d":"Medium"},{"t":"Logical Reasoning","s":"Clocks","q":"Find the angle between the hands of a clock at 4:25.","o":["120\u00b0","17.5\u00b0","9\u00b0","150\u00b0"],"a":1,"e":"Angle = |30H \u2212 5.5M| = |30\u00d74 \u2212 5.5\u00d725| = 17.5\u00b0 \u2192 <b>17.5\u00b0</b>.","d":"Medium"},{"t":"Logical Reasoning","s":"Cubes","q":"A cube is painted on all faces and then cut into 125 equal smaller cubes. How many smaller cubes have exactly two face(s) painted?","o":["8","54","36","27"],"a":2,"e":"With n = 5 per edge: 12(n\u22122) = <b>36</b>. (Corners = 8 always, edges = 12(n\u22122), faces = 6(n\u22122)\u00b2, interior = (n\u22122)\u00b3.)","d":"Medium"},{"t":"Logical Reasoning","s":"Calendars","q":"If 1 January 2027 was a Tuesday, what day was 1 January 2028? (2027 is an ordinary year.)","o":["Tuesday","Thursday","Friday","Wednesday"],"a":3,"e":"An ordinary year has 365 days = 1 odd day. Tuesday + 1 = <b>Wednesday</b>.","d":"Medium"},{"t":"Logical Reasoning","s":"Calendars","q":"If 1 January 2026 was a Thursday, what day was 1 January 2027? (2026 is an ordinary year.)","o":["Sunday","Friday","Saturday","Thursday"],"a":1,"e":"An ordinary year has 365 days = 1 odd day. Thursday + 1 = <b>Friday</b>.","d":"Medium"},{"t":"Logical Reasoning","s":"Calendars","q":"If 1 January 2024 was a Monday, what day was 1 January 2025? (2024 is a leap year.)","o":["Tuesday","Monday","Thursday","Wednesday"],"a":3,"e":"A leap year has 366 days = 2 odd days. Monday + 2 = <b>Wednesday</b>.","d":"Medium"},{"t":"Logical Reasoning","s":"Calendars","q":"If 1 January 2025 was a Thursday, what day was 1 January 2026? (2025 is an ordinary year.)","o":["Sunday","Thursday","Friday","Saturday"],"a":2,"e":"An ordinary year has 365 days = 1 odd day. Thursday + 1 = <b>Friday</b>.","d":"Medium"},{"t":"Logical Reasoning","s":"Calendars","q":"If 1 January 2024 was a Saturday, what day was 1 January 2025? (2024 is a leap year.)","o":["Monday","Tuesday","Saturday","Sunday"],"a":0,"e":"A leap year has 366 days = 2 odd days. Saturday + 2 = <b>Monday</b>.","d":"Medium"},{"t":"Quantitative","s":"Percentages","q":"Find 15% of 800.","o":["12","120","53.33","200"],"a":1,"e":"15% of 800 = 800 \u00d7 15/100 = <b>120</b>. Faster: 15% = 3/20 of the number.","d":"Easy"},{"t":"Quantitative","s":"Percentages","q":"Find 20% of 640.","o":["128","192","12.8","32"],"a":0,"e":"20% of 640 = 640 \u00d7 20/100 = <b>128</b>. Faster: 20% = 1/5 of the number.","d":"Easy"},{"t":"Quantitative","s":"Percentages","q":"Find 25% of 960.","o":["24","38.4","240","336"],"a":2,"e":"25% of 960 = 960 \u00d7 25/100 = <b>240</b>. Faster: 25% = 1/4 of the number.","d":"Easy"},{"t":"Quantitative","s":"Percentages","q":"Find 35% of 320.","o":["9.14","112","144","11.2"],"a":1,"e":"35% of 320 = 320 \u00d7 35/100 = <b>112</b>. Faster: 35% = 7/20 of the number.","d":"Easy"},{"t":"Quantitative","s":"Percentages","q":"Find 40% of 640.","o":["16","25.6","320","256"],"a":3,"e":"40% of 640 = 640 \u00d7 40/100 = <b>256</b>. Faster: 40% = 2/5 of the number.","d":"Easy"},{"t":"Quantitative","s":"Percentages","q":"A number is increased by 25% and then decreased by 20%. Find the net percentage change.","o":["-5%","5%","40%","0%"],"a":3,"e":"Successive change = a + b + ab/100 with b negative: 25 \u2212 20 \u2212 (25\u00d720)/100 = <b>0%</b> (decrease). The naive answer 5% ignores the cross term.","d":"Medium"},{"t":"Quantitative","s":"Percentages","q":"In a two-candidate election the winner got 65% of the votes and won by 800 votes. Find the total number of votes.","o":["2285.71","2666.67","1600","1230.77"],"a":1,"e":"Margin = 65% \u2212 35% = 30% of total = 800 \u2192 total = 800 \u00d7 100/30 = <b>2666.67</b>.","d":"Medium"},{"t":"Quantitative","s":"Percentages","q":"In an exam 40% failed in Maths, 50% failed in English and 15% failed in both. What percent passed in both subjects?","o":["75%","25%","10%","85%"],"a":1,"e":"Failed in at least one = 40 + 50 \u2212 15 = 75%. Passed in both = 100 \u2212 75 = <b>25%</b>. Subtract the overlap or you double-count.","d":"Medium"},{"t":"Quantitative","s":"Percentages","q":"In an exam 35% failed in Maths, 50% failed in English and 15% failed in both. What percent passed in both subjects?","o":["30%","85%","15%","70%"],"a":0,"e":"Failed in at least one = 35 + 50 \u2212 15 = 70%. Passed in both = 100 \u2212 70 = <b>30%</b>. Subtract the overlap or you double-count.","d":"Medium"},{"t":"Quantitative","s":"Percentages","q":"In an exam 35% failed in Maths, 50% failed in English and 25% failed in both. What percent passed in both subjects?","o":["60%","40%","15%","75%"],"a":1,"e":"Failed in at least one = 35 + 50 \u2212 25 = 60%. Passed in both = 100 \u2212 60 = <b>40%</b>. Subtract the overlap or you double-count.","d":"Medium"},{"t":"Quantitative","s":"Profit & Loss","q":"An article costing \u20b9200 is sold at a profit of 25%. Find the selling price.","o":["50","250","150","225"],"a":1,"e":"SP = CP(100+P)/100 = 200 \u00d7 125/100 = <b>\u20b9250</b>.","d":"Easy"},{"t":"Quantitative","s":"Profit & Loss","q":"An article costing \u20b9500 is sold at a profit of 40%. Find the selling price.","o":["300","700","200","540"],"a":1,"e":"SP = CP(100+P)/100 = 500 \u00d7 140/100 = <b>\u20b9700</b>.","d":"Easy"},{"t":"Quantitative","s":"Profit & Loss","q":"An article costing \u20b9800 is sold at a profit of 15%. Find the selling price.","o":["815","120","920","680"],"a":2,"e":"SP = CP(100+P)/100 = 800 \u00d7 115/100 = <b>\u20b9920</b>.","d":"Easy"},{"t":"Quantitative","s":"Profit & Loss","q":"An article bought for \u20b9300 is sold for \u20b9450. Find the profit percentage.","o":["20%","33.33%","150%","50%"],"a":3,"e":"Profit% = (SP\u2212CP)/CP \u00d7 100 = 150/300 \u00d7 100 = <b>50%</b>. Profit is always on COST price, never on SP.","d":"Easy"},{"t":"Quantitative","s":"Profit & Loss","q":"A shopkeeper marks his goods 60% above cost and then allows a discount of 10%. Find his net profit percentage.","o":["50%","-50%","70%","44%"],"a":3,"e":"Take CP = 100 \u2192 MP = 160 \u2192 SP = 160 \u00d7 0.9 = 144 \u2192 profit = <b>44%</b>. Markup is on CP but discount is on MP, so you cannot just subtract.","d":"Medium"},{"t":"Quantitative","s":"Profit & Loss","q":"Two articles are each sold for \u20b9120. One is sold at a profit of 10% and the other at a loss of 10%. What is the net result?","o":["1%","-1%","10%","0%"],"a":1,"e":"Whenever two items sell at the SAME price with equal \u00b110%, the result is always a LOSS of x\u00b2/100 = <b>1%</b>. Never break-even.","d":"Medium"},{"t":"Quantitative","s":"Simple & Compound Interest","q":"Find the simple interest on \u20b912000 at 5% per annum for 4 years.","o":["600","2400","14400","240"],"a":1,"e":"SI = PRT/100 = 12000\u00d75\u00d74/100 = <b>\u20b92400</b>.","d":"Easy"},{"t":"Quantitative","s":"Simple & Compound Interest","q":"Find the simple interest on \u20b95000 at 5% per annum for 4 years.","o":["100","1000","6000","250"],"a":1,"e":"SI = PRT/100 = 5000\u00d75\u00d74/100 = <b>\u20b91000</b>.","d":"Easy"},{"t":"Quantitative","s":"Simple & Compound Interest","q":"Find the simple interest on \u20b96000 at 5% per annum for 3 years.","o":["900","6900","300","90"],"a":0,"e":"SI = PRT/100 = 6000\u00d75\u00d73/100 = <b>\u20b9900</b>.","d":"Easy"},{"t":"Quantitative","s":"Simple & Compound Interest","q":"Find the simple interest on \u20b98000 at 8% per annum for 4 years.","o":["10560","640","256","2560"],"a":3,"e":"SI = PRT/100 = 8000\u00d78\u00d74/100 = <b>\u20b92560</b>.","d":"Easy"},{"t":"Quantitative","s":"Simple & Compound Interest","q":"Find the simple interest on \u20b96000 at 10% per annum for 3 years.","o":["180","1800","600","7800"],"a":1,"e":"SI = PRT/100 = 6000\u00d710\u00d73/100 = <b>\u20b91800</b>.","d":"Easy"},{"t":"Quantitative","s":"Simple & Compound Interest","q":"Find the compound interest on \u20b98000 at 10% per annum for 2 years.","o":["1600","3360","9680","1680"],"a":3,"e":"A = P(1+R/100)\u00b2 = 8000 \u00d7 1.21 = 9680; CI = A \u2212 P = <b>\u20b91680</b>. (SI would be only \u20b91600.)","d":"Medium"},{"t":"Quantitative","s":"Simple & Compound Interest","q":"Find the difference between compound and simple interest on \u20b95000 at 20% per annum for 2 years.","o":["2000","400","200","1000"],"a":2,"e":"Difference for 2 years = P(R/100)\u00b2 = 5000 \u00d7 (20/100)\u00b2 = <b>\u20b9200</b>. Memorise this \u2014 it appears constantly.","d":"Medium"},{"t":"Quantitative","s":"Simple & Compound Interest","q":"A sum doubles in 4 years at compound interest. In how many years will it become 8 times itself?","o":["14 years","16 years","32 years","12 years"],"a":3,"e":"8 = 2^3, so it needs 3 doubling periods \u2192 3 \u00d7 4 = <b>12 years</b>. At CI growth is multiplicative, not linear.","d":"Medium"},{"t":"Quantitative","s":"Simple & Compound Interest","q":"A sum doubles in 6 years at compound interest. In how many years will it become 8 times itself?","o":["14 years","48 years","18 years","24 years"],"a":2,"e":"8 = 2^3, so it needs 3 doubling periods \u2192 3 \u00d7 6 = <b>18 years</b>. At CI growth is multiplicative, not linear.","d":"Medium"},{"t":"Quantitative","s":"Ratio & Proportion","q":"\u20b91200 is divided among A, B and C in the ratio 3 : 4 : 5. Find C's share.","o":["300","400","500","1000"],"a":2,"e":"Total parts = 12. C gets 5/12 \u00d7 1200 = <b>\u20b9500</b>.","d":"Easy"},{"t":"Quantitative","s":"Ratio & Proportion","q":"The present ages of two people are in the ratio 2 : 3. After 6 years the ratio becomes 3 : 4. Find the present age of the younger one.","o":["12 years","24 years","18 years","9 years"],"a":0,"e":"Let the ages be 2x and 3x. Then (2x+6)/(3x+6) = 3/4 \u2192 x = 6 \u2192 younger = 2x = <b>12 years</b>.","d":"Medium"},{"t":"Quantitative","s":"Ratio & Proportion","q":"The present ages of two people are in the ratio 5 : 7. After 5 years the ratio becomes 3 : 4. Find the present age of the younger one.","o":["40 years","35 years","30 years","25 years"],"a":3,"e":"Let the ages be 5x and 7x. Then (5x+5)/(7x+5) = 3/4 \u2192 x = 5 \u2192 younger = 5x = <b>25 years</b>.","d":"Medium"},{"t":"Quantitative","s":"Averages","q":"The average of 11 numbers is 25. If one number, 37, is removed, find the average of the remaining numbers.","o":["25","21.64","26","23.8"],"a":3,"e":"Sum = 11\u00d725 = 275. Remaining sum = 275\u221237 = 238, over 10 numbers \u2192 <b>23.8</b>.","d":"Medium"},{"t":"Quantitative","s":"Averages","q":"The average of 7 numbers is 30. If one number, 40, is removed, find the average of the remaining numbers.","o":["31.25","24.29","30","28.33"],"a":3,"e":"Sum = 7\u00d730 = 210. Remaining sum = 210\u221240 = 170, over 6 numbers \u2192 <b>28.33</b>.","d":"Medium"},{"t":"Quantitative","s":"Averages","q":"The average of 9 numbers is 25. If one number, 37, is removed, find the average of the remaining numbers.","o":["26.2","25","20.89","23.5"],"a":3,"e":"Sum = 9\u00d725 = 225. Remaining sum = 225\u221237 = 188, over 8 numbers \u2192 <b>23.5</b>.","d":"Medium"},{"t":"Quantitative","s":"Averages","q":"The average of 11 numbers is 20. If one number, 36, is removed, find the average of the remaining numbers.","o":["18.4","20","21.33","16.73"],"a":0,"e":"Sum = 11\u00d720 = 220. Remaining sum = 220\u221236 = 184, over 10 numbers \u2192 <b>18.4</b>.","d":"Medium"},{"t":"Quantitative","s":"Averages","q":"The average weight of 12 people increases by 1.5 kg when a new person replaces one weighing 45 kg. Find the weight of the new person.","o":["27 kg","18 kg","63 kg","46.5 kg"],"a":2,"e":"Total increase = 12 \u00d7 1.5 = 18 kg, so the new person is 18 kg heavier: 45 + 18 = <b>63 kg</b>.","d":"Medium"},{"t":"Quantitative","s":"Averages","q":"The average weight of 8 people increases by 3 kg when a new person replaces one weighing 55 kg. Find the weight of the new person.","o":["24 kg","58 kg","79 kg","31 kg"],"a":2,"e":"Total increase = 8 \u00d7 3 = 24 kg, so the new person is 24 kg heavier: 55 + 24 = <b>79 kg</b>.","d":"Medium"},{"t":"Quantitative","s":"Averages","q":"The average weight of 12 people increases by 1.5 kg when a new person replaces one weighing 55 kg. Find the weight of the new person.","o":["56.5 kg","73 kg","37 kg","18 kg"],"a":1,"e":"Total increase = 12 \u00d7 1.5 = 18 kg, so the new person is 18 kg heavier: 55 + 18 = <b>73 kg</b>.","d":"Medium"},{"t":"Quantitative","s":"Averages","q":"The average weight of 12 people increases by 1.5 kg when a new person replaces one weighing 65 kg. Find the weight of the new person.","o":["83 kg","47 kg","66.5 kg","18 kg"],"a":0,"e":"Total increase = 12 \u00d7 1.5 = 18 kg, so the new person is 18 kg heavier: 65 + 18 = <b>83 kg</b>.","d":"Medium"},{"t":"Quantitative","s":"Averages","q":"The average weight of 12 people increases by 2 kg when a new person replaces one weighing 60 kg. Find the weight of the new person.","o":["84 kg","24 kg","62 kg","36 kg"],"a":0,"e":"Total increase = 12 \u00d7 2 = 24 kg, so the new person is 24 kg heavier: 60 + 24 = <b>84 kg</b>.","d":"Medium"},{"t":"Quantitative","s":"Mixtures & Alligation","q":"In what ratio must an item costing \u20b915/kg be mixed with one costing \u20b925/kg to get a mixture worth \u20b917/kg?","o":["1 : 1","4 : 1","1 : 4","15 : 25"],"a":1,"e":"Alligation: cheaper : dearer = (d\u2212m) : (m\u2212c) = (25\u221217) : (17\u221215) = <b>4 : 1</b>.","d":"Medium"},{"t":"Quantitative","s":"Mixtures & Alligation","q":"In what ratio must an item costing \u20b920/kg be mixed with one costing \u20b930/kg to get a mixture worth \u20b924/kg?","o":["3 : 2","20 : 30","2 : 3","1 : 1"],"a":0,"e":"Alligation: cheaper : dearer = (d\u2212m) : (m\u2212c) = (30\u221224) : (24\u221220) = <b>3 : 2</b>.","d":"Medium"},{"t":"Quantitative","s":"Mixtures & Alligation","q":"In what ratio must an item costing \u20b915/kg be mixed with one costing \u20b925/kg to get a mixture worth \u20b919/kg?","o":["1 : 1","2 : 3","15 : 25","3 : 2"],"a":3,"e":"Alligation: cheaper : dearer = (d\u2212m) : (m\u2212c) = (25\u221219) : (19\u221215) = <b>3 : 2</b>.","d":"Medium"},{"t":"Quantitative","s":"Time & Work","q":"A can do a work in 20 days and B in 30 days. They work together for 3 days, after which B leaves. How many more days will A take to finish?","o":["22.5 days","15 days","17 days","9 days"],"a":1,"e":"LCM = 60 units. A = 3/day, B = 2/day. In 3 days together: 5\u00d73 = 15 units. Remaining 45 units \u00f7 3 = <b>15 days</b>.","d":"Medium"},{"t":"Quantitative","s":"Time & Work","q":"24 men complete a work in 10 days. How many men are needed to complete the same work in 6 days?","o":["30 men","40 men","18 men","14.4 men"],"a":1,"e":"Men \u00d7 days is constant: 24\u00d710 = M\u00d76 \u2192 M = <b>40 men</b>.","d":"Easy"},{"t":"Quantitative","s":"Time & Work","q":"20 men complete a work in 18 days. How many men are needed to complete the same work in 8 days?","o":["12 men","45 men","8.89 men","28 men"],"a":1,"e":"Men \u00d7 days is constant: 20\u00d718 = M\u00d78 \u2192 M = <b>45 men</b>.","d":"Easy"},{"t":"Quantitative","s":"Time & Work","q":"24 men complete a work in 12 days. How many men are needed to complete the same work in 8 days?","o":["36 men","20 men","16 men","32 men"],"a":0,"e":"Men \u00d7 days is constant: 24\u00d712 = M\u00d78 \u2192 M = <b>36 men</b>.","d":"Easy"},{"t":"Quantitative","s":"Time, Speed & Distance","q":"Walking at 6 km/h a man reaches his office 10 minutes late; at 8 km/h he arrives 10 minutes early. Find the distance to his office.","o":["16 km","8 km","14 km","2 km"],"a":1,"e":"Time difference = 10+10 = 20 min = 0.33 h. d/6 \u2212 d/8 = 0.33 \u2192 d = <b>8
